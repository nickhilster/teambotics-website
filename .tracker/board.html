<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>teambotics-website — Issue Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0e0f11; --panel:#17181b; --panel-2:#1d1f23; --border:#2a2c31;
    --text:#e7e8ea; --muted:#9a9ca3; --accent:#5e6ad2;
    --backlog:#8a8f98; --unstarted:#e2b203; --started:#5e6ad2; --completed:#3fb950; --canceled:#8a8f98;
    --urgent:#eb5757; --high:#f2994a; --medium:#e2b203; --low:#4d90fe; --none:#5c5e63;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .count{color:var(--muted);font-size:13px}
  input[type="search"], select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px}
  input[type="search"]{min-width:220px}
  .view-toggle{display:flex;gap:6px;margin-left:auto}
  .view-toggle button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .view-toggle button.active{color:var(--text);border-color:var(--accent)}
  main{padding:16px 20px}
  .board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
  .column{background:var(--panel);border-radius:10px;min-width:280px;max-width:300px;flex:1 0 280px;border:1px solid var(--border)}
  .column-header{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
  .dot{width:8px;height:8px;border-radius:50%}
  .column-body{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 160px);overflow-y:auto}
  .card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;font-size:13px}
  .card:hover{border-color:var(--accent)}
  .card .id{color:var(--muted);font-size:11px;margin-bottom:4px}
  .card .title{margin-bottom:8px;line-height:1.35}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
  .priority{font-weight:600}
  .priority.Urgent{color:var(--urgent)} .priority.High{color:var(--high)} .priority.Medium{color:var(--medium)} .priority.Low{color:var(--low)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  table th, table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  table tbody tr{cursor:pointer}
  table tbody tr:hover{background:var(--panel-2)}
  .hidden{display:none !important}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:20}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
  .modal h2{margin-top:0}
  .modal .close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .modal .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}
  .modal .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
  .modal p{line-height:1.5}
  .modal pre{background:var(--panel-2);padding:10px;border-radius:6px;overflow-x:auto}
  .modal code{background:var(--panel-2);padding:1px 4px;border-radius:4px}
  .comment{border-left:2px solid var(--border);padding-left:10px;margin-bottom:14px}
  .comment .who{font-size:12px;color:var(--muted);margin-bottom:4px}
  a{color:var(--accent)}
</style>
</head>

ion homepage label with its current Early access detail-page label.\n- [ ] Verify Code2Motion's public demo path. Track its separate embed-isolation and other audit findings in the Code2Motion repository before exposing untrusted creator content.\n- [ ] Check the mobile layout, especially the method and proposal cards, after the chat-control fix.\n- [x] Verify real contact-form database delivery; Instinct reports an end-to-end Neon write on 10 October.\n- [x] Document a daily manual lead-check procedure. No mail provider is configured in Vercel as of 10 October.\n- [ ] Add a lead notification path after a mail provider and recipient inbox are supplied.\n- [ ] Add the booking destination when Nikhil supplies it, or keep the working brief form and email path.\n- [ ] Obtain final copy and visual review, then verify the approved build on production after cutover.","comments":[{"author":"Instinct","date":"2026-10-09T21:51:17-04:00","text":"The testing v1 is a go on direction and no-go for production. Requested removal of payment and placeholder booking copy, mobile chat overlap fix, a concrete method example, frontline-service mention, simpler proof heading, and a less decorative contact panel. Nikhil confirmed these decisions directly in the project chat.","html":"\u003cp>The testing v1 is a go on direction and no-go for production. Requested removal of payment and placeholder booking copy, mobile chat overlap fix, a concrete method example, frontline-service mention, simpler proof heading, and a less decorative contact panel. Nikhil confirmed these decisions directly in the project chat.\u003c/p>"},{"author":"Instinct","date":"2026-10-10T06:14:28-04:00","text":"Nikhil asked for Code2Motion to display Early access on the homepage to match its current detail page. Instinct reports the lead form wrote to Neon's leads table in an end-to-end test, but no new-lead notification is configured. The Code2Motion security and product audit is separate from this website release."," hared Chat Backend","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-25T23:24:00-04:00","updatedAt":"2026-10-25T23:24:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"**Shared counterpart:** [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md). The portfolio repo owns the common backend contract; this issue owns the Teambotics website integration.\n\n### Work\n- [ ] Audit `app/api/chat/route.ts`, `lib/chat/runtime.ts`, `components/chatbot/ChatbotWidget.tsx`, site shell, grounding, logging, admin behavior and failover.\n- [ ] Replace independent chat runtime with adapter to canonical backend while preserving distinct Teambotics voice, site context and approved *public* company sources.\n- [ ] Enforce authorization and site/source isolation server-side; portfolio private data, personal conversation history and other tenants' knowledge must not leak into public answers.\n- [ ] Keep moderation/rate limits, instrumentation and lead-form behavior stable; document migration, rollback, versioned API and cost.\n- [ ] Validate at `testing.teambotics.app` with smoke, e2e, accessibility and security tests; owner approves production cutover.\n\n### Acceptance\n- [ ] Both websites use the same backend while behaving differently for their visitors; no cross-site knowledge leakage and no silent loss of the old site's features.\n\n**Depends on:** [NIK-001](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-001.md) and [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md); **unblocks product gate:** [CBT-001](https://github.com/nickhilster/CuriousBot/blob/main/.tracker/issues/CBT-001.md).","descriptionHtml":"\u003cdiv style=\"white-space:pre-wrap\">**Shared counterpart:** [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md). The portfolio repo owns the common backend contract; this issue owns the Teambotics website integration.\n\n### Work\n- [ ] Audit `app/api/chat/route.ts`, `lib/chat/runtime.ts`, `components/chatbot/ChatbotWidget.tsx`, site shell, grounding, logging, admin behavior and failover.\n- [ ] Replace independent chat runtime with adapter to canonical backend while preserving distinct Teambotics voice, site context and approved *public* company sources.\n- [ ] Enforce authorization and site/source isolation server-side; portfolio private data, personal conversation history and other tenants' knowledge must not leak into public answers.\n- [ ] Keep moderation/rate limits, instrumentation and lead-form behavior stable; document migration, rollback, versioned API and cost.\n- [ ] Validate at `testing.teambotics.app` with smoke, e2e, accessibility and security tests; owner approves production cutover.\n\n### Acceptance\n- [ ] Both websites use the same backend while behaving differently for their visitors; no cross-site knowledge leakage and no silent loss of the old site's features.\n\n**Depends on:** [NIK-001](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-001.md) and [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md); **unblocks product gate:** [CBT-001](https://github.com/nickhilster/CuriousBot/blob/main/.tracker/issues/CBT-001.md).\u003c/div>","comments":[],"_file":"TBW-002.md"},{"id":"TBW-003","title":"Site-specific proactive curiosity and guided discovery for Teambotics visitors","status":"Todo","statusType":"unstarted","priority":"Medium","labels":["Shared","Website","Experience","Chatbot"],"assignee":null,"createdBy":"Nikhil K","project":"NikBot / Teambotics Shared Chat Backend","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-25T23:24:00-04:00","updatedAt":"2026-10-25T23:24:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"The Teambotics site should invite meaningful questions before visitors have to invent them, but should not turn into a copy of the NikBot portfolio assistant.\n\n### Work\n- [ ] Design page- and intent-aware opening questions for customers, collaborators and readers; keep them optional, accessible and non-intrusive.\n- [ ] Ask useful follow-ups; handle disagreements, limitations and escalation to human contacts respectfully.\n- [ ] Answer only using site-approved company knowledge with evidence; do not overclaim prototype maturity, pilot deployments, partnerships or endorsements.\n- [ ] Verify public privacy, mobile experience, lead funnel interoperability and anonymous-visitor behavior.\n- [ ] Reuse the discovery pattern from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md) while retaining distinct site persona and source permissions.\n\n### Acceptance\n- [ ] Site visitors can start meaningful two-way conversations tailored to company context without losing ordinary navigation.\n\n**Depends on:** [TBW-002](https://github.com/nickhilster/teambotics-website/blob/main/.tracker/issues/TBW-002.md) and UX learning from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md).","descriptionHtml":"\u003cdiv style=\"white-space:pre-wrap\">The Teambotics site should invite meaningful questions before visitors have to invent them, but should not turn into a copy of the NikBot portfolio assistant.\n\n### Work\n- [ ] Design page- and intent-aware opening questions for customers, collaborators and readers; keep them optional, accessible and non-intrusive.\n- [ ] Ask useful follow-ups; handle disagreements, limitations and escalation to human contacts respectfully.\n- [ ] Answer only using site-approved company knowledge with evidence; do not overclaim prototype maturity, pilot deployments, partnerships or endorsements.\n- [ ] Verify public privacy, mobile experience, lead funnel interoperability and anonymous-visitor behavior.\n- [ ] Reuse the discovery pattern from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md) while retaining distinct site persona and source permissions.\n\n### Acceptance\n- [ ] Site visitors can start meaningful two-way conversations tailored to company context without losing ordinary navigation.\n\n**Depends on:** [TBW-002](https://github.com/nickhilster/teambotics-website/blob/main/.tracker/issues/TBW-002.md) and UX learning from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md).\u003c/div>","comments":[],"_file":"TBW-003.md"},{"id":"TEA-272","title":"Configure production secrets and seed Teambotics site knowledge","status":"Todo","statusType":"unstarted","priority":"High","labels":["Human + AI","Testing","Ops"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:49.577Z","updatedAt":"2026-05-08T04:37:49.577Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-272/configure-production-secrets-and-seed-teambotics-site-knowledge","gitBranchName":"nickhilster/tea-272-configure-production-secrets-and-seed-teambotics-site","description":"## Description\r\n\r\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\r\n\r\nCurrent repo state:\r\n\r\n* `scripts/seed-teambotics-knowledge.ts` can seed approved site/product/company knowledge into Neon.\r\n* Chat runtime can use database retrieval when OpenAI and Neon are configured.\r\n* Local validation is green: lint, typecheck, unit tests, build, and E2E all passed.\r\n\r\nNeeded outcome:\r\n\r\n* Configure production environment variables in Vercel.\r\n* Run the first production site knowledge seed.\r\n* Verify the public chatbot answers with sources from the seeded corpus.\r\n\r\nRequired env:\r\n\r\n* `OPENAI_API_KEY`\ s do?\" and \"What is LTB Buddy?\" return sourced answers.\u003c/li>\u003cli>Unsupported/private-client questions are refused or redirected without invented claims.\u003c/li>\u003c/ul>"},{"id":"TEA-273","title":"Configure private GitHub ingestion and verify protected 48-hour cron","status":"Todo","statusType":"unstarted","priority":"High","labels":["Human + AI","Testing","Ops","Security"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:50.956Z","updatedAt":"2026-05-08T04:37:50.956Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-273/configure-private-github-ingestion-and-verify-protected-48-hour-cron","gitBranchName":"nickhilster/tea-273-configure-private-github-ingestion-and-verify-protected-48","description":"## Description\r\n\r\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\r\n\r\nCurrent repo state:\r\n\r\n* `lib/chat/githubIngestion.ts` implements private GitHub knowledge ingestion.\r\n* `scripts/ingest-github-knowledge.ts` supports manual ingestion.\r\n* `/api/cron/ingest-github` is protected by `CRON_SECRET`.\r\n* `vercel.json` schedules ingestion at `0 6 */2 * *`.\r\n\r\nNeeded outcome:\r\n\r\n* Configure private repo ingestion safely in production.\r\n* Trigger a protected manual run once.\r\n* Confirm scheduled 48-hour refresh can run without exposing private repo URLs or sensitive files.\r\n\r\nRequired env:\r\n\r\n* `CRON_SECRET`\r\n* `GITHUB_INGEST_TOKEN`\r\n* `GITHUB_INGEST_REPOS`\r\n* `OPENAI_API_KEY`\r\n* one Neon/Postgres URL\r\n\r\nAcceptance criteria:\r\n\r\n* Unauthenticated cron request is rejected.\r\n* Authenticated manual cron or script run succeeds.\r\n* Ingestion records source and run metadata.\r\n* Selected files exclude env files, secrets, lockfiles, generated build output, and other low-signal sources.\r\n* Chatbot can cite GitHub-derived knowledge only where appropriate.","comments":[],"_file":"TEA-273.md","descriptionHtml":"\u003ch4>Description\u003c/h4>\u003cp>Repo-grounded follow-up from the 2026-05-08 \u003ccode>teambotics-website\u003c/code> sync.\u003c/p>\u003cp>Current repo state:\u003c/p>\u003cul>\u003cli>\u003ccode>lib/chat/githubIngestion.ts\u003c/code> implements private GitHub knowledge ingestion.\u003c/li>\u003cli>\u003ccode>scripts/ingest-github-knowledge.ts\u003c/code> supports manual ingestion.\u003c/li>\u003cli>\u003ccode>/api/cron/ingest-github\u003c/code> is protected by \u003ccode>CRON_SECRET\u003c/code>.\u003c/li>\u003cli>\u003ccode>vercel.json\u003c/code> schedules ingestion at \u003ccode>0 6 \u003cem>/2 \u003c/em> *\u003c/code>.\u003c/li>\u003c/ul>\u003cp>Needed outcome:\u003c/p>\u003cul>\u003cli>Configure private repo ingestion safely in production.\u003c/li>\u003cli>Trigger a protected manual run once.\u003c/li>\u003cli>Confirm scheduled 48-hour refresh can run without exposing private repo URLs or sensitive files.\u003c/li>\u003c/ul>\u003cp>Required env:\u003c/p>\u003cul>\u003cli>\u003ccode>CRON_SECRET\u003c/code>\u003c/li>\u003cli>\u003ccode>GITHUB_INGEST_TOKEN\u003c/code>\u003c/li>\u003cli>\u003ccode>GITHUB_INGEST_REPOS\u003c/code>\u003c/li>\u003cli>\u003ccode>OPENAI_API_KEY\u003c/code>\u003c/li>\u003cli>one Neon/Postgres URL\u003c/li>\u003c/ul>\u003cp>Acceptance criteria:\u003c/p>\u003cul>\u003cli>Unauthenticated cron request is rejected.\u003c/li>\u003cli>Authenticated manual cron or script run succeeds.\u003c/li>\u003cli>Ingestion records source and run metadata.\u003c/li>\u003cli>Selected files exclude env files, secrets, lockfiles, generated build output, and other low-signal sources.\u003c/li>\u003cli>Chatbot can cite GitHub-derived knowledge only where appropriate.\u003c/li>\u003c/ul>"},{"id":"TEA-274","title":"Reconcile product grounding docs with implemented case-study copy","status":"Todo","statusType":"unstarted","priority":"Medium","labels":["Human + AI","PM","Im ersists to production Neon or fails with the intended fallback message.\u003c/li>\u003cli>Chatbot returns sourced answers for supported Teambotics questions.\u003c/li>\u003cli>Chatbot refuses unsupported, private, or professional-advice questions.\u003c/li>\u003cli>Admin login gate still protects \u003ccode>/admin/chatbot\u003c/code> and \u003ccode>/admin/theme\u003c/code>.\u003c/li>\u003c/ul>"},{"id":"TEA-276","title":"Decide whether to keep or retire legacy placeholder redirect routes","status":"Done","statusType":"completed","priority":"Low","labels":["PM","Improvement"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:59:08.094Z","updatedAt":"2026-05-08T05:03:21.022Z","startedAt":null,"completedAt":"2026-05-08T05:03:20.934Z","canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-276/decide-whether-to-keep-or-retire-legacy-placeholder-redirect-routes","gitBranchName":"nickhilster/tea-276-decide-whether-to-keep-or-retire-legacy-placeholder-redirect","description":"## Description\r\n\r\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\r\n\r\nDecision: retire the legacy placeholder redirect routes rather than keep compatibility shims.\r\n\r\nCompleted changes:\r\n\r\n* Removed `/github-placeholder` route shim.\r\n* Removed `/linkedin-placeholder` route shim.\r\n* Removed `/privacy-placeholder` route shim.\r\n* Removed `/terms-placeholder` route shim.\r\n* Removed `/products/easybuddy-placeholder` route shim.\r\n* Removed `/products/ltb-buddy-placeholder` route shim.\r\n* Added E2E coverage asserting all retired placeholder URLs now return the site 404 page instead of redirecting.\r\n\r\nValidation:\r\n\r\n* `pnpm lint` passed.\r\n* `pnpm typecheck` passed after clearing stale generated `.next` route types.\r\n* `pnpm test` passed: 10 files / 24 tests.\r\n* `pnpm build` passed; production route manifest no longer includes placeholder routes.\r\n* `pnpm test:e2e` passed: 14 Playwright tests.\r\n\r\nResidual note:\r\n\r\n* Playwright/Node emitted existing `DEP0205` warnings during E2E/build, but no validation command failed.","comments":[],"_file":"TEA-276.md","descriptionHtml":"\u003ch4>Description\u003c/h4>\u003cp>Repo-grounded follow-up from the 2026-05-08 \u003ccode>teambotics-website\u003c/code> sync.\u003c/p>\u003cp>Decision: retire the legacy placeholder redirect routes rather than keep compatibility shims.\u003c/p>\u003cp>Completed changes:\u003c/p>\u003cul>\u003cli>Removed \u003ccode>/github-placeholder\u003c/code> route shim.\u003c/li>\u003cli>Removed \u003ccode>/linkedin-placeholder\u003c/code> route shim.\u003c/li>\u003cli>Removed \u003ccode>/privacy-placeholder\u003c/code> route shim.\u003c/li>\u003cli>Removed \u003ccode>/terms-placeholder\u003c/code> route shim.\u003c/li>\u003cli>Removed \u003ccode>/products/easybuddy-placeholder\u003c/code> route shim.\u003c/li>\u003cli>Removed \u003ccode>/products/ltb-buddy-placeholder\u003c/code> route shim.\u003c/li>\u003cli>Added E2E coverage asserting all retired placeholder URLs now return the site 404 page instead of redirecting.\u003c/li>\u003c/ul>\u003cp>Validation:\u003c/p>\u003cul>\u003cli>\u003ccode>pnpm lint\u003c/code> passed.\u003c/li>\u003cli>\u003ccode>pnpm typecheck\u003c/code> passed after clearing stale generated \u003ccode>.next\u003c/code> route types.\u003c/li>\u003cli>\u003ccode>pnpm test\u003c/code> passed: 10 files / 24 tests.\u003c/li>\u003cli>\u003ccode>pnpm build\u003c/code> passed; production route manifest no longer includes placeholder routes.\u003c/li>\u003cli>\u003ccode>pnpm test:e2e\u003c/code> passed: 14 Playwright tests.\u003c/li>\u003c/ul>\u003cp>Residual note:\u003c/p>\u003cul>\u003cli>Playwright/Node emitted existing \u003ccode>DEP0205\u003c/code> warnings during E2E/build, but no validation command failed.\u003c/li>\u003c/ul>"}];
const COLUMNS = [
  {key:'backlog', label:'Backlog', color:'var(--backlog)'},
  {key:'unstarted', label:'Todo', color:'var(--unstarted)'},
  {key:'started', label:'In Progress', color:'var(--started)'},
  {key:'completed', label:'Done', color:'var(--completed)'},
  {key:'canceled', label:'Canceled', color:'var(--canceled)'},
];

let state = { search:'', priority:'', label:'', view:'board' };

function allLabels(){
  const s = new Set();
  ISSUES.forEach(i => (i.labels||[]).forEach(l => l && s.add(l)));
  return [...s].sort();
}
function allPriorities(){
  const s = new Set();
  ISSUES.forEach(i => i.priority && s.add(i.priority));
  return [...s];
}

function populateFilters(){
  const pf = document.getElementById('priorityFilter');
  allPriorities().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; pf.appendChild(o); });
  const lf = document.getElementById('labelFilter');
  allLabels().forEach(l => { const o=document.createElement('option'); o.value=l; o.textContent=l; lf.appendChild(o); });
}

function filtered(){
  return ISSUES.filter(i => {
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!((i.title||'').toLowerCase().includes(q) || (i.id||'').toLowerCase().includes(q))) return false;
    }
    if (state.priority && i.priority !== state.priority) return false;
    if (state.label && !(i.labels||[]).includes(state.label)) return false;
    return true;
  });
}

function renderBoard(){
  const root = document.getElementById('board');
  root.innerHTML = '';
  const items = filtered();
  COLUMNS.forEach(col => {
    const colIssues = items.filter(i => (i.statusType||'').toLowerCase() === col.key);
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = '<div class="column-header"><span class="dot" style="background:' + col.color + '"></span>' + col.label + ' <span style="color:var(--muted);font-weight:400">(' + colIssues.length + ')</span></div><div class="column-body"></div>';
    const body = colEl.querySelector('.column-body');
    colIssues.forEach(i => body.appendChild(card(i)));
    root.appendChild(colEl);
  });
}

function card(i){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = '<div class="id">' + i.id + '</div>' +
    '<div class="title">' + escapeHtml(i.title||'') + '</div>' +
    '<div class="meta">' +
      (i.priority ? '<span class="badge priority ' + i.priority + '">' + i.priority + '</span>' : '') +
      (i.labels||[]).map(l => '<span class="badge">' + escapeHtml(l) + '</span>').join('') +
      (i.comments && i.comments.length ? '<span class="badge">💬 ' + i.comments.length + '</span>' : '') +
    '</div>';
  el.addEventListener('click', () => openModal(i));
  return el;
}

function renderList(){
  const tbody = document.querySelector('#list tbody');
  tbody.innerHTML = '';
  filtered().forEach(i => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + i.id + '</td><td>' + escapeHtml(i.title||'') + '</td><td>' + escapeHtml(i.status||'') + '</td><td>' + escapeHtml(i.priority||'') + '</td><td>' + (i.labels||[]).join(', ') + '</td><td>' + (i.updatedAt ? i.updatedAt.slice(0,10) : '') + '</td>';
    tr.addEventListener('click', () => openModal(i));
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openModal(i){
  const root = document.getElementById('modalRoot');
  const sub = (i.subIssues||[]).map(id => '<li>' + id + '</li>').join('');
  root.innerHTML = '<div class="overlay" id="overlay"><div class="modal">' +
    '<button class="close" id="closeModal">×</button>' +
    '<div class="id">' + i.id + (i.linearUrl ? ' — <a href="' + i.linearUrl + '" target="_blank" rel="noopener">Linear</a>' : '') + '</div>' +
    '<h2>' + escapeHtml(i.title||'') + '</h2>' +
    '<div class="meta-row">' +
      '<span>Status: <strong>' + escapeHtml(i.status||'') + '</strong></span>' +
      (i.priority ? '<span>Priority: <strong>' + i.priority + '</strong></span>' : '') +
      (i.assignee ? '<span>Assignee: ' + escapeHtml(i.assignee) + '</span>' : '') +
      (i.project ? '<span>Project: ' + escapeHtml(i.project) + '</span>' : '') +
      (i.milestone ? '<span>Milestone: ' + escapeHtml(i.milestone) + '</span>' : '') +
      (i.parent ? '<span>Parent: ' + i.parent + '</span>' : '') +
    '</div>' +
    (i.description ? i.descriptionHtml : '<p style="color:var(--muted)">No description.</p>') +
    (sub ? '<div class="section-title">Sub-issues</div><ul>' + sub + '</ul>' : '') +
    (i.comments && i.comments.length ? '<div class="section-title">Comments (' + i.comments.length + ')</div>' + i.comments.map(c => '<div class="comment"><div class="who">' + escapeHtml(c.author) + ' — ' + escapeHtml(c.date) + '</div>' + c.html + '</div>').join('') : '') +
    '</div></div>';
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function renderAll(){
  document.getElementById('count').textContent = filtered().length + ' / ' + ISSUES.length + ' issues';
  if (state.view === 'board') { document.getElementById('board').classList.remove('hidden'); document.getElementById('list').classList.add('hidden'); renderBoard(); }
  else { document.getElementById('board').classList.add('hidden'); document.getElementById('list').classList.remove('hidden'); renderList(); }
}

document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; renderAll(); });
document.getElementById('priorityFilter').addEventListener('change', e => { state.priority = e.target.value; renderAll(); });
document.getElementById('labelFilter').addEventListener('change', e => { state.label = e.target.value; renderAll(); });
document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    renderAll();
  });
});

populateFilters();
renderAll();
</script>
</body>
</html>
