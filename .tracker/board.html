<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>teambotics-website — Issue Tracker</title>

<style>
  :root{
    --bg:#0e0f11; --panel:#17181b; --panel-2:#1d1f23; --border:#2a2c31;
    --text:#e7e8ea; --muted:#9a9ca3; --accent:#5e6ad2;
    --backlog:#8a8f98; --unstarted:#e2b203; --started:#5e6ad2; --completed:#3fb950; --canceled:#8a8f98;
    --urgent:#eb5757; --high:#f2994a; --medium:#e2b203; --low:#4d90fe; --none:#5c5e63;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .count{color:var(--muted);font-size:13px}
  input[type="search"], select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px}
  input[type="search"]{min-width:220px}
  .view-toggle{display:flex;gap:6px;margin-left:auto}
  .view-toggle button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .view-toggle button.active{color:var(--text);border-color:var(--accent)}
  main{padding:16px 20px}
  .board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
  .column{background:var(--panel);border-radius:10px;min-width:280px;max-width:300px;flex:1 0 280px;border:1px solid var(--border)}
  .column-header{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
  .dot{width:8px;height:8px;border-radius:50%}
  .column-body{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 160px);overflow-y:auto}
  .card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;font-size:13px}
  .card:hover{border-color:var(--accent)}
  .card .id{color:var(--muted);font-size:11px;margin-bottom:4px}
  .card .title{margin-bottom:8px;line-height:1.35}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
  .priority{font-weight:600}
  .priority.Urgent{color:var(--urgent)} .priority.High{color:var(--high)} .priority.Medium{color:var(--medium)} .priority.Low{color:var(--low)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  table th, table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  table tbody tr{cursor:pointer}
  table tbody tr:hover{background:var(--panel-2)}
  .hidden{display:none !important}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:20}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
  .modal h2{margin-top:0}
  .modal .close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .modal .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}
  .modal .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
  .modal p{line-height:1.5}
  .modal pre{background:var(--panel-2);padding:10px;border-radius:6px;overflow-x:auto}
  .modal code{background:var(--panel-2);padding:1px 4px;border-radius:4px}
  .comment{border-left:2px solid var(--border);padding-left:10px;margin-bottom:14px}
  .comment .who{font-size:12px;color:var(--muted);margin-bottom:4px}
  a{color:var(--accent)}
</style>
</head>

const ISSUES = [{"id":"TBW-001","title":"Finish consultancy homepage proof and release checks","status":"In Progress","statusType":"started","priority":"High","labels":["Website","Release","Testing"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-10T02:00:00.000Z","updatedAt":"2026-10-10T11:25:04.000Z","startedAt":"2026-10-10T02:00:00.000Z","completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":"codex/website-overhaul-spec","description":"## Description\n\nThe consultancy homepage is being reviewed at `testing.teambotics.app`. Nikhil confirmed the decisions relayed by Instinct on 9 October 2026. Keep `www.teambotics.app` on the current site until the full overhaul is approved.\n\n### Confirmed public-copy and proof rules\n\n- No payment language in public RBH or IKOKI copy. Label RBH Marketer Agent **Submitted prototype** and IKOKI **Prototype delivered**. RBH was built after Nikhil's RBH role; campaign drafts require human compliance review. Do not imply adoption, deployment, approval, or endorsement.\n- Code2Motion holds the third product slot with equal weight and uses the public **Early access** label to match its detail page. Small Wonder is out of the homepage proof row. LoopBox is off the table entirely; ownership was transferred to RBH in September 2025.\n- A broad buyer and forward-deployed working method lead the page. Frontline customer service is a flagship path. The two-week pilot is only a proposed starting format scoped per engagement.\n\n### Remaining work before production review\n\n- [ ] Prepare a sanitized RBH workflow demo video with voiceover. Instinct will perform the voiceover and supply audio via Google Drive. Keep source code and live gated deployment private; demo access is by request.\n- [ ] Add approved visual previews to proof cards and keep different evidence types visually distinguishable.\n- [x] Reconcile the Code2Mot ver.\u003c/div\u003e"},{"id":"TBW-002","title":"[Shared] Replace Teambotics assistant with the unified NikBot backend","status":"Todo","statusType":"unstarted","priority":"High","labels":["Shared","Website","Chatbot","Security"],"assignee":null,"createdBy":"Nikhil K","project":"NikBot / Teambotics Shared Chat Backend","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-25T23:24:00-04:00","updatedAt":"2026-10-25T23:24:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"**Shared counterpart:** [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md). The portfolio repo owns the common backend contract; this issue owns the Teambotics website integration.\n\n### Work\n- [ ] Audit `app/api/chat/route.ts`, `lib/chat/runtime.ts`, `components/chatbot/ChatbotWidget.tsx`, site shell, grounding, logging, admin behavior and failover.\n- [ ] Replace independent chat runtime with adapter to canonical backend while preserving distinct Teambotics voice, site context and approved *public* company sources.\n- [ ] Enforce authorization and site/source isolation server-side; portfolio private data, personal conversation history and other tenants' knowledge must not leak into public answers.\n- [ ] Keep moderation/rate limits, instrumentation and lead-form behavior stable; document migration, rollback, versioned API and cost.\n- [ ] Validate at `testing.teambotics.app` with smoke, e2e, accessibility and security tests; owner approves production cutover.\n\n### Acceptance\n- [ ] Both websites use the same backend while behaving differently for their visitors; no cross-site knowledge leakage and no silent loss of the old site's features.\n\n**Depends on:** [NIK-001](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-001.md) and [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md); **unblocks product gate:** [CBT-001](https://github.com/nickhilster/CuriousBot/blob/main/.tracker/issues/CBT-001.md).","descriptionHtml":"\u003cdiv style=\"white-space:pre-wrap\"\u003e**Shared counterpart:** [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md). The portfolio repo owns the common backend contract; this issue owns the Teambotics website integration.\n\n### Work\n- [ ] Audit `app/api/chat/route.ts`, `lib/chat/runtime.ts`, `components/chatbot/ChatbotWidget.tsx`, site shell, grounding, logging, admin behavior and failover.\n- [ ] Replace independent chat runtime with adapter to canonical backend while preserving distinct Teambotics voice, site context and approved *public* company sources.\n- [ ] Enforce authorization and site/source isolation server-side; portfolio private data, personal conversation history and other tenants' knowledge must not leak into public answers.\n- [ ] Keep moderation/rate limits, instrumentation and lead-form behavior stable; document migration, rollback, versioned API and cost.\n- [ ] Validate at `testing.teambotics.app` with smoke, e2e, accessibility and security tests; owner approves production cutover.\n\n### Acceptance\n- [ ] Both websites use the same backend while behaving differently for their visitors; no cross-site knowledge leakage and no silent loss of the old site's features.\n\n**Depends on:** [NIK-001](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-001.md) and [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md); **unblocks product gate:** [CBT-001](https://github.com/nickhilster/CuriousBot/blob/main/.tracker/issues/CBT-001.md).\u003c/div\u003e","comments":[],"_file":"TBW-002.md"},{"id":"TBW-003","title":"Site-specific proactive curiosity and guided discovery for Teambotics visitors","status":"Todo","statusType":"unstarted","priority":"Medium","labels":["Shared","Website","Experience","Chatbot"],"assignee":null,"createdBy":"Nikhil K","project":"NikBot / Teambotics Shared Chat Backend","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-25T23:24:00-04:00","updatedAt":"2026-10-25T23:24:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"The Teambotics site should invite meaningful questions before visitors have to invent them, but should not turn into a copy of the NikBot portfolio assistant.\n\n### Work\n- [ ] Design page- and intent-aware opening questions for customers, collaborators and readers; keep them optional, accessible and non-intrusive.\n- [ ] Ask useful follow-ups; handle disagreements, limitations and escalation to human contacts respectfully.\n- [ ] Answer only using site-approved company knowledge with evidence; do not overclaim prototype maturity, pilot deployments, partnerships or endorsements.\n- [ ] Verify public privacy, mobile experience, lead funnel interoperability and anonymous-visitor behavior.\n- [ ] Reuse the discovery pattern from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md) while retaining distinct site persona and source permissions.\n\n### Acceptance\n- [ ] Site visitors can start meaningful two-way conversations tailored to company context without losing ordinary navigation.\n\n**Depends on:** [TBW-002](https://github.com/nickhilster/teambotics-website/blob/main/.tracker/issues/TBW-002.md) and UX learning from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md).","descriptionHtml":"\u003cdiv style=\"white-space:pre-wrap\"\u003eThe Teambotics site should invite meaningful questions before visitors have to invent them, but should not turn into a copy of the NikBot portfolio assistant.\n\n### Work\n- [ ] Design page- and intent-aware opening questions for customers, collaborators and readers; keep them optional, accessible and non-intrusive.\n- [ ] Ask useful follow-ups; handle disagreements, limitations and escalation to human contacts respectfully.\n- [ ] Answer only using site-approved company knowledge with evidence; do not overclaim prototype maturity, pilot deployments, partnerships or endorsements.\n- [ ] Verify public privacy, mobile experience, lead funnel interoperability and anonymous-visitor behavior.\n- [ ] Reuse the discovery pattern from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md) while retaining distinct site persona and source permissions.\n\n### Acceptance\n- [ ] Site visitors can start meaningful two-way conversations tailored to company context without losing ordinary navigation.\n\n**Depends on:** [TBW-002](https://github.com/nickhilster/teambotics-website/blob/main/.tracker/issues/TBW-002.md) and UX learning from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md).\u003c/div\u003e","comments":[],"_file":"TBW-003.md"},{"id":"TBW-004","title":"Roll out Teambotics tagline: Learn. Commit. Push.","status":"Todo","statusType":"unstarted","priority":"High","labels":["Brand","Website","Copy","Shared"],"assignee":null,"createdBy":"David (per Nik)","project":"Teambotics Website","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-26T10:39:00-04:00","updatedAt":"2026-10-26T10:39:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"## Description\n\n**Human decision (Nik, 2026-10-26):** Adopt the company-wide Teambotics tagline **“Learn. Commit. Push.”** Exact punctuation, capitalization, order, and English wording matter. This is not a Git slogan or a claim that Teambotics only builds software. “Learn” is intentionally human-first; the Git interpretation of commit/push is a secondary layer. The quiet inspiration is *Jai Bhim* and the emancipatory spirit of “Educate. Agitate. Organize.” This connection should be preserved in internal brand provenance, without imposing an explanatory paragraph under every public appearance.\n\n**Canonical decision:** [Teambotics company brand](https://github.com/nickhilster/Teambotics/blob/main/company/brand.md). **Cross-repo coordination:** [Hangar rollout](https://github.com/nickhilster/hangar/blob/main/plans/2026-10-26-teambotics-tagline-rollout.md).\n\n### Website work\n- [ ] Make “Learn. Commit. Push.” visibly legible as the primary company tagline on the homepage, while keeping the service proposition distinct.\n- [ ] Reflect the tagline consistently in global header/footer or other appropriate brand lockups and metadata, mobile + desktop, light + dark themes.\n- [ ] Preserve the exact English tagline on English, French Canadian, and Latin American Spanish variants; localize accompanying explanatory copy, not the branded line.\n- [ ] Audit About, Manifesto, SEO/structured data, social previews, blog and marketing pages for contradictions and opportunities to align; do not erase useful, truthful service descriptions.\n- [ ] Review copy for accessibility, responsive line wrapping, semantics, and translations.\n- [ ] Run pnpm translations:check, lint, typecheck, test, build; review on testing.teambotics.app before publishing production.\n- [ ] Confirm the live www.teambotics.app site reflects the approved line after production release.\n\n### Company-wide rollout (tracked centrally)\n- [ ] Align the Teambotics knowledge repo, Hangar pointer, and public website.\n- [ ] Audit sales/proposal decks, templates, outreach, email signatures, applications, social bios, public company profiles, LinkedIn, blog signatures, and common channel assets.\n- [ ] Human review of external communications that carry the new line.\n\n### Creative disclaimer (approved; NOT the tagline)\n“Everything’s computer.” — President of the United States of America, 2025\n“Everything’s AI.” — Teambotics, 2026\n\n- [x] Place both lines together in a discreet site-wide footer block on the feature branch ([PR #38](https://github.com/nickhilster/teambotics-website/pull/38)); do not displace the tagline.\n- [x] Link the 2025 POTUS attribution to the verified [March 11, 2025 Roll Call / Factba.se transcript at 20:32–20:47](https://rollcall.com/factbase/trump/transcript/donald-trump-press-gaggle-tesla-vehicles-white-house-march-11-2025).\n- [ ] Verify layout, legibility, keyboard focus and external link on desktop/mobile, homepage and interior routes across languages, plus preview build and human approval.\n- [ ] Merge and verify the live public site only after review.\n\n### Journalistic sourcing and media-literacy page (2026-10-26)\n\n- [x] The POTUS citation in the shared footer now routes internally to `/everythings-computer`, an archival Teambotics page; the Teambotics 2026 citation links to [nikdesign.ca](https://nikdesign.ca).\n- [x] The archive has the original White House photograph with credit, primary government transcription, a CNN broadcast transcript, and a clearly separate bibliography of reporting by multiple outlets.\n- [x] The archive now explicitly supports quality journalism, encourages readers to visit publishers and subscribe/contribute when able, and explains why source transparency matters when AI accelerates misinformation/disinformation.\n- [x] Feature [**Designing for Truth**](https://blog.nikdesign.ca/posts/designing-for-truth) (NikDesign Journal): SynFo, provenance, contextual verification, and media-literacy-first UX.\n- [ ] Review the page's exact article labels and live link integrity, image reproduction/credit, accessibility, mobile layout, and preview.\n- [ ] Merge and verify the public route only after human approval.\n\n**Status:** Implemented in [draft PR #38](https://github.com/nickhilster/teambotics-website/pull/38), not production-published.\n\n### Acceptance\n- [ ] All relevant public surfaces use the exact approved tagline where appropriate.\n- [ ] Existing product/service descriptions remain accurate; the brand now visibly puts human learning and agency first.\n- [ ] Staging checks pass, Nik approves, production is deployed and actually verified.\n- [ ] Communications-channel updates are tracked to completion, with no claims of publication before verification.\n\n**Provenance:** Direct instruction by Nik in the 2026-10-26 conversation.","comments":[],"_file":"TBW-004.md","descriptionHtml":"\u003ch4\u003eDescription\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003eHuman decision (Nik, 2026-10-26):\u003c/strong\u003e Adopt the company-wide Teambotics tagline \u003cstrong\u003e“Learn. Commit. Push.”\u003c/strong\u003e Exact punctuation, capitalization, order, and English wording matter. This is not a Git slogan or a claim that Teambotics only builds software. “Learn” is intentionally human-first; the Git interpretation of commit/push is a secondary layer. The quiet inspiration is \u003cem\u003eJai Bhim\u003c/em\u003e and the emancipatory spirit of “Educate. Agitate. Organize.” This connection should be preserved in internal brand provenance, without imposing an explanatory paragraph under every public appearance.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCanonical decision:\u003c/strong\u003e \u003ca href=\"https://github.com/nickhilster/Teambotics/blob/main/company/brand.md\" target=\"_blank\" rel=\"noopener\"\u003eTeambotics company brand\u003c/a\u003e. \u003cstrong\u003eCross-repo coordination:\u003c/strong\u003e \u003ca href=\"https://github.com/nickhilster/hangar/blob/main/plans/2026-10-26-teambotics-tagline-rollout.md\" target=\"_blank\" rel=\"noopener\"\u003eHangar rollout\u003c/a\u003e.\u003c/p\u003e\u003ch5\u003eWebsite work\u003c/h5\u003e\u003cdiv class=\"checkbox-line\"\u003e\u003cinput type=\"checkbox\" disabled /\u003e Make “Learn. Commit. Push.” visibly legible as the primary company tagline on the homepage, while keeping the service proposition distinct.\u003c/div\u003e\u003cdiv class=\"checkbox-line\"\u003e\u003cinput type=\"checkbox\" disabled /\u003e Reflect the tagline consistently ivacy-placeholder\u003c/code\u003e route shim.\u003c/li\u003e\u003cli\u003eRemoved \u003ccode\u003e/terms-placeholder\u003c/code\u003e route shim.\u003c/li\u003e\u003cli\u003eRemoved \u003ccode\u003e/products/easybuddy-placeholder\u003c/code\u003e route shim.\u003c/li\u003e\u003cli\u003eRemoved \u003ccode\u003e/products/ltb-buddy-placeholder\u003c/code\u003e route shim.\u003c/li\u003e\u003cli\u003eAdded E2E coverage asserting all retired placeholder URLs now return the site 404 page instead of redirecting.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eValidation:\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ccode\u003epnpm lint\u003c/code\u003e passed.\u003c/li\u003e\u003cli\u003e\u003ccode\u003epnpm typecheck\u003c/code\u003e passed after clearing stale generated \u003ccode\u003e.next\u003c/code\u003e route types.\u003c/li\u003e\u003cli\u003e\u003ccode\u003epnpm test\u003c/code\u003e passed: 10 files / 24 tests.\u003c/li\u003e\u003cli\u003e\u003ccode\u003epnpm build\u003c/code\u003e passed; production route manifest no longer includes placeholder routes.\u003c/li\u003e\u003cli\u003e\u003ccode\u003epnpm test:e2e\u003c/code\u003e passed: 14 Playwright tests.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eResidual note:\u003c/p\u003e\u003cul\u003e\u003cli\u003ePlaywright/Node emitted existing \u003ccode\u003eDEP0205\u003c/code\u003e warnings during E2E/build, but no validation command failed.\u003c/li\u003e\u003c/ul\u003e"}];
const COLUMNS = [
  {key:'backlog', label:'Backlog', color:'var(--backlog)'},
  {key:'unstarted', label:'Todo', color:'var(--unstarted)'},
  {key:'started', label:'In Progress', color:'var(--started)'},
  {key:'completed', label:'Done', color:'var(--completed)'},
  {key:'canceled', label:'Canceled', color:'var(--canceled)'},
];

let state = { search:'', priority:'', label:'', view:'board' };

function allLabels(){
  const s = new Set();
  ISSUES.forEach(i => (i.labels||[]).forEach(l => l && s.add(l)));
  return [...s].sort();
}
function allPriorities(){
  const s = new Set();
  ISSUES.forEach(i => i.priority && s.add(i.priority));
  return [...s];
}

function populateFilters(){
  const pf = document.getElementById('priorityFilter');
  allPriorities().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; pf.appendChild(o); });
  const lf = document.getElementById('labelFilter');
  allLabels().forEach(l => { const o=document.createElement('option'); o.value=l; o.textContent=l; lf.appendChild(o); });
}

function filtered(){
  return ISSUES.filter(i => {
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!((i.title||'').toLowerCase().includes(q) || (i.id||'').toLowerCase().includes(q))) return false;
    }
    if (state.priority && i.priority !== state.priority) return false;
    if (state.label && !(i.labels||[]).includes(state.label)) return false;
    return true;
  });
}

function renderBoard(){
  const root = document.getElementById('board');
  root.innerHTML = '';
  const items = filtered();
  COLUMNS.forEach(col => {
    const colIssues = items.filter(i => (i.statusType||'').toLowerCase() === col.key);
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = '<div class="column-header"><span class="dot" style="background:' + col.color + '"></span>' + col.label + ' <span style="color:var(--muted);font-weight:400">(' + colIssues.length + ')</span></div><div class="column-body"></div>';
    const body = colEl.querySelector('.column-body');
    colIssues.forEach(i => body.appendChild(card(i)));
    root.appendChild(colEl);
  });
}

function card(i){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = '<div class="id">' + i.id + '</div>' +
    '<div class="title">' + escapeHtml(i.title||'') + '</div>' +
    '<div class="meta">' +
      (i.priority ? '<span class="badge priority ' + i.priority + '">' + i.priority + '</span>' : '') +
      (i.labels||[]).map(l => '<span class="badge">' + escapeHtml(l) + '</span>').join('') +
      (i.comments && i.comments.length ? '<span class="badge">💬 ' + i.comments.length + '</span>' : '') +
    '</div>';
  el.addEventListener('click', () => openModal(i));
  return el;
}

function renderList(){
  const tbody = document.querySelector('#list tbody');
  tbody.innerHTML = '';
  filtered().forEach(i => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + i.id + '</td><td>' + escapeHtml(i.title||'') + '</td><td>' + escapeHtml(i.status||'') + '</td><td>' + escapeHtml(i.priority||'') + '</td><td>' + (i.labels||[]).join(', ') + '</td><td>' + (i.updatedAt ? i.updatedAt.slice(0,10) : '') + '</td>';
    tr.addEventListener('click', () => openModal(i));
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openModal(i){
  const root = document.getElementById('modalRoot');
  const sub = (i.subIssues||[]).map(id => '<li>' + id + '</li>').join('');
  root.innerHTML = '<div class="overlay" id="overlay"><div class="modal">' +
    '<button class="close" id="closeModal">×</button>' +
    '<div class="id">' + i.id + (i.linearUrl ? ' — <a href="' + i.linearUrl + '" target="_blank" rel="noopener">Linear</a>' : '') + '</div>' +
    '<h2>' + escapeHtml(i.title||'') + '</h2>' +
    '<div class="meta-row">' +
      '<span>Status: <strong>' + escapeHtml(i.status||'') + '</strong></span>' +
      (i.priority ? '<span>Priority: <strong>' + i.priority + '</strong></span>' : '') +
      (i.assignee ? '<span>Assignee: ' + escapeHtml(i.assignee) + '</span>' : '') +
      (i.project ? '<span>Project: ' + escapeHtml(i.project) + '</span>' : '') +
      (i.milestone ? '<span>Milestone: ' + escapeHtml(i.milestone) + '</span>' : '') +
      (i.parent ? '<span>Parent: ' + i.parent + '</span>' : '') +
    '</div>' +
    (i.description ? i.descriptionHtml : '<p style="color:var(--muted)">No description.</p>') +
    (sub ? '<div class="section-title">Sub-issues</div><ul>' + sub + '</ul>' : '') +
    (i.comments && i.comments.length ? '<div class="section-title">Comments (' + i.comments.length + ')</div>' + i.comments.map(c => '<div class="comment"><div class="who">' + escapeHtml(c.author) + ' — ' + escapeHtml(c.date) + '</div>' + c.html + '</div>').join('') : '') +
    '</div></div>';
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function renderAll(){
  document.getElementById('count').textContent = filtered().length + ' / ' + ISSUES.length + ' issues';
  if (state.view === 'board') { document.getElementById('board').classList.remove('hidden'); document.getElementById('list').classList.add('hidden'); renderBoard(); }
  else { document.getElementById('board').classList.add('hidden'); document.getElementById('list').classList.remove('hidden'); renderList(); }
}

document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; renderAll(); });
document.getElementById('priorityFilter').addEventListener('change', e => { state.priority = e.target.value; renderAll(); });
document.getElementById('labelFilter').addEventListener('change', e => { state.label = e.target.value; renderAll(); });
document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    renderAll();
  });
});

populateFilters();
renderAll();
</script>
</body>
