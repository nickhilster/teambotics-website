<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>teambotics-website — Issue Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0e0f11; --panel:#17181b; --panel-2:#1d1f23; --border:#2a2c31;
    --text:#e7e8ea; --muted:#9a9ca3; --accent:#5e6ad2;
    --backlog:#8a8f98; --unstarted:#e2b203; --started:#5e6ad2; --completed:#3fb950; --canceled:#8a8f98;
    --urgent:#eb5757; --high:#f2994a; --medium:#e2b203; --low:#4d90fe; --none:#5c5e63;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .count{color:var(--muted);font-size:13px}
  input[type="search"], select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px}
  input[type="search"]{min-width:220px}
  .view-toggle{display:flex;gap:6px;margin-left:auto}
  .view-toggle button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .view-toggle button.active{color:var(--text);border-color:var(--accent)}
  main{padding:16px 20px}
  .board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
  .column{background:var(--panel);border-radius:10px;min-width:280px;max-width:300px;flex:1 0 280px;border:1px solid var(--border)}
  .column-header{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
  .dot{width:8px;height:8px;border-radius:50%}
  .column-body{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 160px);overflow-y:auto}
  .card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;font-size:13px}
  .card:hover{border-color:var(--accent)}
  .card .id{color:var(--muted);font-size:11px;margin-bottom:4px}
  .card .title{margin-bottom:8px;line-height:1.35}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
  .priority{font-weight:600}
  .priority.Urgent{color:var(--urgent)} .priority.High{color:var(--high)} .priority.Medium{color:var(--medium)} .priority.Low{color:var(--low)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  table th, table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  table tbody tr{cursor:pointer}
  table tbody tr:hover{background:var(--panel-2)}
  .hidden{display:none !important}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:20}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
  .modal h2{margin-top:0}
  .modal .close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .modal .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}
  .modal .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
  .modal p{line-height:1.5}
  .modal pre{background:var(--panel-2);padding:10px;border-radius:6px;overflow-x:auto}
  .modal code{background:var(--panel-2);padding:1px 4px;border-radius:4px}
  .comment{border-left:2px solid var(--border);padding-left:10px;margin-bottom:14px}
  .comment .who{font-size:12px;color:var(--muted);margin-bottom:4px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>teambotics-website</h1>
  <span class="count" id="count"></span>
  <input type="search" id="search" placeholder="Search issues..." />
  <select id="priorityFilter"><option value="">All priorities</option></select>
  <select id="labelFilter"><option value="">All labels</option></select>
  <div class="view-toggle">
    <button data-view="board" class="active">Board</button>
    <button data-view="list">List</button>
  </div>
</header>
<main>
  <div id="board" class="board"></div>
  <table id="list" class="hidden">
    <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Labels</th><th>Updated</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<div id="modalRoot"></div>
<script>
const ISSUES = [{"id":"TEA-272","title":"Configure production secrets and seed Teambotics site knowledge","status":"Todo","statusType":"unstarted","priority":"High","labels":["Human + AI","Testing","Ops"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:49.577Z","updatedAt":"2026-05-08T04:37:49.577Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-272/configure-production-secrets-and-seed-teambotics-site-knowledge","gitBranchName":"nickhilster/tea-272-configure-production-secrets-and-seed-teambotics-site","description":"## Description\n\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\n\nCurrent repo state:\n\n* `scripts/seed-teambotics-knowledge.ts` can seed approved site/product/company knowledge into Neon.\n* Chat runtime can use database retrieval when OpenAI and Neon are configured.\n* Local validation is green: lint, typecheck, unit tests, build, and E2E all passed.\n\nNeeded outcome:\n\n* Configure production environment variables in Vercel.\n* Run the first production site knowledge seed.\n* Verify the public chatbot answers with sources from the seeded corpus.\n\nRequired env:\n\n* `OPENAI_API_KEY`\n* one Neon/Postgres URL: `NEON_DB_URL`, `NEON_DATABASE_URL`, `DATABASE_URL`, or `POSTGRES_URL`\n* optional: `OPENAI_CHAT_MODEL`, `OPENAI_EMBEDDING_MODEL`\n\nAcceptance criteria:\n\n* Seed run completes without errors.\n* `chatbot_ingestion_runs` records the seed run.\n* Supported questions like \"What does Teambotics do?\" and \"What is LTB Buddy?\" return sourced answers.\n* Unsupported/private-client questions are refused or redirected without invented claims.","comments":[],"_file":"TEA-272.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Current repo state:</p><ul><li><code>scripts/seed-teambotics-knowledge.ts</code> can seed approved site/product/company knowledge into Neon.</li><li>Chat runtime can use database retrieval when OpenAI and Neon are configured.</li><li>Local validation is green: lint, typecheck, unit tests, build, and E2E all passed.</li></ul><p>Needed outcome:</p><ul><li>Configure production environment variables in Vercel.</li><li>Run the first production site knowledge seed.</li><li>Verify the public chatbot answers with sources from the seeded corpus.</li></ul><p>Required env:</p><ul><li><code>OPENAI_API_KEY</code></li><li>one Neon/Postgres URL: <code>NEON_DB_URL</code>, <code>NEON_DATABASE_URL</code>, <code>DATABASE_URL</code>, or <code>POSTGRES_URL</code></li><li>optional: <code>OPENAI_CHAT_MODEL</code>, <code>OPENAI_EMBEDDING_MODEL</code></li></ul><p>Acceptance criteria:</p><ul><li>Seed run completes without errors.</li><li><code>chatbot_ingestion_runs</code> records the seed run.</li><li>Supported questions like \"What does Teambotics do?\" and \"What is LTB Buddy?\" return sourced answers.</li><li>Unsupported/private-client questions are refused or redirected without invented claims.</li></ul>"},{"id":"TEA-273","title":"Configure private GitHub ingestion and verify protected 48-hour cron","status":"Todo","statusType":"unstarted","priority":"High","labels":["Human + AI","Testing","Ops","Security"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:50.956Z","updatedAt":"2026-05-08T04:37:50.956Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-273/configure-private-github-ingestion-and-verify-protected-48-hour-cron","gitBranchName":"nickhilster/tea-273-configure-private-github-ingestion-and-verify-protected-48","description":"## Description\n\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\n\nCurrent repo state:\n\n* `lib/chat/githubIngestion.ts` implements private GitHub knowledge ingestion.\n* `scripts/ingest-github-knowledge.ts` supports manual ingestion.\n* `/api/cron/ingest-github` is protected by `CRON_SECRET`.\n* `vercel.json` schedules ingestion at `0 6 */2 * *`.\n\nNeeded outcome:\n\n* Configure private repo ingestion safely in production.\n* Trigger a protected manual run once.\n* Confirm scheduled 48-hour refresh can run without exposing private repo URLs or sensitive files.\n\nRequired env:\n\n* `CRON_SECRET`\n* `GITHUB_INGEST_TOKEN`\n* `GITHUB_INGEST_REPOS`\n* `OPENAI_API_KEY`\n* one Neon/Postgres URL\n\nAcceptance criteria:\n\n* Unauthenticated cron request is rejected.\n* Authenticated manual cron or script run succeeds.\n* Ingestion records source and run metadata.\n* Selected files exclude env files, secrets, lockfiles, generated build output, and other low-signal sources.\n* Chatbot can cite GitHub-derived knowledge only where appropriate.","comments":[],"_file":"TEA-273.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Current repo state:</p><ul><li><code>lib/chat/githubIngestion.ts</code> implements private GitHub knowledge ingestion.</li><li><code>scripts/ingest-github-knowledge.ts</code> supports manual ingestion.</li><li><code>/api/cron/ingest-github</code> is protected by <code>CRON_SECRET</code>.</li><li><code>vercel.json</code> schedules ingestion at <code>0 6 <em>/2 </em> *</code>.</li></ul><p>Needed outcome:</p><ul><li>Configure private repo ingestion safely in production.</li><li>Trigger a protected manual run once.</li><li>Confirm scheduled 48-hour refresh can run without exposing private repo URLs or sensitive files.</li></ul><p>Required env:</p><ul><li><code>CRON_SECRET</code></li><li><code>GITHUB_INGEST_TOKEN</code></li><li><code>GITHUB_INGEST_REPOS</code></li><li><code>OPENAI_API_KEY</code></li><li>one Neon/Postgres URL</li></ul><p>Acceptance criteria:</p><ul><li>Unauthenticated cron request is rejected.</li><li>Authenticated manual cron or script run succeeds.</li><li>Ingestion records source and run metadata.</li><li>Selected files exclude env files, secrets, lockfiles, generated build output, and other low-signal sources.</li><li>Chatbot can cite GitHub-derived knowledge only where appropriate.</li></ul>"},{"id":"TEA-274","title":"Reconcile product grounding docs with implemented case-study copy","status":"Todo","statusType":"unstarted","priority":"Medium","labels":["Human + AI","PM","Improvement"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:52.371Z","updatedAt":"2026-05-08T04:37:52.371Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-274/reconcile-product-grounding-docs-with-implemented-case-study-copy","gitBranchName":"nickhilster/tea-274-reconcile-product-grounding-docs-with-implemented-case-study","description":"## Description\n\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\n\nCurrent repo state:\n\n* `lib/products.ts` contains substantive case-study copy for LTB Buddy, EasyBuddy, Code2Motion, and Storytellr.\n* `docs/product-summaries.md` and `docs/chatbot-grounding-faq.md` still contain owner TODOs for EasyBuddy, Code2Motion, and Storytellr.\n* The sprint plan says unresolved placeholder product docs should not be used for chatbot grounding.\n\nNeeded outcome:\n\n* Bring documentation sources back into alignment with the implemented product copy.\n* Keep legal/compliance-sensitive disclaimers intact.\n* Mark what is approved for chatbot ingestion versus still awaiting owner/legal review.\n\nAcceptance criteria:\n\n* `docs/product-summaries.md` has confirmed summaries for all four products or clearly scoped owner blockers.\n* `docs/chatbot-grounding-faq.md` can answer all planned product FAQ prompts without TODO placeholders.\n* LTB Buddy legal-adjacent language remains conservative and does not imply legal advice.\n* Owner review status is explicit before production seeding.","comments":[],"_file":"TEA-274.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Current repo state:</p><ul><li><code>lib/products.ts</code> contains substantive case-study copy for LTB Buddy, EasyBuddy, Code2Motion, and Storytellr.</li><li><code>docs/product-summaries.md</code> and <code>docs/chatbot-grounding-faq.md</code> still contain owner TODOs for EasyBuddy, Code2Motion, and Storytellr.</li><li>The sprint plan says unresolved placeholder product docs should not be used for chatbot grounding.</li></ul><p>Needed outcome:</p><ul><li>Bring documentation sources back into alignment with the implemented product copy.</li><li>Keep legal/compliance-sensitive disclaimers intact.</li><li>Mark what is approved for chatbot ingestion versus still awaiting owner/legal review.</li></ul><p>Acceptance criteria:</p><ul><li><code>docs/product-summaries.md</code> has confirmed summaries for all four products or clearly scoped owner blockers.</li><li><code>docs/chatbot-grounding-faq.md</code> can answer all planned product FAQ prompts without TODO placeholders.</li><li>LTB Buddy legal-adjacent language remains conservative and does not imply legal advice.</li><li>Owner review status is explicit before production seeding.</li></ul>"},{"id":"TEA-275","title":"Run production launch smoke for public site, lead capture, and chatbot","status":"Todo","statusType":"unstarted","priority":"High","labels":["Human + AI","Testing","Ops"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:53.595Z","updatedAt":"2026-05-08T04:37:53.595Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-275/run-production-launch-smoke-for-public-site-lead-capture-and-chatbot","gitBranchName":"nickhilster/tea-275-run-production-launch-smoke-for-public-site-lead-capture-and","description":"## Description\n\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\n\nCurrent local validation:\n\n* `pnpm lint` passed.\n* `pnpm typecheck` passed.\n* `pnpm test` passed: 10 files / 24 tests.\n* `pnpm build` passed.\n* `pnpm test:e2e` passed: 13 Playwright tests.\n\nNeeded outcome:\n\n* Repeat a focused smoke pass against the production deployment after secrets and ingestion are configured.\n\nAcceptance criteria:\n\n* Homepage loads.\n* `/privacy` and `/terms` render real content.\n* Footer LinkedIn link points to `https://www.linkedin.com/company/teambotics-inc`.\n* Lead form submission persists to production Neon or fails with the intended fallback message.\n* Chatbot returns sourced answers for supported Teambotics questions.\n* Chatbot refuses unsupported, private, or professional-advice questions.\n* Admin login gate still protects `/admin/chatbot` and `/admin/theme`.","comments":[],"_file":"TEA-275.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Current local validation:</p><ul><li><code>pnpm lint</code> passed.</li><li><code>pnpm typecheck</code> passed.</li><li><code>pnpm test</code> passed: 10 files / 24 tests.</li><li><code>pnpm build</code> passed.</li><li><code>pnpm test:e2e</code> passed: 13 Playwright tests.</li></ul><p>Needed outcome:</p><ul><li>Repeat a focused smoke pass against the production deployment after secrets and ingestion are configured.</li></ul><p>Acceptance criteria:</p><ul><li>Homepage loads.</li><li><code>/privacy</code> and <code>/terms</code> render real content.</li><li>Footer LinkedIn link points to <code>https://www.linkedin.com/company/teambotics-inc</code>.</li><li>Lead form submission persists to production Neon or fails with the intended fallback message.</li><li>Chatbot returns sourced answers for supported Teambotics questions.</li><li>Chatbot refuses unsupported, private, or professional-advice questions.</li><li>Admin login gate still protects <code>/admin/chatbot</code> and <code>/admin/theme</code>.</li></ul>"},{"id":"TEA-276","title":"Decide whether to keep or retire legacy placeholder redirect routes","status":"Done","statusType":"completed","priority":"Low","labels":["PM","Improvement"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:59:08.094Z","updatedAt":"2026-05-08T05:03:21.022Z","startedAt":null,"completedAt":"2026-05-08T05:03:20.934Z","canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-276/decide-whether-to-keep-or-retire-legacy-placeholder-redirect-routes","gitBranchName":"nickhilster/tea-276-decide-whether-to-keep-or-retire-legacy-placeholder-redirect","description":"## Description\n\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\n\nDecision: retire the legacy placeholder redirect routes rather than keep compatibility shims.\n\nCompleted changes:\n\n* Removed `/github-placeholder` route shim.\n* Removed `/linkedin-placeholder` route shim.\n* Removed `/privacy-placeholder` route shim.\n* Removed `/terms-placeholder` route shim.\n* Removed `/products/easybuddy-placeholder` route shim.\n* Removed `/products/ltb-buddy-placeholder` route shim.\n* Added E2E coverage asserting all retired placeholder URLs now return the site 404 page instead of redirecting.\n\nValidation:\n\n* `pnpm lint` passed.\n* `pnpm typecheck` passed after clearing stale generated `.next` route types.\n* `pnpm test` passed: 10 files / 24 tests.\n* `pnpm build` passed; production route manifest no longer includes placeholder routes.\n* `pnpm test:e2e` passed: 14 Playwright tests.\n\nResidual note:\n\n* Playwright/Node emitted existing `DEP0205` warnings during E2E/build, but no validation command failed.","comments":[],"_file":"TEA-276.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Decision: retire the legacy placeholder redirect routes rather than keep compatibility shims.</p><p>Completed changes:</p><ul><li>Removed <code>/github-placeholder</code> route shim.</li><li>Removed <code>/linkedin-placeholder</code> route shim.</li><li>Removed <code>/privacy-placeholder</code> route shim.</li><li>Removed <code>/terms-placeholder</code> route shim.</li><li>Removed <code>/products/easybuddy-placeholder</code> route shim.</li><li>Removed <code>/products/ltb-buddy-placeholder</code> route shim.</li><li>Added E2E coverage asserting all retired placeholder URLs now return the site 404 page instead of redirecting.</li></ul><p>Validation:</p><ul><li><code>pnpm lint</code> passed.</li><li><code>pnpm typecheck</code> passed after clearing stale generated <code>.next</code> route types.</li><li><code>pnpm test</code> passed: 10 files / 24 tests.</li><li><code>pnpm build</code> passed; production route manifest no longer includes placeholder routes.</li><li><code>pnpm test:e2e</code> passed: 14 Playwright tests.</li></ul><p>Residual note:</p><ul><li>Playwright/Node emitted existing <code>DEP0205</code> warnings during E2E/build, but no validation command failed.</li></ul>"}];
const COLUMNS = [
  {key:'backlog', label:'Backlog', color:'var(--backlog)'},
  {key:'unstarted', label:'Todo', color:'var(--unstarted)'},
  {key:'started', label:'In Progress', color:'var(--started)'},
  {key:'completed', label:'Done', color:'var(--completed)'},
  {key:'canceled', label:'Canceled', color:'var(--canceled)'},
];

let state = { search:'', priority:'', label:'', view:'board' };

function allLabels(){
  const s = new Set();
  ISSUES.forEach(i => (i.labels||[]).forEach(l => l && s.add(l)));
  return [...s].sort();
}
function allPriorities(){
  const s = new Set();
  ISSUES.forEach(i => i.priority && s.add(i.priority));
  return [...s];
}

function populateFilters(){
  const pf = document.getElementById('priorityFilter');
  allPriorities().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; pf.appendChild(o); });
  const lf = document.getElementById('labelFilter');
  allLabels().forEach(l => { const o=document.createElement('option'); o.value=l; o.textContent=l; lf.appendChild(o); });
}

function filtered(){
  return ISSUES.filter(i => {
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!((i.title||'').toLowerCase().includes(q) || (i.id||'').toLowerCase().includes(q))) return false;
    }
    if (state.priority && i.priority !== state.priority) return false;
    if (state.label && !(i.labels||[]).includes(state.label)) return false;
    return true;
  });
}

function renderBoard(){
  const root = document.getElementById('board');
  root.innerHTML = '';
  const items = filtered();
  COLUMNS.forEach(col => {
    const colIssues = items.filter(i => (i.statusType||'').toLowerCase() === col.key);
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = '<div class="column-header"><span class="dot" style="background:' + col.color + '"></span>' + col.label + ' <span style="color:var(--muted);font-weight:400">(' + colIssues.length + ')</span></div><div class="column-body"></div>';
    const body = colEl.querySelector('.column-body');
    colIssues.forEach(i => body.appendChild(card(i)));
    root.appendChild(colEl);
  });
}

function card(i){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = '<div class="id">' + i.id + '</div>' +
    '<div class="title">' + escapeHtml(i.title||'') + '</div>' +
    '<div class="meta">' +
      (i.priority ? '<span class="badge priority ' + i.priority + '">' + i.priority + '</span>' : '') +
      (i.labels||[]).map(l => '<span class="badge">' + escapeHtml(l) + '</span>').join('') +
      (i.comments && i.comments.length ? '<span class="badge">💬 ' + i.comments.length + '</span>' : '') +
    '</div>';
  el.addEventListener('click', () => openModal(i));
  return el;
}

function renderList(){
  const tbody = document.querySelector('#list tbody');
  tbody.innerHTML = '';
  filtered().forEach(i => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + i.id + '</td><td>' + escapeHtml(i.title||'') + '</td><td>' + escapeHtml(i.status||'') + '</td><td>' + escapeHtml(i.priority||'') + '</td><td>' + (i.labels||[]).join(', ') + '</td><td>' + (i.updatedAt ? i.updatedAt.slice(0,10) : '') + '</td>';
    tr.addEventListener('click', () => openModal(i));
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openModal(i){
  const root = document.getElementById('modalRoot');
  const sub = (i.subIssues||[]).map(id => '<li>' + id + '</li>').join('');
  root.innerHTML = '<div class="overlay" id="overlay"><div class="modal">' +
    '<button class="close" id="closeModal">×</button>' +
    '<div class="id">' + i.id + (i.linearUrl ? ' — <a href="' + i.linearUrl + '" target="_blank" rel="noopener">Linear</a>' : '') + '</div>' +
    '<h2>' + escapeHtml(i.title||'') + '</h2>' +
    '<div class="meta-row">' +
      '<span>Status: <strong>' + escapeHtml(i.status||'') + '</strong></span>' +
      (i.priority ? '<span>Priority: <strong>' + i.priority + '</strong></span>' : '') +
      (i.assignee ? '<span>Assignee: ' + escapeHtml(i.assignee) + '</span>' : '') +
      (i.project ? '<span>Project: ' + escapeHtml(i.project) + '</span>' : '') +
      (i.milestone ? '<span>Milestone: ' + escapeHtml(i.milestone) + '</span>' : '') +
      (i.parent ? '<span>Parent: ' + i.parent + '</span>' : '') +
    '</div>' +
    (i.description ? i.descriptionHtml : '<p style="color:var(--muted)">No description.</p>') +
    (sub ? '<div class="section-title">Sub-issues</div><ul>' + sub + '</ul>' : '') +
    (i.comments && i.comments.length ? '<div class="section-title">Comments (' + i.comments.length + ')</div>' + i.comments.map(c => '<div class="comment"><div class="who">' + escapeHtml(c.author) + ' — ' + escapeHtml(c.date) + '</div>' + c.html + '</div>').join('') : '') +
    '</div></div>';
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function renderAll(){
  document.getElementById('count').textContent = filtered().length + ' / ' + ISSUES.length + ' issues';
  if (state.view === 'board') { document.getElementById('board').classList.remove('hidden'); document.getElementById('list').classList.add('hidden'); renderBoard(); }
  else { document.getElementById('board').classList.add('hidden'); document.getElementById('list').classList.remove('hidden'); renderList(); }
}

document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; renderAll(); });
document.getElementById('priorityFilter').addEventListener('change', e => { state.priority = e.target.value; renderAll(); });
document.getElementById('labelFilter').addEventListener('change', e => { state.label = e.target.value; renderAll(); });
document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    renderAll();
  });
});

populateFilters();
renderAll();
</script>
</body>
</html>
