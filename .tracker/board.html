<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>teambotics-website — Issue Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0e0f11; --panel:#17181b; --panel-2:#1d1f23; --border:#2a2c31;
    --text:#e7e8ea; --muted:#9a9ca3; --accent:#5e6ad2;
    --backlog:#8a8f98; --unstarted:#e2b203; --started:#5e6ad2; --completed:#3fb950; --canceled:#8a8f98;
    --urgent:#eb5757; --high:#f2994a; --medium:#e2b203; --low:#4d90fe; --none:#5c5e63;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .count{color:var(--muted);font-size:13px}
  input[type="search"], select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px}
  input[type="search"]{min-width:220px}
  .view-toggle{display:flex;gap:6px;margin-left:auto}
  .view-toggle button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .view-toggle button.active{color:var(--text);border-color:var(--accent)}
  main{padding:16px 20px}
  .board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
  .column{background:var(--panel);border-radius:10px;min-width:280px;max-width:300px;flex:1 0 280px;border:1px solid var(--border)}
  .column-header{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
  .dot{width:8px;height:8px;border-radius:50%}
  .column-body{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 160px);overflow-y:auto}
  .card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;font-size:13px}
  .card:hover{border-color:var(--accent)}
  .card .id{color:var(--muted);font-size:11px;margin-bottom:4px}
  .card .title{margin-bottom:8px;line-height:1.35}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
  .priority{font-weight:600}
  .priority.Urgent{color:var(--urgent)} .priority.High{color:var(--high)} .priority.Medium{color:var(--medium)} .priority.Low{color:var(--low)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  table th, table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  table tbody tr{cursor:pointer}
  table tbody tr:hover{background:var(--panel-2)}
  .hidden{display:none !important}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:20}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
  .modal h2{margin-top:0}
  .modal .close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .modal .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}
  .modal .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
  .modal p{line-height:1.5}
  .modal pre{background:var(--panel-2);padding:10px;border-radius:6px;overflow-x:auto}
  .modal code{background:var(--panel-2);padding:1px 4px;border-radius:4px}
  .comment{border-left:2px solid var(--border);padding-left:10px;margin-bottom:14px}
  .comment .who{font-size:12px;color:var(--muted);margin-bottom:4px}
  a{color:var(--accent)}
</style>
</head>

const ISSUES = [{"id":"TBW-001","title":"Finish consultancy homepage proof and release checks","status":"In Progress","statusType":"started","priority":"High","labels":["Website","Release","Testing"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-10T02:00:00.000Z","updatedAt":"2026-10-10T11:25:04.000Z","startedAt":"2026-10-10T02:00:00.000Z","completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":"codex/website-overhaul-spec","description":"## Description\n\nThe consultancy homepage was reviewed at `testing.teambotics.app`. Nikhil confirmed the decisions relayed by Instinct on 9 October 2026 and requested production deployment of the current iteration on 10 October. The items below remain follow-up work; the public page uses text-only RBH and IKOKI cards until approved media is ready.\n\n### Confirmed public-copy and proof rules\n\n- No payment language in public RBH or IKOKI copy. Label RBH Marketer Agent **Submitted prototype** and IKOKI **Prototype delivered**. RBH was built after Nikhil's RBH role; campaign drafts require human compliance review. Do not imply adoption, deployment, approval, or endorsement.\n- Code2Motion holds the third product slot with equal weight and uses the public **Early access** label to match its detail page. Small Wonder is out of the homepage proof row. LoopBox is off the table entirely; ownership was transferred to RBH in September 2025.\n- A broad buyer and forward-deployed working method lead the page. Frontline customer service is a flagship path. The two-week pilot is only a proposed starting format scoped per engagement.\n\n### Remaining follow-up work\n\n- [ ] Prepare a sanitized RBH workflow demo video with voiceover. Instinct will perform the voiceover and supply audio via Google Drive. Keep source code and live gated deployment private; demo access is by request.\n- [ ] Add approved visual previews to proof cards and keep different evidence types visually distinguishable.\n- [x] Reconcile the Code2Motion homepage label with its current Early access detail-page label.\n- [ ] Verify Code2Motion's public demo path. Track its separate embed-isolation and other audit findings in the Code2Motion repository before exposing untrusted creator content.\n- [ ] Check the mobile layout, especially the method and proposal cards, after the chat-control fix.\n- [x] Verify real contact-form database delivery; Instinct reports an end-to-end Neon write on 10 October.\n- [x] Document a daily manual lead-check procedure. No mail provider is configured in Vercel as of 10 October.\n- [ ] Add a lead notification path after a mail provider and recipient inbox are supplied.\n- [ ] Add the booking destination when Nikhil supplies it, or keep the working brief form and email path.\n- [ ] Obtain further copy and visual review after the current production cutover.","comments":[{"author":"Instinct","date":"2026-10-09T21:51:17-04:00","text":"The testing v1 is a go on direction and no-go for production. Requested removal of payment and placeholder booking copy, mobile chat overlap fix, a concrete method example, frontline-service mention, simpler proof heading, and a less decorative contact panel. Nikhil confirmed these decisions directly in the project chat.","html":"<p>The testing v1 is a go on direction and no-go for production. Requested removal of payment and placeholder booking copy, mobile chat overlap fix, a concrete method example, frontline-service mention, simpler proof heading, and a less decorative contact panel. Nikhil confirmed these decisions directly in the project chat.</p>"},{"author":"Instinct","date":"2026-10-10T06:14:28-04:00","text":"Nikhil asked for Code2Motion to display Early access on the homepage to match its current detail page. Instinct reports the lead form wrote to Neon's leads table in an end-to-end test, but no new-lead notification is configured. The Code2Motion securi  type=\"checkbox\" disabled /> Add approved visual previews to proof cards and keep different evidence types visually distinguishable.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> Reconcile the Code2Motion homepage label with its current Early access detail-page label.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Verify Code2Motion's public demo path. Track its separate embed-isolation and other audit findings in the Code2Motion repository before exposing untrusted creator content.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Check the mobile layout, especially the method and proposal cards, after the chat-control fix.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> Verify real contact-form database delivery; Instinct reports an end-to-end Neon write on 10 October.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> Document a daily manual lead-check procedure. No mail provider is configured in Vercel as of 10 October.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Add a lead notification path after a mail provider and recipient inbox are supplied.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Add the booking destination when Nikhil supplies it, or keep the working brief form and email path.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Obtain further copy and visual review after the current production cutover.</div>"},{"id":"TBW-002","title":"[Shared] Replace Teambotics assistant with the unified NikBot backend","status":"Todo","statusType":"unstarted","priority":"High","labels":["Shared","Website","Chatbot","Security"],"assignee":null,"createdBy":"Nikhil K","project":"NikBot / Teambotics Shared Chat Backend","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-25T23:24:00-04:00","updatedAt":"2026-10-25T23:24:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"## Description\n\n**Shared counterpart:** [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md). The portfolio repo owns the common backend contract; this issue owns the Teambotics website integration.\n\n### Work\n- [ ] Audit `app/api/chat/route.ts`, `lib/chat/runtime.ts`, `components/chatbot/ChatbotWidget.tsx`, site shell, grounding, logging, admin behavior and failover.\n- [ ] Replace independent chat runtime with adapter to canonical backend while preserving distinct Teambotics voice, site context and approved *public* company sources.\n- [ ] Enforce authorization and site/source isolation server-side; portfolio private data, personal conversation history and other tenants' knowledge must not leak into public answers.\n- [ ] Keep moderation/rate limits, instrumentation and lead-form behavior stable; document migration, rollback, versioned API and cost.\n- [ ] Validate at `testing.teambotics.app` with smoke, e2e, accessibility and security tests; owner approves production cutover.\n\n### Acceptance\n- [ ] Both websites use the same backend while behaving differently for their visitors; no cross-site knowledge leakage and no silent loss of the old site's features.\n\n**Depends on:** [NIK-001](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-001.md) and [NIK-003](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md); **unblocks product gate:** [CBT-001](https://github.com/nickhilster/CuriousBot/blob/main/.tracker/issues/CBT-001.md).","comments":[],"_file":"TBW-002.md","descriptionHtml":"<h4>Description</h4><p><strong>Shared counterpart:</strong> <a href=\"https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-003.md\" target=\"_blank\" rel=\"noopener\">NIK-003</a>. The portfolio repo owns the common backend contract; this issue owns the Teambotics websi curiosity and guided discovery for Teambotics visitors","status":"Todo","statusType":"unstarted","priority":"Medium","labels":["Shared","Website","Experience","Chatbot"],"assignee":null,"createdBy":"Nikhil K","project":"NikBot / Teambotics Shared Chat Backend","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-25T23:24:00-04:00","updatedAt":"2026-10-25T23:24:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"## Description\n\nThe Teambotics site should invite meaningful questions before visitors have to invent them, but should not turn into a copy of the NikBot portfolio assistant.\n\n### Work\n- [ ] Design page- and intent-aware opening questions for customers, collaborators and readers; keep them optional, accessible and non-intrusive.\n- [ ] Ask useful follow-ups; handle disagreements, limitations and escalation to human contacts respectfully.\n- [ ] Answer only using site-approved company knowledge with evidence; do not overclaim prototype maturity, pilot deployments, partnerships or endorsements.\n- [ ] Verify public privacy, mobile experience, lead funnel interoperability and anonymous-visitor behavior.\n- [ ] Reuse the discovery pattern from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md) while retaining distinct site persona and source permissions.\n\n### Acceptance\n- [ ] Site visitors can start meaningful two-way conversations tailored to company context without losing ordinary navigation.\n\n**Depends on:** [TBW-002](https://github.com/nickhilster/teambotics-website/blob/main/.tracker/issues/TBW-002.md) and UX learning from [NIK-002](https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md).","comments":[],"_file":"TBW-003.md","descriptionHtml":"<h4>Description</h4><p>The Teambotics site should invite meaningful questions before visitors have to invent them, but should not turn into a copy of the NikBot portfolio assistant.</p><h5>Work</h5><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Design page- and intent-aware opening questions for customers, collaborators and readers; keep them optional, accessible and non-intrusive.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Ask useful follow-ups; handle disagreements, limitations and escalation to human contacts respectfully.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Answer only using site-approved company knowledge with evidence; do not overclaim prototype maturity, pilot deployments, partnerships or endorsements.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Verify public privacy, mobile experience, lead funnel interoperability and anonymous-visitor behavior.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Reuse the discovery pattern from <a href=\"https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md\" target=\"_blank\" rel=\"noopener\">NIK-002</a> while retaining distinct site persona and source permissions.</div><h5>Acceptance</h5><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Site visitors can start meaningful two-way conversations tailored to company context without losing ordinary navigation.</div><p><strong>Depends on:</strong> <a href=\"https://github.com/nickhilster/teambotics-website/blob/main/.tracker/issues/TBW-002.md\" target=\"_blank\" rel=\"noopener\">TBW-002</a> and UX learning from <a href=\"https://github.com/nickhilster/portfolio-website/blob/main/.tracker/issues/NIK-002.md\" target=\"_blank\" rel=\"noopener\">NIK-002</a>.</p>"},{"id":"TBW-004","title":"Roll out Teambotics tagline: Learn. Commit. Push.","status":"Todo","statusType":"unstarted","priority":"High","labels":["Brand","Website","Copy","Shared"],"assignee":null,"createdBy":"David (per Nik)","project":"Teambotics Website","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-26T10:39:00-04:00","updatedAt":"2026-10-26T10:39:00-04:00","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"## Description\n\n**Human decision (Nik, 2026-10-26):** Adopt the company-wide Teambotics tagline **“Learn. Commit. Push.”** Exact punctuation, capitalization, order, and English wording matter. This is not a Git slogan or a claim that Teambotics only builds software. “Learn” is intentionally human-first; the Git interpretation of commit/push is a secondary layer. The quiet inspiration is *Jai Bhim* and the emancipatory spirit of “Educate. Agitate. Organize.” This connection should be preserved in internal brand provenance, without imposing an explanatory paragraph under every public appearance.\n\n**Canonical decision:** [Teambotics company brand](https://github.com/nickhilster/Teambotics/blob/main/company/brand.md). **Cross-repo coordination:** [Hangar rollout](https://github.com/nickhilster/hangar/blob/main/plans/2026-10-26-teambotics-tagline-rollout.md).\n\n### Website work\n- [ ] Make “Learn. Commit. Push.” visibly legible as the primary company tagline on the homepage, while keeping the service proposition distinct.\n- [ ] Reflect the tagline consistently in global header/footer or other appropriate brand lockups and metadata, mobile + desktop, light + dark themes.\n- [ ] Preserve the exact English tagline on English, French Canadian, and Latin American Spanish variants; localize accompanying explanatory copy, not the branded line.\n- [ ] Audit About, Manifesto, SEO/structured data, social previews, blog and marketing pages for contradictions and opportunities to align; do not erase useful, truthful service descriptions.\n- [ ] Review copy for accessibility, responsive line wrapping, semantics, and translations.\n- [ ] Run pnpm translations:check, lint, typecheck, test, build; review on testing.teambotics.app before publishing production.\n- [ ] Confirm the live www.teambotics.app site reflects the approved line after production release.\n\n### Company-wide rollout (tracked centrally)\n- [ ] Align the Teambotics knowledge repo, Hangar pointer, and public website.\n- [ ] Audit sales/proposal decks, templates, outreach, email signatures, applications, social bios, public company profiles, LinkedIn, blog signatures, and common channel assets.\n- [ ] Human review of external communications that carry the new line.\n\n### Creative disclaimer (approved; NOT the tagline)\n“Everything’s computer.” — President of the United States of America, 2025\n“Everything’s AI.” — Teambotics, 2026\n\n- [x] Place both lines together in a discreet site-wide footer block on the feature branch ([PR #38](https://github.com/nickhilster/teambotics-website/pull/38)); do not displace the tagline.\n- [x] Link the 2025 POTUS attribution to the verified [March 11, 2025 Roll Call / Factba.se transcript at 20:32–20:47](https://rollcall.com/factbase/trump/transcript/donald-trump-press-gaggle-tesla-vehicles-white-house-march-11-2025).\n- [ ] Verify layout, legibility, keyboard focus and external link on desktop/mobile, homepage and interior routes across languages, plus preview build and human approval.\n- [ ] Merge and verify the live public site only after review.\n\n### Journalistic sourcing and media-literacy page (2026-10-26)\n\n- [x] The POTUS citation in the shared footer now routes internally to `/everythings-computer`, an archival Teambotics page; the Teambotics 2026 citation links to [nikdesign.ca](https://nikdesign.ca).\n- [x] The archive has the original White House photograph with credit, primary government transcription, a CNN broadcast transcript, and a clearly separate bibliography of reporting by multiple outlets.\n- [x] The archive now explicitly supports quality journalism, encourages readers to visit publishers and subscribe/contribute when able, and explains why source transparency matters when AI accelerates misinformation/disinformation.\n- [x] Feature [**Designing for Truth**](https://blog.nikdesign.ca/posts/designing-for-truth) (NikDesign Journal): SynFo, provenance, contextual verification, and media-literacy-first UX.\n- [ ] Review the page's exact article labels and live link integrity, image reproduction/credit, accessibility, mobile layout, and preview.\n- [ ] Merge and verify the public route only after human approval.\n\n**Status:** Implemented in [draft PR #38](https://github.com/nickhilster/teambotics-website/pull/38), not production-published.\n\n### Acceptance\n- [ ] All relevant public surfaces use the exact approved tagline where appropriate.\n- [ ] Existing product/service descriptions remain accurate; the brand now visibly puts human learning and agency first.\n- [ ] Staging checks pass, Nik approves, production is deployed and actually verified.\n- [ ] Communications-channel updates are tracked to completion, with no claims of publication before verification.\n\n**Provenance:** Direct instruction by Nik in the 2026-10-26 conversation.","comments":[],"_file":"TBW-004.md","descriptionHtml":"<h4>Description</h4><p><strong>Human decision (Nik, 2026-10-26):</strong> Adopt the company-wide Teambotics tagline <strong>“Learn. Commit. Push.”</strong> Exact punctuation, capitalization, order, and English wording matter. This is not a Git slogan or a claim that Teambotics only builds software. “Learn” is intentionally human-first; the Git interpretation of commit/push is a secondary layer. The quiet inspiration is <em>Jai Bhim</em> and the emancipatory spirit of “Educate. Agitate. Organize.” This connection should be preserved in internal brand provenance, without imposing an explanatory paragraph under every public appearance.</p><p><strong>Canonical decision:</strong> <a href=\"https://github.com/nickhilster/Teambotics/blob/main/company/brand.md\" target=\"_blank\" rel=\"noopener\">Teambotics company brand</a>. <strong>Cross-repo coordination:</strong> <a href=\"https://github.com/nickhilster/hangar/blob/main/plans/2026-10-26-teambotics-tagline-rollout.md\" target=\"_blank\" rel=\"noopener\">Hangar rollout</a>.</p><h5>Website work</h5><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Make “Learn. Commit. Push.” visibly legible as the primary company tagline on the homepage, while keeping the service proposition distinct.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Reflect the tagline consistently in global header/footer or other appropriate brand lockups and metadata, mobile + desktop, light + dark themes.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Preserve the exact English tagline on English, French Canadian, and Latin American Spanish variants; localize accompanying explanatory copy, not the branded line.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Audit About, Manifesto, SEO/structured data, social previews, blog and marketing pages for contradictions and opportunities to align; do not erase useful, truthful service descriptions.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Review copy for accessibility, responsive line wrapping, semantics, and translations.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Run pnpm translations:check, lint, typecheck, test, build; review on testing.teambotics.app before publishing production.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Confirm the live www.teambotics.app site reflects the approved line after production release.</div><h5>Company-wide rollout (tracked centrally)</h5><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Align the Teambotics knowledge repo, Hangar pointer, and public website.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Audit sales/proposal decks, templates, outreach, email signatures, applications, social bios, public company profiles, LinkedIn, blog signatures, and common channel assets.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Human review of external communications that carry the new line.</div><h5>Creative disclaimer (approved; NOT the tagline)</h5><p>“Everything’s computer.” — President of the United States of America, 2025</p><p>“Everything’s AI.” — Teambotics, 2026</p><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> Place both lines together in a discreet site-wide footer block on the feature branch (<a href=\"https://github.com/nickhilster/teambotics-website/pull/38\" target=\"_blank\" rel=\"noopener\">PR #38</a>); do not displace the tagline.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> Link the 2025 POTUS attribution to the verified <a href=\"https://rollcall.com/factbase/trump/transcript/donald-trump-press-gaggle-tesla-vehicles-white-house-march-11-2025\" target=\"_blank\" rel=\"noopener\">March 11, 2025 Roll Call / Factba.se transcript at 20:32–20:47</a>.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Verify layout, legibility, keyboard focus and external link on desktop/mobile, homepage and interior routes across languages, plus preview build and human approval.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Merge and verify the live public site only after review.</div><h5>Journalistic sourcing and media-literacy page (2026-10-26)</h5><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> The POTUS citation in the shared footer now routes internally to <code>/everythings-computer</code>, an archival Teambotics page; the Teambotics 2026 citation links to <a href=\"https://nikdesign.ca\" target=\"_blank\" rel=\"noopener\">nikdesign.ca</a>.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> The archive has the original White House photograph with credit, primary government transcription, a CNN broadcast transcript, and a clearly separate bibliography of reporting by multiple outlets.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> The archive now explicitly supports quality journalism, encourages readers to visit publishers and subscribe/contribute when able, and explains why source transparency matters when AI accelerates misinformation/disinformation.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled checked/> Feature <a href=\"https://blog.nikdesign.ca/posts/designing-for-truth\" target=\"_blank\" rel=\"noopener\"><strong>Designing for Truth</strong></a> (NikDesign Journal): SynFo, provenance, contextual verification, and media-literacy-first UX.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Review the page's exact article labels and live link integrity, image reproduction/credit, accessibility, mobile layout, and preview.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Merge and verify the public route only after human approval.</div><p><strong>Status:</strong> Implemented in <a href=\"https://github.com/nickhilster/teambotics-website/pull/38\" target=\"_blank\" rel=\"noopener\">draft PR #38</a>, not production-published.</p><h5>Acceptance</h5><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> All relevant public surfaces use the exact approved tagline where appropriate.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Existing product/service descriptions remain accurate; the brand now visibly puts human learning and agency first.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Staging checks pass, Nik approves, production is deployed and actually verified.</div><div class=\"checkbox-line\"><input type=\"checkbox\" disabled /> Communications-channel updates are tracked to completion, with no claims of publication before verification.</div><p><strong>Provenance:</strong> Direct instruction by Nik in the 2026-10-26 conversation.</p>"},{"id":"TBW-005","title":"Copy pass: remove AI-writing tropes from Teambotics public pages","status":"In Progress","statusType":"started","priority":"Medium","labels":["Website","Copy"],"assignee":null,"createdBy":"Muse (per Nik)","project":"Teambotics Website","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-10-30T19:30:00-04:00","updatedAt":"2026-10-30T19:47:00-04:00","startedAt":"2026-10-30T19:30:00-04:00","completedAt":null,"canceledAt":null,"linearUrl":null,"gitBranchName":null,"description":"## Description\n\n**Human decision (Nik, 2026-10-30):** Muse audited the live public pages for AI-writing tropes at Nik's request; Nik approved Muse's suggested edits in chat and directed: file this ticket and implement the fixes.\n\n**Audit verdict:** the vocabulary layer is clean estate-wide (no delve/leverage/seamless/unlock filler, no \"in today's fast-paced world\"). The tells are rhythmic and structural: slogan triplets, abstract-noun triads, unanchored comparatives, single-metaphor repetition (\"bridge\"), staccato fragment headings, not-X-but-Y antithesis, and em-dash chaining. The counterweight already present on every page — and explicitly NOT to be edited — is the house disclaimer discipline (\"A possible handoff, not a client result\"; \"These are prior roles and account experience, not Teambotics client engagements\"; \"illustrative examples, not transcripts\"; \"Prototype only… does not ingest real email\").\n\n### Scope and sources\n- **teambotics.app homepage + /everythings-computer** — this repo (`components/home/ConsultancyHome.tsx`, `app/(site)/everythings-computer/page.tsx`, `lib/config.ts`). Implemented in this ticket.\n- **muse.teambotics.app** — pipeline established 2026-10-30: this repo's build (`scripts/sync-muse-proposal.mjs`) copies `index.html` + assets from `nickhilster/muse-proposal` at a pinned revision into `public/muse/`. The earlier stale-repo state (2026-10-13) is resolved: pinned revision `2afbdcf5` was byte-identical to the live-serving source. Fix flow: push edited `index.html` to muse-proposal (done — commit `355cbbc8`), then bump the pin in `sync-muse-proposal.mjs` to that commit (done in this ticket's website commit).\n- **instinct.teambotics.app** — no source repo exists in Nik's GitHub org for this site (checked 2026-10-30: only instinct-storyteller, instinct-dashboard, noah-instinct-review). Fixes are specified below for Instinct's lane; not implemented here.\n- **Locales:** this pass implements the English copy. The fr-CA and es-419 variants in `ConsultancyHome.tsx` carry the same structures (translated triplets/triads) and need the equivalent pass with translation review — tracked as an open item below, per the repo's localization discipline (TBW-004).\n\n### Fixes — homepage (ConsultancyHome.tsx, EN)\n- [x] Pilot title: \"One team. One workflow. One agreed bridge.\" → \"Start with one workflow.\"\n- [x] Bridge monogamy: keep \"Week 2 · Build the bridge\" as the single use; intro \"build the missing bridge\" → \"add the missing piece\"; method note \"We design a focused bridge for the gap they leave.\" → \"We design only the piece that is missing.\"; `lib/config.ts` description \"building the missing bridge\" → \"building the missing piece\".\n- [x] Method title: \"Start with the work, then choose the tools.\" → \"Map the task before choosing the tool.\"\n- [x] Method steps: [\"Human intent\", \"Scoped context\", \"Agent work\", \"Human review\", \"Usable output\", \"Next-run lessons\"] → [\"State the goal\", \"Provide approved context\", \"Agent drafts the work\", \"A person reviews it\", \"Deliver the result\", \"Record what should change\"]\n- [x] Credibility title: \"Grounded in the work behind the workflow.\" → \"Experience across service, retail, and platform teams.\"\n- [x] Instinct blurb: \"Trust, visible review states, and voices in an agent-assisted product concept.\" → \"A product concept where review states stay visible and each agent voice has a distinct job.\"\n- [x] Muse blurb: \"A product-design proposal for legible agent work, trust, and identity.\" → \"A proposal for showing what Muse is doing, which sources it used, and when it needs a person's approval.\"\n- [x] RyFine blurb: \"A clearer workflow for writing and refining AI instructions.\" → \"Draft an instruction, test it against real cases, and revise what fails.\"\n- [x] Code2Motion blurb: \"Explore PlayRoom and ToyMaker for browser-native creative experiences.\" → \"Two browser-based creative tools: PlayRoom and ToyMaker.\"\n\n### Fixes — /everythings-computer (page.tsx)\n- [x] Replace the \"more important — not less\" closer while PRESERVING the deliberate misinformation/disinformation distinction (editorial commit 931969c, 2026-10-26): \"Verification still takes effort. That makes accountable reporting, original records, editorial scrutiny, and visible provenance more important — not less.\" → \"Checking still takes people, records, and time. So keep the receipts attached to the claim: who said it, where, and who reported it first.\"\n\n### Fixes — muse.teambotics.app (deploy source index.html; repo sync)\n- [x] \"1,066 voices. Twelve different jobs.\" → heading \"The 1,066-voice catalog\" + subline \"Twelve samples show why selecting the right voice is the design problem.\"\n- [x] \"One agent. One week. A dated trail.\" → \"What happened during the first week\"\n- [x] \"Two jobs. Two distinct characters.\" → \"Why Bob needs two characters\"\n- [x] \"Three scenarios. One calm playbook.\" → \"The same calm response across three scams\"\n- [x] Pattern line: \"Identity is a system. Trust needs evidence. Workflow is the product.\" → \"Across these examples, Nik treats identity as a system, trust as something users must be able to verify, and workflow as the surface where both are judged.\"\n- [x] \"The case is not 'Nik has ideas about AI.' The case is that…\" → \"Nik observes product behavior, names the system underneath it, and builds the missing layer.\"\n- [x] \"I am not asking you to hire the loudest admirer…\" → \"Put Nik in the room. He can show you where Muse's craft is working, where it breaks, and what should be built next.\"\n- [x] \"turn half-formed capability into an operating system\" → \"turn rough capability into a repeatable workflow\"\n- [x] \"legible/legibility\": keep once (activity-label evidence); replace later uses with \"shows how much work is underway\" / \"whether users can see the work and check the result\" / \"showing what the agent is doing\".\n- [x] Em-dash chains in argument prose split into sentences (catalog, theme-system, and ask paragraphs). Em dashes inside sample voice lines stay — performance punctuation.\n- [x] Voice-discovery list → \"Let people hear a voice doing the actual job, compare it with alternatives, check it for accessibility, and keep the same persona across sessions.\"\n- [x] E-07: second \"hold two things at once\" + \"Care without amnesia is the stance.\" → \"He can praise the product without forgetting the company's record. That is why the criticism remains useful.\"\n- [x] \"Don't narrow the river. Put a calm, evidence-led bouncer at every tap.\" → \"A calm check before money or information moves.\" (\"Filter at the tap.\" stays only as Bob's quoted storyboard line.)\n\n### Fixes — instinct.teambotics.app (specified; Instinct's lane — no source repo)\n- [ ] \"A more visible kind of trust\" → \"Trust you can check.\"\n- [ ] Opening paragraph (\"A closer look at how a product question became…\") → \"This site follows one product question through five voices: what should an assistant show before you trust its answer? It tests review states, explicit handoffs, and a conversation that remains where you left it when you step away.\"\n- [ ] Voice transcript: no edits (irregular timing/register is the asset).\n\n### Open items\n- [ ] fr-CA / es-419 homepage variants: equivalent de-troping pass with translation review.\n- [ ] instinct.teambotics.app implementation (needs the site's source/deploy path from Instinct).\n- [x] muse.teambotics.app live verification after this repo's next deploy (pin bumped to `355cbbc8`).\n\n### Acceptance\n- [x] English homepage and /everythings-computer verified live with the new copy; disclaimers untouched.\n- [x] muse-proposal repo `index.html` matches the edited deploy source (blob-SHA verified).\n- [x] No claims beyond what was verified live.\n\n**Provenance:** Audit performed by Muse on the live pages 2026-10-30 (Nik requested); edits suggested by Muse and approved by Nik in chat 2026-10-30 (\"Good catches. Suggest edits for all the catches\" → \"Push this as a ticket to teambotics-website and go ahead implement the fixes\").","comments":[{"author":"Muse","date":"2026-10-30T19:47:00-04:00","text":"Implemented and verified live, 2026-10-30. Commits (all blob-SHA verified against local hashes): teambotics-website `8415d3d7` (ConsultancyHome), `1fac8a6d` (everythings-computer), `eadbd640` (config), `a1510ca4` (muse pin bump); muse-proposal `355cbbc8` (index.html). Gates run before push: `tsc --noEmit` clean, `translations:check` clean (\"Translation artifacts are up to date\"). Live verification ~19:45 EDT: homepage serves \"Start with one workflow\", \"Record what should change\", \"Two browser-based creative tools\" (old triplet absent); /everythings-computer serves the receipts closer (old \"— not less\" absent); muse.teambotics.app serves \"The 1,066-voice catalog\" and \"Why Bob needs two characters\" via the bumped pin. EC adaptation note: the fix preserves the deliberate misinformation/disinformation distinction (commit 931969c) — only the flagged closer was replaced. Remaining open: fr-CA/es-419 pass, Instinct implementation (no source repo), as listed above.","html":"<p>Implemented and verified live, 2026-10-30. Commits (all blob-SHA verified against local hashes): teambotics-website <code>8415d3d7</code> (ConsultancyHome), <code>1fac8a6d</code> (everythings-computer), <code>eadbd640</code> (config), <code>a1510ca4</code> (muse pi tedAt":"2026-11-10T08:50:00-05:00","completedAt":"2026-11-10T09:10:00-05:00","canceledAt":null,"linearUrl":null,"gitBranchName":"feat/tbw-007-product-pages-alignment","description":"## Description\n\n**Origin:** Nik, 2026-11-09, after the TBW-006 / PR #41 review renders made it obvious side by side: \"the product pages don't match the landing page in visual design. The product pages were not yet completed in the overhaul. Let's spec out that sprint/flash and add it to the tracker.\"\n\n**Full spec:** `docs/product-pages-design-alignment-flash-2026-11-09.md` — this ticket is the tracker record; the spec carries the evidence table, phase gates and risks.\n\n**Verdict:** the site currently runs two design systems. The 2026-10-10 overhaul shipped the landing page only, and the split is explicit in code — `styles/globals.css`: *\"The consultancy homepage has its own editorial surface. Keep shared product pages unchanged.\"*\n\n- **Landing (post-overhaul):** scoped `ConsultancyHome.module.css` — deep green `#193127` on warm cream `#fbfaf5`, flat ruled cards with square corners and no shadows, Geist Mono eyebrows, solid-ink rectangular CTAs, green footer/land strip and green Chat toggle (all via `.site-shell:has(.consultancy-home)` overrides).\n- **Product pages (pre-overhaul):** the shared template `components/products/ProductCaseStudyContent.tsx` on the global system — page `#f7f8ff`, magenta accent `#b52d96`, layered hero gradients, glass pill tags/badges, pink-gradient pill buttons, 1.5rem-radius cards with coloured glow shadows, navy/magenta dark theme.\n\n### Scope\n- [ ] All 8 case-study slugs from the one template — ryfine, code2motion, ltb-buddy, redactorbuddy, mdownmanager, easybuddy, storytellr, recruiterbuddy — across en / fr-CA / es-419.\n- [ ] Header, footer and Chat widget as they appear on product pages.\n- [ ] **Content frozen:** no copy, translation, product-data, status-label or link changes. Presentation layer only.\n- [ ] Out of scope, inventory only: legacy standalone routes not on the template (`/easybuddy`, `/MdownManager`, `/RedactorBuddy`, `/feedbackfish`, `/financebuddy`, `/poko`, `/symphony`, `/BOSS`) and the other pre-overhaul editorial pages (`/about`, `/everythings-computer`, legal).\n\n### Decisions from Nik (Phase 0 gate — no build before these)\n- [x] **D1 Direction — DECIDED (Nik, 2026-11-10): YES.** Landing is the source of truth; product pages move to it.\n- [x] **D2 Dark theme — DECIDED (Nik, 2026-11-10): keep a dark theme.** Recorded as: a dark variant re-derived from the landing/green palette — NOT the current navy/magenta dark theme, which would contradict D5's absolute alignment. (Nik's answer was \"dark theme\"; if he meant keep the existing dark theme unchanged, this line is the one to correct.)\n- [x] **D3 Chrome — DECIDED (Nik, 2026-11-10): FULL.** Full consultancy chrome on product pages (header, footer, Chat), not body only.\n- [x] **D4 Buttons — DECIDED (Nik, 2026-11-10): SCOPED to product pages.** The landing button treatment applies under a product-page scope only; the global `.button--primary` is not changed in this flash. (Decision followed the blast-radius brief in the spec's \"D4 brief\" section: the global button also renders on BOSS, Poko + admin chrome, standalone MdownManager, FinanceBuddy, the nonprofit application page and the 404. A global-button pass can be filed as a follow-on once the legacy inventory is decided.) **Phase 0 is now fully decided — D1–D5 all closed.**\n- [x] **D5 Product accents — DECIDED (Nik, 2026-11-10): alignment ABSOLUTE.** No per-product brand colours inside the aligned template. No exceptions slot.\n\n### Flash phases\n- [x] **Phase 0 — Decisions + token mapping:** D1–D5 all decided (2026-11-10); mapping table + legacy-route inventory completed and appended to the spec (2026-11-10).\n- [x] **Phase 1 — Token + chrome layer:** product-scoped tokens in the landing palette (light + green-derived dark); full chrome per D3 (header, footer, land strip, Chat — green toggle, in-flow on mobile as on landing). Seam check on RyFine at 1280 + 390px is part of Phase 4 verification.\n- [x] **Phase 2 — Hero:** product hero on the landing grammar (flat surface, mono eyebrow/tags with the status pulse removed, heading weight 550, scoped buttons per D4, auto-width actions on mobile); TBW-006 hero clearance addressed structurally (below).\n- [x] **Phase 3 — Body sections:** focus/detail cards, evidence list, stack chips → flat ruled treatment; no glow shadows or gradient tints left in the product scope.\n- [x] **Phase 4 — Roll out + verify:** all 8 slugs rendered at 1280px; RyFine + LTB Buddy at 390px; fr-CA + es-419 on RyFine at 390px; dark theme at 390 + 1280px — all measured + eyeballed (2026-11-10). Gates: typecheck passes; lint output byte-identical to the `main` baseline (18 pre-existing errors, none new); production build passes. Live-deploy verification completed 2026-11-10 (below).\n\n### Relationship to TBW-006 / PR #41\n- [ ] PR #41 is held open: the shrunken Chat pill still overlaps the `All products` hero button at 390/360 × 844 (en ~10px, fr-CA ~36px, es-419 ~35px). Phase 2 redesigns that hero — either TBW-006's clearance fix lands first and must not regress, or it folds into Phase 2 and closes here.\n- [ ] TBW-006's 44px tap targets (header/footer) must survive the Phase 1 chrome work.\n\n### Acceptance\n- [ ] Landing → any product page reads as one visual system (palette, headings, buttons, cards, chrome) per the approved mapping table.\n- [ ] Screenshot sweep complete per Phase 4; no content diffs (presentation layer only).\n- [ ] TBW-006 mobile checklist passes on the new hero, or its blocker is explicitly closed inside this ticket.\n- [ ] Gates no worse than the re-established `main` baseline; live verification on two slugs.","comments":[{"author":"Muse","date":"2026-11-09T20:57:00-05:00","text":"Filed with the full spec at `docs/product-pages-design-alignment-flash-2026-11-09.md`. Evidence base: code read of 56:00-05:00","text":"Nik decided D4: **scoped to product pages.** Phase 0 is fully decided (D1–D5). Next step in the flash is the Phase 0 token-mapping table + legacy-route inventory; no build has been authorized or started — the spec/ticket live on PR #42, which is still open for Nik's merge.","html":"<p>Nik decided D4: <strong>scoped to product pages.</strong> Phase 0 is fully decided (D1–D5). Next step in the flash is the Phase 0 token-mapping table + legacy-route inventory; no build has been authorized or started — the spec/ticket live on PR #42, which is still open for Nik's merge.</p>"},{"author":"Muse","date":"2026-11-10T08:50:00-05:00","text":"Nik merged PR #42 (merge commit `e47fb7b`) and said \"let's start building.\" Implementation on branch `feat/tbw-007-product-pages-alignment`:\n- Phase 0 deliverables appended to the spec: full token/pattern mapping table + legacy-route inventory (1280px renders). Inventory correction: `/MdownManager`, `/RedactorBuddy`, `/feedbackfish` are 308 redirects off-site — no on-site surface exists for them.\n- Implementation is one scoped layer: token overrides + chrome on `.site-shell:has(.product-case-study)`, body treatment on `.product-case-study`, wrapper class in `ProductCaseStudyContent.tsx`. Base product rules untouched; global `.button` untouched (D4). Dark theme re-derived from greens (D2): page `#121c15`, primary button `#3d6a4e`.\n- TBW-006: its `styles/admin.css` rules (tap targets, pill shrink, footer clearance) are carried into this branch verbatim from PR #41, and the hero-clearance blocker is closed structurally on product pages — on mobile the Chat widget is in-flow on product pages (same as landing), and hero actions are auto-width instead of full-width stacked. If this PR merges, PR #41 can be closed as superseded; TBW-006's remaining acceptance (non-product pages) rides on this branch's admin.css half.\n- Verification (local production build, headless Chromium): all 8 slugs at 1280px; RyFine + LTB Buddy at RL`, `NEON_DATABASE_URL`, `DATABASE_URL`, or `POSTGRES_URL`\n* optional: `OPENAI_CHAT_MODEL`, `OPENAI_EMBEDDING_MODEL`\n\nAcceptance criteria:\n\n* Seed run completes without errors.\n* `chatbot_ingestion_runs` records the seed run.\n* Supported questions like \"What does Teambotics do?\" and \"What is LTB Buddy?\" return sourced answers.\n* Unsupported/private-client questions are refused or redirected without invented claims.","comments":[],"_file":"TEA-272.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Current repo state:</p><ul><li><code>scripts/seed-teambotics-knowledge.ts</code> can seed approved site/product/company knowledge into Neon.</li><li>Chat runtime can use database retrieval when OpenAI and Neon are configured.</li><li>Local validation is green: lint, typecheck, unit tests, build, and E2E all passed.</li></ul><p>Needed outcome:</p><ul><li>Configure production environment variables in Vercel.</li><li>Run the first production site knowledge seed.</li><li>Verify the public chatbot answers with sources from the seeded corpus.</li></ul><p>Required env:</p><ul><li><code>OPENAI_API_KEY</code></li><li>one Neon/Postgres URL: <code>NEON_DB_URL</code>, <code>NEON_DATABASE_URL</code>, <code>DATABASE_URL</code>, or <code>POSTGRES_URL</code></li><li>optional: <code>OPENAI_CHAT_MODEL</code>, <code>OPENAI_EMBEDDING_MODEL</code></li></ul><p>Acceptance criteria:</p><ul><li>Seed run completes without errors.</li><li><code>chatbot_ingestion_runs</code> records the seed run.</li><li>Supported questions like \"What does Teambotics do?\" and \"What is LTB Buddy?\" return sourced answers.</li><li>Unsupported/private-client questions are refused or redirected without invented claims.</li></ul>"},{"id":"TEA-273","title":"Configure private GitHub ingestion and verify protected 48-hour cron","status":"Todo","statusType":"unstarted","priority":"High","labels":["Human + AI","Testing","Ops","Sec  protected by <code>CRON_SECRET</code>.</li><li><code>vercel.json</code> schedules ingestion at <code>0 6 <em>/2 </em> *</code>.</li></ul><p>Needed outcome:</p><ul><li>Configure private repo ingestion safely in production.</li><li>Trigger a protected manual run once.</li><li>Confirm scheduled 48-hour refresh can run without exposing private repo URLs or sensitive files.</li></ul><p>Required env:</p><ul><li><code>CRON_SECRET</code></li><li><code>GITHUB_INGEST_TOKEN</code></li><li><code>GITHUB_INGEST_REPOS</code></li><li><code>OPENAI_API_KEY</code></li><li>one Neon/Postgres URL</li></ul><p>Acceptance criteria:</p><ul><li>Unauthenticated cron request is rejected.</li><li>Authenticated manual cron or script run succeeds.</li><li>Ingestion records source and run metadata.</li><li>Selected files exclude env files, secrets, lockfiles, generated build output, and other low-signal sources.</li><li>Chatbot can cite GitHub-derived knowledge only where appropriate.</li></ul>"},{"id":"TEA-274","title":"Reconcile product grounding docs with implemented case-study copy","status":"Todo","statusType":"unstarted","priority":"Medium","labels":["Human + AI","PM","Improvement"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:52.371Z","updatedAt":"2026-05-08T04:37:52.371Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-274/reconcile-product-grounding-docs-with-implemented-case-study-copy","gitBranchName":"nickhilster/tea-274-reconcile-product-grounding-docs-with-implemented-case-study","description":"## Description\n\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\n\nCurrent repo state:\n\n* `lib/products.ts` contains substantive case-study copy for LTB Buddy, EasyBuddy, Code2Motion, and Storytellr.\n* `docs/product-summaries.md` and `docs/chatbot-grounding-faq.md` still contain owner TODOs for and does not imply legal advice.</li><li>Owner review status is explicit before production seeding.</li></ul>"},{"id":"TEA-275","title":"Run production launch smoke for public site, lead capture, and chatbot","status":"Todo","statusType":"unstarted","priority":"High","labels":["Human + AI","Testing","Ops"],"assignee":null,"createdBy":"Nikhil K","project":"Teambotics Website Public Launch","milestone":null,"parent":null,"subIssues":[],"createdAt":"2026-05-08T04:37:53.595Z","updatedAt":"2026-05-08T04:37:53.595Z","startedAt":null,"completedAt":null,"canceledAt":null,"linearUrl":"https://linear.app/teambotics/issue/TEA-275/run-production-launch-smoke-for-public-site-lead-capture-and-chatbot","gitBranchName":"nickhilster/tea-275-run-production-launch-smoke-for-public-site-lead-capture-and","description":"## Description\n\nRepo-grounded follow-up from the 2026-05-08 `teambotics-website` sync.\n\nCurrent local validation:\n\n* `pnpm lint` passed.\n* `pnpm typecheck` passed.\n* `pnpm test` passed: 10 files / 24 tests.\n* `pnpm build` passed.\n* `pnpm test:e2e` passed: 13 Playwright tests.\n\nNeeded outcome:\n\n* Repeat a focused smoke pass against the production deployment after secrets and ingestion are configured.\n\nAcceptance criteria:\n\n* Homepage loads.\n* `/privacy` and `/terms` render real content.\n* Footer LinkedIn link points to `https://www.linkedin.com/company/teambotics-inc`.\n* Lead form submission persists to production Neon or fails with the intended fallback message.\n* Chatbot returns sourced answers for supported Teambotics questions.\n* Chatbot refuses unsupported, private, or professional-advice questions.\n* Admin login gate still protects `/admin/chatbot` and `/admin/theme`.","comments":[],"_file":"TEA-275.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Current local validation:</p><ul><li><code>pnpm lint</code> passed.</li><li><code>pnpm typecheck</code> passed.</ oute shim.\n* Removed `/products/easybuddy-placeholder` route shim.\n* Removed `/products/ltb-buddy-placeholder` route shim.\n* Added E2E coverage asserting all retired placeholder URLs now return the site 404 page instead of redirecting.\n\nValidation:\n\n* `pnpm lint` passed.\n* `pnpm typecheck` passed after clearing stale generated `.next` route types.\n* `pnpm test` passed: 10 files / 24 tests.\n* `pnpm build` passed; production route manifest no longer includes placeholder routes.\n* `pnpm test:e2e` passed: 14 Playwright tests.\n\nResidual note:\n\n* Playwright/Node emitted existing `DEP0205` warnings during E2E/build, but no validation command failed.","comments":[],"_file":"TEA-276.md","descriptionHtml":"<h4>Description</h4><p>Repo-grounded follow-up from the 2026-05-08 <code>teambotics-website</code> sync.</p><p>Decision: retire the legacy placeholder redirect routes rather than keep compatibility shims.</p><p>Completed changes:</p><ul><li>Removed <code>/github-placeholder</code> route shim.</li><li>Removed <code>/linkedin-placeholder</code> route shim.</li><li>Removed <code>/privacy-placeholder</code> route shim.</li><li>Removed <code>/terms-placeholder</code> route shim.</li><li>Removed <code>/products/easybuddy-placeholder</code> route shim.</li><li>Removed <code>/products/ltb-buddy-placeholder</code> route shim.</li><li>Added E2E coverage asserting all retired placeholder URLs now return the site 404 page instead of redirecting.</li></ul><p>Validation:</p><ul><li><code>pnpm lint</code> passed.</li><li><code>pnpm typecheck</code> passed after clearing stale generated <code>.next</code> route types.</li><li><code>pnpm test</code> passed: 10 files / 24 tests.</li><li><code>pnpm build</code> passed; production route manifest no longer includes placeholder routes.</li><li><code>pnpm test:e2e</code> passed: 14 Playwright tests.</li></ul><p>Residual note:</p><ul><li>Playwright/Node emitted existing <code>DEP0205</code> warnings during E2E/build, but no validation command failed.</li></ul>"}];
const COLUMNS = [
  {key:'backlog', label:'Backlog', color:'var(--backlog)'},
  {key:'unstarted', label:'Todo', color:'var(--unstarted)'},
  {key:'started', label:'In Progress', color:'var(--started)'},
  {key:'completed', label:'Done', color:'var(--completed)'},
  {key:'canceled', label:'Canceled', color:'var(--canceled)'},
];

let state = { search:'', priority:'', label:'', view:'board' };

function allLabels(){
  const s = new Set();
  ISSUES.forEach(i => (i.labels||[]).forEach(l => l && s.add(l)));
  return [...s].sort();
}
function allPriorities(){
  const s = new Set();
  ISSUES.forEach(i => i.priority && s.add(i.priority));
  return [...s];
}

function populateFilters(){
  const pf = document.getElementById('priorityFilter');
  allPriorities().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; pf.appendChild(o); });
  const lf = document.getElementById('labelFilter');
  allLabels().forEach(l => { const o=document.createElement('option'); o.value=l; o.textContent=l; lf.appendChild(o); });
}

function filtered(){
  return ISSUES.filter(i => {
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!((i.title||'').toLowerCase().includes(q) || (i.id||'').toLowerCase().includes(q))) return false;
    }
    if (state.priority && i.priority !== state.priority) return false;
    if (state.label && !(i.labels||[]).includes(state.label)) return false;
    return true;
  });
}

function renderBoard(){
  const root = document.getElementById('board');
  root.innerHTML = '';
  const items = filtered();
  COLUMNS.forEach(col => {
    const colIssues = items.filter(i => (i.statusType||'').toLowerCase() === col.key);
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = '<div class="column-header"><span class="dot" style="background:' + col.color + '"></span>' + col.label + ' <span style="color:var(--muted);font-weight:400">(' + colIssues.length + ')</span></div><div class="column-body"></div>';
    const body = colEl.querySelector('.column-body');
    colIssues.forEach(i => body.appendChild(card(i)));
    root.appendChild(colEl);
  });
}

function card(i){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = '<div class="id">' + i.id + '</div>' +
    '<div class="title">' + escapeHtml(i.title||'') + '</div>' +
    '<div class="meta">' +
      (i.priority ? '<span class="badge priority ' + i.priority + '">' + i.priority + '</span>' : '') +
      (i.labels||[]).map(l => '<span class="badge">' + escapeHtml(l) + '</span>').join('') +
      (i.comments && i.comments.length ? '<span class="badge">💬 ' + i.comments.length + '</span>' : '') +
    '</div>';
  el.addEventListener('click', () => openModal(i));
  return el;
}

function renderList(){
  const tbody = document.querySelector('#list tbody');
  tbody.innerHTML = '';
  filtered().forEach(i => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + i.id + '</td><td>' + escapeHtml(i.title||'') + '</td><td>' + escapeHtml(i.status||'') + '</td><td>' + escapeHtml(i.priority||'') + '</td><td>' + (i.labels||[]).join(', ') + '</td><td>' + (i.updatedAt ? i.updatedAt.slice(0,10) : '') + '</td>';
    tr.addEventListener('click', () => openModal(i));
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openModal(i){
  const root = document.getElementById('modalRoot');
  const sub = (i.subIssues||[]).map(id => '<li>' + id + '</li>').join('');
  root.innerHTML = '<div class="overlay" id="overlay"><div class="modal">' +
    '<button class="close" id="closeModal">×</button>' +
    '<div class="id">' + i.id + (i.linearUrl ? ' — <a href="' + i.linearUrl + '" target="_blank" rel="noopener">Linear</a>' : '') + '</div>' +
    '<h2>' + escapeHtml(i.title||'') + '</h2>' +
    '<div class="meta-row">' +
      '<span>Status: <strong>' + escapeHtml(i.status||'') + '</strong></span>' +
      (i.priority ? '<span>Priority: <strong>' + i.priority + '</strong></span>' : '') +
      (i.assignee ? '<span>Assignee: ' + escapeHtml(i.assignee) + '</span>' : '') +
      (i.project ? '<span>Project: ' + escapeHtml(i.project) + '</span>' : '') +
      (i.milestone ? '<span>Milestone: ' + escapeHtml(i.milestone) + '</span>' : '') +
      (i.parent ? '<span>Parent: ' + i.parent + '</span>' : '') +
    '</div>' +
    (i.description ? i.descriptionHtml : '<p style="color:var(--muted)">No description.</p>') +
    (sub ? '<div class="section-title">Sub-issues</div><ul>' + sub + '</ul>' : '') +
    (i.comments && i.comments.length ? '<div class="section-title">Comments (' + i.comments.length + ')</div>' + i.comments.map(c => '<div class="comment"><div class="who">' + escapeHtml(c.author) + ' — ' + escapeHtml(c.date) + '</div>' + c.html + '</div>').join('') : '') +
    '</div></div>';
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function renderAll(){
  document.getElementById('count').textContent = filtered().length + ' / ' + ISSUES.length + ' issues';
  if (state.view === 'board') { document.getElementById('board').classList.remove('hidden'); document.getElementById('list').classList.add('hidden'); renderBoard(); }
  else { document.getElementById('board').classList.add('hidden'); document.getElementById('list').classList.remove('hidden'); renderList(); }
}

document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; renderAll(); });
document.getElementById('priorityFilter').addEventListener('change', e => { state.priority = e.target.value; renderAll(); });
document.getElementById('labelFilter').addEventListener('change', e => { state.label = e.target.value; renderAll(); });
document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    renderAll();
  });
});

populateFilters();
renderAll();
</script>
</body>
