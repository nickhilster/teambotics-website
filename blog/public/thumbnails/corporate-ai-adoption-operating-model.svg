<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AI Adoption Is an Operating Model Decision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="operatingBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="70%" r="42%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <!-- Executive operating model glow -->
  <ellipse cx="548" cy="86" rx="142" ry="104" fill="#14b8a6" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="582" cy="222" rx="112" ry="82" fill="#fb7185" fill-opacity="0.055" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side operating model icon: governed workflow loop -->
  <circle cx="538" cy="112" r="62" fill="#071625" stroke="url(#operatingBlend)" stroke-width="1.5" stroke-opacity="0.34"/>
  <circle cx="538" cy="112" r="39" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18"/>
  <rect x="493" y="70" width="90" height="84" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.42"/>

  <circle cx="538" cy="91" r="5" fill="#99f6e4" fill-opacity="0.74"/>
  <circle cx="516" cy="122" r="5" fill="#38bdf8" fill-opacity="0.72"/>
  <circle cx="560" cy="122" r="5" fill="#fb7185" fill-opacity="0.68"/>
  <path d="M538 97v16M526 121h24" fill="none" stroke="#99f6e4" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.42"/>
  <path d="M508 93c-14 10-20 28-14 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.44"/>
  <path d="M580 132c-7 15-22 25-39 26" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-opacity="0.44"/>
  <path d="M552 62c16 4 29 16 34 32" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.42"/>
  <circle cx="493" cy="138" r="3.8" fill="#38bdf8" fill-opacity="0.65"/>
  <circle cx="586" cy="94" r="3.8" fill="#14b8a6" fill-opacity="0.65"/>
  <circle cx="541" cy="158" r="3.8" fill="#fb7185" fill-opacity="0.65"/>
  <text x="538" y="185" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#99f6e4" fill-opacity="0.55">OPERATING LOOP</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#operatingBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="130" height="22" rx="11" fill="#14b8a6" fill-opacity="0.10" stroke="#14b8a6" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="127" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#99f6e4" fill-opacity="0.92">ENTERPRISE AI</text>

  <!-- Main title -->
  <text x="62" y="145" font-family="ui-sans-serif,system-ui,sans-serif" font-size="43" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">AI Adoption</text>
  <text x="62" y="196" font-family="ui-sans-serif,system-ui,sans-serif" font-size="43" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Is an Operating</text>
  <rect x="62" y="204" width="328" height="4" rx="2" fill="url(#operatingBlend)" fill-opacity="0.70"/>
  <text x="62" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="43" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.72">Model Decision</text>

  <!-- Small signal chips -->
  <rect x="62" y="270" width="84" height="18" rx="9" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.22"/>
  <text x="104" y="282" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#bae6fd" fill-opacity="0.64">GOVERN</text>
  <rect x="154" y="270" width="78" height="18" rx="9" fill="#14b8a6" fill-opacity="0.08" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.22"/>
  <text x="193" y="282" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#99f6e4" fill-opacity="0.64">MEASURE</text>
  <rect x="240" y="270" width="66" height="18" rx="9" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-width="0.6" stroke-opacity="0.22"/>
  <text x="273" y="282" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#fecdd3" fill-opacity="0.64">SCALE</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#14b8a6" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#operatingBlend)" fill-opacity="0.12"/>
</svg>
