<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Your Chatbot Should Be Asking Better Questions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="chatBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <ellipse cx="556" cy="90" rx="134" ry="96" fill="#d946ef" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="576" cy="222" rx="112" ry="82" fill="#6366f1" fill-opacity="0.06" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side icon: a chat bubble asking a question with branching follow-ups -->
  <path d="M486 78 h96 a20 20 0 0 1 20 20 v52 a20 20 0 0 1 -20 20 h-30 l-24 20 -6 -20 h-16 a20 20 0 0 1 -20 -20 v-52 a20 20 0 0 1 20 -20 Z" fill="#071023" stroke="url(#chatBlend)" stroke-width="1.5" stroke-opacity="0.45"/>
  <text x="534" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="800" fill="#fbcfe8" fill-opacity="0.85">?</text>
  <circle cx="504" cy="146" r="4" fill="#fb7185" fill-opacity="0.6"/>
  <circle cx="534" cy="150" r="4" fill="#d946ef" fill-opacity="0.6"/>
  <circle cx="564" cy="146" r="4" fill="#6366f1" fill-opacity="0.6"/>
  <path d="M504 150c-4 14-2 24 6 32" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <path d="M564 150c4 14 2 24 -6 32" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <text x="534" y="212" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#fbcfe8" fill-opacity="0.5">QUESTION TREE</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#chatBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="106" height="22" rx="11" fill="#d946ef" fill-opacity="0.10" stroke="#d946ef" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="115" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#fbcfe8" fill-opacity="0.92">CHATBOTS</text>

  <!-- Main title -->
  <text x="62" y="140" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Ask</text>
  <text x="62" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Better</text>
  <rect x="62" y="196" width="150" height="4" rx="2" fill="url(#chatBlend)" fill-opacity="0.70"/>
  <text x="62" y="244" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.68">Questions</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#d946ef" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#chatBlend)" fill-opacity="0.12"/>
</svg>
