<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Workflows Are Becoming Products">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="workflowBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6d5cff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <ellipse cx="556" cy="90" rx="134" ry="96" fill="#38bdf8" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="576" cy="220" rx="110" ry="82" fill="#8b5cf6" fill-opacity="0.06" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side icon: workflow steps converging into a product -->
  <circle cx="450" cy="152" r="7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="472" cy="126" r="7" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M456 148c8 -6 12 -12 16 -16" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" stroke-dasharray="2,3"/>
  <path d="M478 121c8 -5 16 -8 22 -9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" stroke-dasharray="2,3"/>
  <rect x="500" y="84" width="84" height="84" rx="18" fill="#071023" stroke="url(#workflowBlend)" stroke-width="1.5" stroke-opacity="0.42"/>
  <rect x="518" y="102" width="48" height="10" rx="5" fill="#e9d5ff" fill-opacity="0.72"/>
  <rect x="518" y="120" width="36" height="8" rx="4" fill="#e9d5ff" fill-opacity="0.4"/>
  <rect x="518" y="136" width="42" height="8" rx="4" fill="#e9d5ff" fill-opacity="0.32"/>
  <path d="M518 152 l8 8 l16 -16" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>
  <text x="542" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#c084fc" fill-opacity="0.5">PRODUCT FLOW</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#workflowBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="116" height="22" rx="11" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="120" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#bae6fd" fill-opacity="0.92">WORKFLOWS</text>

  <!-- Main title -->
  <text x="62" y="140" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Workflows Are</text>
  <text x="62" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Becoming</text>
  <rect x="62" y="196" width="196" height="4" rx="2" fill="url(#workflowBlend)" fill-opacity="0.70"/>
  <text x="62" y="244" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.68">Products</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#38bdf8" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#workflowBlend)" fill-opacity="0.12"/>
</svg>
