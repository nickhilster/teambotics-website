<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AI Should Not Replace Care">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="careBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="70%" r="42%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <!-- Soft care/capability glow -->
  <ellipse cx="552" cy="84" rx="142" ry="104" fill="#14b8a6" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="580" cy="210" rx="110" ry="82" fill="#f43f5e" fill-opacity="0.06" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side care architecture icon: human signal inside agent frame -->
  <circle cx="540" cy="104" r="58" fill="#071625" stroke="url(#careBlend)" stroke-width="1.5" stroke-opacity="0.34"/>
  <circle cx="540" cy="104" r="38" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18"/>
  <rect x="496" y="62" width="88" height="84" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.42"/>
  <circle cx="540" cy="91" r="11" fill="none" stroke="#99f6e4" stroke-width="2" stroke-opacity="0.68"/>
  <path d="M520 125c5-15 15-22 20-22s15 7 20 22" fill="none" stroke="#99f6e4" stroke-width="2" stroke-linecap="round" stroke-opacity="0.58"/>
  <path d="M518 84c-14 2-25 13-27 27" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M589 112c-3 15-15 27-31 31" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45"/>
  <circle cx="492" cy="112" r="4" fill="#fb7185" fill-opacity="0.65"/>
  <circle cx="558" cy="143" r="4" fill="#38bdf8" fill-opacity="0.65"/>
  <text x="540" y="174" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#99f6e4" fill-opacity="0.55">CARE LAYER</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#careBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="116" height="22" rx="11" fill="#14b8a6" fill-opacity="0.10" stroke="#14b8a6" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="120" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#99f6e4" fill-opacity="0.92">AGENTIC CARE</text>

  <!-- Main title -->
  <text x="62" y="146" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">AI Should</text>
  <text x="62" y="200" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Not Replace</text>
  <rect x="62" y="208" width="254" height="4" rx="2" fill="url(#careBlend)" fill-opacity="0.70"/>
  <text x="62" y="254" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.68">Care</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#14b8a6" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#careBlend)" fill-opacity="0.12"/>
</svg>
