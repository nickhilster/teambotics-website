<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Multi-Agent Systems: When AIs Collaborate to Get Work Done">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090614"/>
      <stop offset="100%" stop-color="#100820"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glowC)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#8b5cf6" fill-opacity="0.08"/>
  </pattern>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- Connection lines (draw first, behind nodes) -->
  <!-- Orchestrator (center) to all workers -->
  <line x1="320" y1="180" x2="200" y2="104" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="320" y1="180" x2="320" y2="72" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="320" y1="180" x2="440" y2="104" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="320" y1="180" x2="460" y2="224" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="320" y1="180" x2="320" y2="296" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="320" y1="180" x2="180" y2="224" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Worker-to-worker (horizontal coordination) -->
  <line x1="200" y1="104" x2="320" y2="72" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="320" y1="72" x2="440" y2="104" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="440" y1="104" x2="460" y2="224" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="460" y1="224" x2="320" y2="296" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="320" y1="296" x2="180" y2="224" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="180" y1="224" x2="200" y2="104" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Worker nodes (hexagon-shaped using polygon) -->
  <!-- Node: top (Planning) -->
  <polygon points="320,46 346,60 346,88 320,102 294,88 294,60" fill="#110a24" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.7"/>
  <text x="320" y="79" text-anchor="middle" font-size="22" font-family="serif">🗺️</text>

  <!-- Node: top-right (Data) -->
  <polygon points="440,78 466,92 466,120 440,134 414,120 414,92" fill="#110a24" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.7"/>
  <text x="440" y="111" text-anchor="middle" font-size="20" font-family="serif">📊</text>

  <!-- Node: bottom-right (Routing) -->
  <polygon points="460,198 486,212 486,240 460,254 434,240 434,212" fill="#110a24" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.7"/>
  <text x="460" y="231" text-anchor="middle" font-size="20" font-family="serif">⚡</text>

  <!-- Node: bottom (Report) -->
  <polygon points="320,270 346,284 346,312 320,326 294,312 294,284" fill="#110a24" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.7"/>
  <text x="320" y="303" text-anchor="middle" font-size="20" font-family="serif">📝</text>

  <!-- Node: bottom-left (Tool) -->
  <polygon points="180,198 206,212 206,240 180,254 154,240 154,212" fill="#110a24" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.7"/>
  <text x="180" y="231" text-anchor="middle" font-size="20" font-family="serif">🔧</text>

  <!-- Node: top-left (Review) -->
  <polygon points="200,78 226,92 226,120 200,134 174,120 174,92" fill="#110a24" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.7"/>
  <text x="200" y="111" text-anchor="middle" font-size="20" font-family="serif">✅</text>

  <!-- Central orchestrator — larger, glowing -->
  <circle cx="320" cy="180" r="52" fill="#8b5cf6" fill-opacity="0.08" filter="url(#glow)"/>
  <polygon points="320,142 348,158 348,190 320,206 292,190 292,158" fill="#16093a" stroke="#8b5cf6" stroke-width="2.5"/>
  <!-- Inner hex ring -->
  <polygon points="320,152 342,164 342,188 320,200 298,188 298,164" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.35"/>
  <!-- Center mark -->
  <circle cx="320" cy="174" r="10" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="320" cy="174" r="5" fill="#8b5cf6" fill-opacity="0.7"/>
  <!-- Orchestrator label -->
  <text x="320" y="196" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8" fill="#8b5cf6" fill-opacity="0.7" letter-spacing="1">ORCH</text>

  <!-- Animated flow dots along spokes (static positions showing data flow) -->
  <circle cx="270" cy="147" r="3.5" fill="#8b5cf6" fill-opacity="0.8"/>
  <circle cx="382" cy="149" r="3" fill="#8b5cf6" fill-opacity="0.65"/>
  <circle cx="399" cy="206" r="2.5" fill="#8b5cf6" fill-opacity="0.5"/>
  <circle cx="320" cy="238" r="3" fill="#8b5cf6" fill-opacity="0.65"/>
  <circle cx="244" cy="209" r="2.5" fill="#8b5cf6" fill-opacity="0.5"/>
  <circle cx="320" cy="124" r="2.5" fill="#8b5cf6" fill-opacity="0.5"/>
</svg>
