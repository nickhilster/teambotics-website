<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Multi-Agent Systems: When AIs Collaborate to Get Work Done">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07050f"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <ellipse cx="560" cy="100" rx="160" ry="130" fill="#8b5cf6" fill-opacity="0.09" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Node network top-right: 4 nodes connected -->
  <line x1="510" y1="90" x2="570" y2="60" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="510" y1="90" x2="580" y2="120" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="510" y1="90" x2="520" y2="158" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="570" y1="60" x2="580" y2="120" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="580" y1="120" x2="520" y2="158" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Central node -->
  <circle cx="510" cy="90" r="22" fill="#0e0a20" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="510" cy="90" r="10" fill="#8b5cf6" fill-opacity="0.25"/>
  <circle cx="510" cy="90" r="4" fill="#8b5cf6" fill-opacity="0.8"/>
  <!-- Satellite nodes -->
  <circle cx="570" cy="60" r="12" fill="#0e0a20" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="570" cy="60" r="4" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="580" cy="120" r="12" fill="#0e0a20" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="580" cy="120" r="4" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="520" cy="158" r="10" fill="#0e0a20" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="520" cy="158" r="3" fill="#a78bfa" fill-opacity="0.5"/>
  <!-- Left bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#accent)" fill-opacity="0.35"/>
  <!-- Tag -->
  <rect x="62" y="68" width="120" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="122" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#c4b5fd" fill-opacity="0.9">MULTI-AGENT</text>
  <!-- Title -->
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">When AIs</text>
  <text x="62" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Collaborate</text>
  <rect x="62" y="214" width="280" height="4" rx="2" fill="url(#accent)" fill-opacity="0.7"/>
  <!-- Subtitle -->
  <text x="62" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#94a3b8">to get work done</text>
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#8b5cf6" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#accent)" fill-opacity="0.12"/>
</svg>
