<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Extracting AI Value from Your Existing Data Infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b12"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <ellipse cx="560" cy="95" rx="155" ry="120" fill="#6366f1" fill-opacity="0.09" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Stacked database cylinders top-right -->
  <ellipse cx="546" cy="182" rx="38" ry="10" fill="#0e1228" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="508" y="158" width="76" height="24" fill="#0e1228" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35"/>
  <ellipse cx="546" cy="158" rx="38" ry="10" fill="#131630" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4"/>
  <ellipse cx="546" cy="145" rx="38" ry="10" fill="#0e1228" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="508" y="121" width="76" height="24" fill="#0e1228" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <ellipse cx="546" cy="121" rx="38" ry="10" fill="#131630" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.5"/>
  <ellipse cx="546" cy="108" rx="38" ry="10" fill="#0e1228" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="508" y="84" width="76" height="24" fill="#0e1228" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.6"/>
  <ellipse cx="546" cy="84" rx="38" ry="10" fill="#1a1c44" stroke="url(#accent)" stroke-width="1.8" stroke-opacity="0.75"/>
  <circle cx="546" cy="84" r="4" fill="#818cf8" fill-opacity="0.8"/>
  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#accent)" fill-opacity="0.35"/>
  <!-- Tag chip -->
  <rect x="62" y="68" width="112" height="22" rx="11" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="118" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#a5b4fc" fill-opacity="0.9">DATA STRATEGY</text>
  <!-- Main title -->
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Extract AI</text>
  <text x="62" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Value</text>
  <rect x="62" y="214" width="142" height="4" rx="2" fill="url(#accent)" fill-opacity="0.7"/>
  <!-- Subtitle -->
  <text x="62" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#94a3b8">from your existing infrastructure</text>
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#6366f1" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#accent)" fill-opacity="0.12"/>
</svg>
