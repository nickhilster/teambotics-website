<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="The 80% Rule: Most AI Value Lives in the Data You Already Have">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#08112a"/>
    </linearGradient>
    <radialGradient id="glowBig" cx="38%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glowBig)"/>

  <!-- Large "80%" typographic element — the hero -->
  <!-- Shadow/glow -->
  <text x="196" y="230" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="190" font-weight="900" fill="#6366f1" fill-opacity="0.08" filter="url(#glow)">80</text>
  <!-- Main text -->
  <text x="192" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="182" font-weight="900" fill="#6366f1" fill-opacity="0.85">80</text>
  <!-- Percent sign -->
  <text x="330" y="180" font-family="ui-sans-serif,system-ui,sans-serif" font-size="90" font-weight="900" fill="#6366f1" fill-opacity="0.6">%</text>

  <!-- Dividing label -->
  <text x="210" y="256" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="13" letter-spacing="3" font-weight="600" fill="#818cf8" fill-opacity="0.6">OF VALUE</text>

  <!-- Vertical divider -->
  <line x1="420" y1="40" x2="420" y2="320" stroke="#6366f1" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Right panel: split bar showing the rule -->
  <text x="540" y="72" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" letter-spacing="2" fill="#6366f1" fill-opacity="0.5">DATA BREAKDOWN</text>

  <!-- Bar track -->
  <rect x="446" y="92" width="188" height="30" rx="15" fill="#0d1730" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Existing data fill (80%) -->
  <rect x="446" y="92" width="150" height="30" rx="15" fill="url(#barFill)" fill-opacity="0.9"/>
  <!-- Overlap to make right side straight -->
  <rect x="566" y="92" width="30" height="30" fill="url(#barFill)" fill-opacity="0.9"/>
  <!-- Label on bar -->
  <text x="510" y="113" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="12" font-weight="700" fill="#fff" fill-opacity="0.9">Existing data</text>

  <!-- Bar track 2 (new data) -->
  <rect x="446" y="135" width="188" height="30" rx="15" fill="#0d1730" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
  <!-- New data fill (20%) -->
  <rect x="446" y="135" width="38" height="30" rx="15" fill="#6366f1" fill-opacity="0.3"/>
  <rect x="466" y="135" width="18" height="30" fill="#6366f1" fill-opacity="0.3"/>
  <text x="540" y="156" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#6366f1" fill-opacity="0.5">New collection</text>

  <!-- Pct labels -->
  <text x="434" y="113" text-anchor="end" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#818cf8" fill-opacity="0.8">80%</text>
  <text x="434" y="156" text-anchor="end" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#6366f1" fill-opacity="0.5">20%</text>

  <!-- Three methods below (small) -->
  <rect x="440" y="190" width="56" height="56" rx="10" fill="#0d1730" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25"/>
  <text x="468" y="224" text-anchor="middle" font-size="20">🔍</text>
  <text x="468" y="238" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8" fill="#6366f1" fill-opacity="0.5" letter-spacing="0.5">Search</text>

  <rect x="508" y="190" width="56" height="56" rx="10" fill="#0d1730" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25"/>
  <text x="536" y="224" text-anchor="middle" font-size="20">📈</text>
  <text x="536" y="238" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8" fill="#6366f1" fill-opacity="0.5" letter-spacing="0.5">Patterns</text>

  <rect x="576" y="190" width="56" height="56" rx="10" fill="#0d1730" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25"/>
  <text x="604" y="224" text-anchor="middle" font-size="20">🎯</text>
  <text x="604" y="238" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8" fill="#6366f1" fill-opacity="0.5" letter-spacing="0.5">Predict</text>

  <!-- Timeline (showing existing archive) -->
  <line x1="446" y1="290" x2="634" y2="290" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="446" y1="286" x2="446" y2="294" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="510" y1="286" x2="510" y2="294" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="574" y1="286" x2="574" y2="294" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="634" y1="286" x2="634" y2="294" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="446" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6366f1" fill-opacity="0.4">2022</text>
  <text x="510" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6366f1" fill-opacity="0.4">2023</text>
  <text x="574" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6366f1" fill-opacity="0.4">2024</text>
  <text x="634" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#818cf8" fill-opacity="0.7">Now</text>
</svg>
