<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Beyond Chat: How LLMs Power Structured Automation Workflows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040d0a"/>
      <stop offset="100%" stop-color="#061210"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <ellipse cx="560" cy="90" rx="155" ry="120" fill="#14b8a6" fill-opacity="0.08" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Workflow pipeline top-right: 3 boxes connected by arrows -->
  <!-- Box 1 -->
  <rect x="464" y="54" width="44" height="36" rx="6" fill="#061a18" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="472" y="64" width="28" height="6" rx="3" fill="#14b8a6" fill-opacity="0.35"/>
  <rect x="472" y="74" width="20" height="5" rx="2.5" fill="#14b8a6" fill-opacity="0.2"/>
  <!-- Arrow 1 -->
  <path d="M508 72 l14 0" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
  <path d="M517 68 l6 4 -6 4" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box 2 (LLM) -->
  <rect x="522" y="54" width="44" height="36" rx="6" fill="#061a18" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
  <text x="544" y="77" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#5eead4" fill-opacity="0.9">LLM</text>
  <!-- Arrow 2 -->
  <path d="M566 72 l14 0" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
  <path d="M575 68 l6 4 -6 4" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box 3 -->
  <rect x="580" y="54" width="44" height="36" rx="6" fill="#061a18" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="588" y="64" width="28" height="6" rx="3" fill="#14b8a6" fill-opacity="0.35"/>
  <rect x="588" y="74" width="20" height="5" rx="2.5" fill="#14b8a6" fill-opacity="0.2"/>
  <!-- Row 2 of pipeline (branching outputs) -->
  <line x1="544" y1="90" x2="544" y2="106" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="544" y1="106" x2="504" y2="106" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="544" y1="106" x2="584" y2="106" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.25"/>
  <rect x="480" y="106" width="48" height="28" rx="5" fill="#061a18" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="560" y="106" width="48" height="28" rx="5" fill="#061a18" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="488" y="115" width="32" height="5" rx="2.5" fill="#14b8a6" fill-opacity="0.2"/>
  <rect x="568" y="115" width="32" height="5" rx="2.5" fill="#14b8a6" fill-opacity="0.2"/>
  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#accent)" fill-opacity="0.35"/>
  <!-- Tag -->
  <rect x="62" y="68" width="84" height="22" rx="11" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="104" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#5eead4" fill-opacity="0.9">WORKFLOWS</text>
  <!-- Title -->
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">LLMs Power</text>
  <text x="62" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Automation</text>
  <rect x="62" y="214" width="258" height="4" rx="2" fill="url(#accent)" fill-opacity="0.7"/>
  <!-- Subtitle -->
  <text x="62" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#94a3b8">structured workflows beyond chat</text>
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#14b8a6" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#accent)" fill-opacity="0.12"/>
</svg>
