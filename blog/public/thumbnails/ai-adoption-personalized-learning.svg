<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Why AI Adoption Fails: It's Not Technology—It's Training">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="learningBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="70%" r="42%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <!-- Learning/adoption glow -->
  <ellipse cx="548" cy="88" rx="142" ry="104" fill="#14b8a6" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="576" cy="218" rx="118" ry="84" fill="#a78bfa" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side personalized learning icon: role paths into adoption signal -->
  <circle cx="538" cy="112" r="62" fill="#071625" stroke="url(#learningBlend)" stroke-width="1.5" stroke-opacity="0.34"/>
  <circle cx="538" cy="112" r="40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18"/>
  <rect x="494" y="70" width="88" height="84" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.40"/>

  <path d="M512 93h36c10 0 18 8 18 18s-8 18-18 18h-8" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.58"/>
  <path d="M512 129h22c8 0 15 7 15 15v12" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.52"/>
  <path d="M512 111h18" fill="none" stroke="#99f6e4" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.55"/>
  <circle cx="512" cy="93" r="4.2" fill="#99f6e4" fill-opacity="0.75"/>
  <circle cx="512" cy="111" r="4.2" fill="#38bdf8" fill-opacity="0.72"/>
  <circle cx="512" cy="129" r="4.2" fill="#a78bfa" fill-opacity="0.72"/>
  <circle cx="566" cy="111" r="5.4" fill="none" stroke="#99f6e4" stroke-width="1.8" stroke-opacity="0.62"/>
  <path d="M559 111h14M566 104v14" stroke="#99f6e4" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.58"/>

  <path d="M493 135c-8-16-5-35 8-48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.36"/>
  <path d="M583 91c8 16 5 35-8 48" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-opacity="0.36"/>
  <text x="538" y="184" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#99f6e4" fill-opacity="0.55">ROLE-BASED LEARNING</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#learningBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="116" height="22" rx="11" fill="#14b8a6" fill-opacity="0.10" stroke="#14b8a6" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="120" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#99f6e4" fill-opacity="0.92">AI ADOPTION</text>

  <!-- Main title -->
  <text x="62" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">AI Adoption</text>
  <text x="62" y="192" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Fails Without</text>
  <rect x="62" y="200" width="280" height="4" rx="2" fill="url(#learningBlend)" fill-opacity="0.70"/>
  <text x="62" y="246" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.74">Personalized</text>
  <text x="62" y="292" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.58">Training</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#14b8a6" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#learningBlend)" fill-opacity="0.12"/>
</svg>
