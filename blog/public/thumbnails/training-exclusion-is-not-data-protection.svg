<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Training Exclusion Is Not Data Protection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="privacyBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <!-- Soft privacy/boundary glow -->
  <ellipse cx="558" cy="90" rx="136" ry="98" fill="#8b5cf6" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="578" cy="222" rx="112" ry="84" fill="#38bdf8" fill-opacity="0.06" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side icon: shield with exclusion boundary around a data node -->
  <path d="M540 48 l52 18 v52 c0 40-24 66-52 78-28-12-52-38-52-78 v-52 Z" fill="#071023" stroke="url(#privacyBlend)" stroke-width="1.5" stroke-opacity="0.42"/>
  <path d="M540 48 l52 18 v52 c0 40-24 66-52 78-28-12-52-38-52-78 v-52 Z" fill="none" stroke="url(#privacyBlend)" stroke-width="1" stroke-opacity="0.18" transform="scale(0.82) translate(119 21)"/>
  <circle cx="540" cy="118" r="16" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="540" cy="118" r="4" fill="#c4b5fd" fill-opacity="0.85"/>
  <line x1="540" y1="98" x2="540" y2="106" stroke="#c4b5fd" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="540" y1="130" x2="540" y2="138" stroke="#c4b5fd" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="518" y1="118" x2="526" y2="118" stroke="#c4b5fd" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="554" y1="118" x2="562" y2="118" stroke="#c4b5fd" stroke-width="2" stroke-opacity="0.55"/>
  <path d="M540 148c-12 4-22 14-24 28" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" stroke-dasharray="2,3"/>
  <path d="M540 148c12 4 22 14 24 28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" stroke-dasharray="2,3"/>
  <text x="540" y="212" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#c4b5fd" fill-opacity="0.5">EXCLUSION BOUNDARY</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#privacyBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="112" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="118" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#c4b5fd" fill-opacity="0.92">DATA PRIVACY</text>

  <!-- Main title -->
  <text x="62" y="140" font-family="ui-sans-serif,system-ui,sans-serif" font-size="40" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Training Exclusion</text>
  <text x="62" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="40" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Is Not Data</text>
  <rect x="62" y="196" width="196" height="4" rx="2" fill="url(#privacyBlend)" fill-opacity="0.70"/>
  <text x="62" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="40" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.68">Protection</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#8b5cf6" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#privacyBlend)" fill-opacity="0.12"/>
</svg>
