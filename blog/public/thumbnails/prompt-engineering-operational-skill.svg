<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Prompt Engineering Is Now an Operational Skill, Not a Developer Trick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0614"/>
      <stop offset="100%" stop-color="#110920"/>
    </linearGradient>
    <radialGradient id="glowWeak" cx="22%" cy="50%" r="28%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowStrong" cx="78%" cy="50%" r="28%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="meterFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glowWeak)"/>
  <rect width="640" height="360" fill="url(#glowStrong)"/>

  <!-- Left panel — weak prompt (terminal style) -->
  <rect x="28" y="52" width="256" height="256" rx="10" fill="#0e0a1c" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Terminal header bar -->
  <rect x="28" y="52" width="256" height="32" rx="10" fill="#0e0a1c"/>
  <rect x="28" y="70" width="256" height="14" fill="#0e0a1c"/>
  <!-- Traffic lights -->
  <circle cx="48" cy="68" r="6" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="66" cy="68" r="6" fill="#f59e0b" fill-opacity="0.4"/>
  <circle cx="84" cy="68" r="6" fill="#22c55e" fill-opacity="0.25"/>
  <!-- Tab label -->
  <text x="172" y="73" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ef4444" fill-opacity="0.6">weak-prompt.txt</text>

  <!-- Prompt content (vague) -->
  <text x="44" y="108" font-family="ui-monospace,monospace" font-size="11" fill="#6b7280">$</text>
  <text x="56" y="108" font-family="ui-monospace,monospace" font-size="11" fill="#9ca3af">Summarise this report.</text>
  <!-- Cursor blink -->
  <rect x="224" y="98" width="7" height="13" rx="1" fill="#6b7280" fill-opacity="0.6"/>

  <!-- Output (bad) -->
  <rect x="36" y="120" width="235" height="170" rx="6" fill="#0a0818"/>
  <rect x="44" y="130" width="180" height="8" rx="4" fill="#4b5563" fill-opacity="0.6"/>
  <rect x="44" y="144" width="200" height="8" rx="4" fill="#4b5563" fill-opacity="0.5"/>
  <rect x="44" y="158" width="160" height="8" rx="4" fill="#4b5563" fill-opacity="0.45"/>
  <rect x="44" y="172" width="210" height="8" rx="4" fill="#4b5563" fill-opacity="0.4"/>
  <rect x="44" y="186" width="140" height="8" rx="4" fill="#4b5563" fill-opacity="0.35"/>
  <!-- Warning: not useful -->
  <text x="44" y="220" font-family="ui-monospace,monospace" font-size="10" fill="#ef4444" fill-opacity="0.6">⚠ Vague. Unstructured.</text>
  <text x="44" y="235" font-family="ui-monospace,monospace" font-size="10" fill="#ef4444" fill-opacity="0.45">  Not actionable.</text>

  <!-- Quality score (left) -->
  <rect x="36" y="264" width="235" height="10" rx="5" fill="#1a0f26"/>
  <rect x="36" y="264" width="47" height="10" rx="5" fill="#ef4444" fill-opacity="0.7"/>
  <text x="156" y="291" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#ef4444" fill-opacity="0.7" font-weight="700">22 / 100</text>

  <!-- Center divider with upgrade arrow -->
  <line x1="320" y1="52" x2="320" y2="308" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="320" cy="180" r="18" fill="#110920" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M312 183 l8-8 8 8" stroke="#a855f7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
  <path d="M312 189 l8-8 8 8" stroke="#a855f7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.4"/>

  <!-- Right panel — strong prompt -->
  <rect x="356" y="52" width="256" height="256" rx="10" fill="#0e0a1c" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Terminal header -->
  <rect x="356" y="52" width="256" height="32" rx="10" fill="#0e0a1c"/>
  <rect x="356" y="70" width="256" height="14" fill="#0e0a1c"/>
  <circle cx="376" cy="68" r="6" fill="#ef4444" fill-opacity="0.4"/>
  <circle cx="394" cy="68" r="6" fill="#f59e0b" fill-opacity="0.4"/>
  <circle cx="412" cy="68" r="6" fill="#22c55e" fill-opacity="0.7"/>
  <text x="500" y="73" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#a855f7" fill-opacity="0.7">strong-prompt.txt</text>

  <!-- Prompt content (precise) -->
  <text x="372" y="108" font-family="ui-monospace,monospace" font-size="11" fill="#a855f7" fill-opacity="0.7">$</text>
  <text x="384" y="108" font-family="ui-monospace,monospace" font-size="11" fill="#c4b5fd">You are reviewing...</text>

  <!-- Output structure (good) -->
  <rect x="364" y="120" width="235" height="170" rx="6" fill="#0a0818"/>
  <!-- Structured output lines (with indentation showing structure) -->
  <rect x="372" y="130" width="60" height="8" rx="4" fill="#a855f7" fill-opacity="0.5"/>
  <rect x="386" y="144" width="180" height="7" rx="3.5" fill="#c4b5fd" fill-opacity="0.35"/>
  <rect x="386" y="157" width="156" height="7" rx="3.5" fill="#c4b5fd" fill-opacity="0.3"/>
  <rect x="372" y="172" width="56" height="8" rx="4" fill="#a855f7" fill-opacity="0.5"/>
  <rect x="386" y="186" width="168" height="7" rx="3.5" fill="#c4b5fd" fill-opacity="0.35"/>
  <rect x="386" y="199" width="140" height="7" rx="3.5" fill="#c4b5fd" fill-opacity="0.3"/>
  <!-- Success -->
  <text x="372" y="230" font-family="ui-monospace,monospace" font-size="10" fill="#22c55e" fill-opacity="0.8">✓ Structured. Sourced.</text>
  <text x="372" y="245" font-family="ui-monospace,monospace" font-size="10" fill="#22c55e" fill-opacity="0.55">  Actionable.</text>

  <!-- Quality score (right) -->
  <rect x="364" y="264" width="235" height="10" rx="5" fill="#1a0f26"/>
  <rect x="364" y="264" width="211" height="10" rx="5" fill="#a855f7" fill-opacity="0.75"/>
  <text x="484" y="291" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#c4b5fd" fill-opacity="0.9" font-weight="700">91 / 100</text>

  <!-- Bottom label -->
  <text x="148" y="334" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#ef4444" fill-opacity="0.4" letter-spacing="2">WEAK PROMPT</text>
  <text x="484" y="334" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#a855f7" fill-opacity="0.55" letter-spacing="2">STRONG PROMPT</text>
</svg>
