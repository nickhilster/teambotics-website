<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Prompt Engineering Is Now an Operational Skill, Not a Developer Trick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080612"/>
      <stop offset="100%" stop-color="#0c091c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <ellipse cx="555" cy="90" rx="155" ry="120" fill="#a855f7" fill-opacity="0.09" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Terminal window top-right -->
  <rect x="462" y="44" width="162" height="120" rx="8" fill="#0d0920" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Terminal header -->
  <rect x="462" y="44" width="162" height="24" rx="8" fill="#130b28"/>
  <rect x="462" y="58" width="162" height="10" fill="#130b28"/>
  <circle cx="478" cy="56" r="5" fill="#ef4444" fill-opacity="0.5"/>
  <circle cx="492" cy="56" r="5" fill="#f59e0b" fill-opacity="0.4"/>
  <circle cx="506" cy="56" r="5" fill="#22c55e" fill-opacity="0.5"/>
  <!-- Code lines -->
  <rect x="474" y="80" width="8" height="8" rx="1" fill="#a855f7" fill-opacity="0.6"/>
  <rect x="486" y="82" width="96" height="6" rx="3" fill="#c4b5fd" fill-opacity="0.4"/>
  <rect x="474" y="96" width="8" height="8" rx="1" fill="#ec4899" fill-opacity="0.5"/>
  <rect x="486" y="98" width="72" height="6" rx="3" fill="#c4b5fd" fill-opacity="0.3"/>
  <rect x="474" y="112" width="8" height="8" rx="1" fill="#a855f7" fill-opacity="0.4"/>
  <rect x="486" y="114" width="108" height="6" rx="3" fill="#c4b5fd" fill-opacity="0.25"/>
  <!-- Cursor blink -->
  <rect x="474" y="130" width="6" height="10" rx="1" fill="#a855f7" fill-opacity="0.7"/>
  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#accent)" fill-opacity="0.35"/>
  <!-- Tag -->
  <rect x="62" y="68" width="140" height="22" rx="11" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="132" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#d8b4fe" fill-opacity="0.9">PROMPT ENGINEERING</text>
  <!-- Title -->
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Operational</text>
  <text x="62" y="202" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Skill, Not a</text>
  <rect x="62" y="210" width="270" height="4" rx="2" fill="url(#accent)" fill-opacity="0.7"/>
  <text x="62" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.55">Dev Trick</text>
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#a855f7" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#accent)" fill-opacity="0.12"/>
</svg>
