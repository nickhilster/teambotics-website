<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Augmenting the Frontline: A Practical AI Playbook for Operations Teams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040f18"/>
      <stop offset="100%" stop-color="#071a26"/>
    </linearGradient>
    <radialGradient id="glowL" cx="32%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="68%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="22%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leftCircClip">
      <circle cx="220" cy="180" r="120"/>
    </clipPath>
    <clipPath id="rightCircClip">
      <circle cx="420" cy="180" r="120"/>
    </clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glowL)"/>
  <rect width="640" height="360" fill="url(#glowR)"/>
  <rect width="640" height="360" fill="url(#glowCenter)"/>

  <!-- Left circle — Human -->
  <circle cx="220" cy="180" r="120" fill="#0d1f30" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Human figure (simplified) -->
  <!-- Head -->
  <circle cx="220" cy="130" r="24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Body -->
  <line x1="220" y1="154" x2="220" y2="210" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="190" y1="175" x2="250" y2="175" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="220" y1="210" x2="200" y2="240" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="220" y1="210" x2="240" y2="240" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Hard hat (frontline worker symbol) -->
  <path d="M196 126 a24 24 0 0 1 48 0 Z" fill="#e2e8f0" fill-opacity="0.25"/>
  <rect x="193" y="122" width="54" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.3"/>

  <!-- Right circle — AI -->
  <circle cx="420" cy="180" r="120" fill="#071a2c" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- AI brain/circuit icon -->
  <!-- Outer ring -->
  <circle cx="420" cy="165" r="42" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Circuit nodes -->
  <circle cx="420" cy="123" r="5" fill="#0ea5e9" fill-opacity="0.7"/>
  <circle cx="462" cy="165" r="5" fill="#0ea5e9" fill-opacity="0.7"/>
  <circle cx="420" cy="207" r="5" fill="#0ea5e9" fill-opacity="0.7"/>
  <circle cx="378" cy="165" r="5" fill="#0ea5e9" fill-opacity="0.7"/>
  <!-- Diagonals -->
  <circle cx="450" cy="135" r="4" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="450" cy="195" r="4" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="390" cy="135" r="4" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="390" cy="195" r="4" fill="#0ea5e9" fill-opacity="0.5"/>
  <!-- Connections to center -->
  <line x1="420" y1="128" x2="420" y2="148" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="457" y1="165" x2="440" y2="165" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="420" y1="202" x2="420" y2="182" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="383" y1="165" x2="400" y2="165" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Center node -->
  <circle cx="420" cy="165" r="16" fill="#071a2c" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="420" cy="165" r="8" fill="#0ea5e9" fill-opacity="0.6"/>

  <!-- Overlap / Intersection glow (the collaboration zone) -->
  <path d="M320 180 m-1 0 a121 121 0 0 1 100.8 -118.8 a121 121 0 0 1 0 237.6 a121 121 0 0 1 -100.8 -118.8 Z" fill="#0ea5e9" fill-opacity="0.06"/>

  <!-- The glowing bridge line -->
  <line x1="325" y1="180" x2="315" y2="180" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.9" filter="url(#glow)"/>
  <!-- Pulse dots along the bridge -->
  <circle cx="310" cy="180" r="4" fill="#0ea5e9" fill-opacity="0.9" filter="url(#glow)"/>
  <circle cx="330" cy="180" r="3.5" fill="#0ea5e9" fill-opacity="0.7"/>

  <!-- Partnership label (bottom) -->
  <rect x="240" y="308" width="160" height="28" rx="14" fill="#071a2c" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4"/>
  <text x="320" y="327" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#0ea5e9" fill-opacity="0.8" letter-spacing="1.5">AUGMENTATION</text>

  <!-- Left label -->
  <text x="220" y="286" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#e2e8f0" fill-opacity="0.35" letter-spacing="1.5">HUMAN</text>
  <!-- Right label -->
  <text x="420" y="286" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#0ea5e9" fill-opacity="0.5" letter-spacing="1.5">AI</text>
</svg>
