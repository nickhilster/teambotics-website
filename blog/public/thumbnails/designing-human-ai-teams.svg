<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Designing Human-AI Teams: Where Augmentation Beats Full Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060510"/>
      <stop offset="100%" stop-color="#09081a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="blendAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>
  <ellipse cx="555" cy="80" rx="140" ry="110" fill="#f43f5e" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="590" cy="200" rx="100" ry="80" fill="#6366f1" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Human + AI figures overlapping, top-right -->
  <!-- Human circle (rose) -->
  <circle cx="514" cy="100" r="36" fill="#1a0810" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Head -->
  <circle cx="514" cy="84" r="10" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-opacity="0.6"/>
  <!-- Body lines -->
  <line x1="514" y1="94" x2="514" y2="116" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="500" y1="104" x2="528" y2="104" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- AI square (indigo) -->
  <circle cx="558" cy="100" r="36" fill="#0a081e" stroke="url(#accent2)" stroke-width="2" stroke-opacity="0.55"/>
  <rect x="546" y="84" width="24" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.65"/>
  <circle cx="552" cy="92" r="3" fill="#6366f1" fill-opacity="0.6"/>
  <circle cx="564" cy="92" r="3" fill="#6366f1" fill-opacity="0.6"/>
  <rect x="549" y="99" width="14" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.4"/>
  <!-- Intersection glow -->
  <circle cx="536" cy="100" r="20" fill="url(#blendAccent)" fill-opacity="0.08"/>
  <!-- Overlap label -->
  <text x="536" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#d8b4fe" fill-opacity="0.5">AUGMENTED</text>
  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#blendAccent)" fill-opacity="0.35"/>
  <!-- Tag -->
  <rect x="62" y="68" width="110" height="22" rx="11" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="117" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#fda4af" fill-opacity="0.9">HUMAN + AI</text>
  <!-- Title -->
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Designing</text>
  <text x="62" y="202" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Human-AI</text>
  <rect x="62" y="210" width="230" height="4" rx="2" fill="url(#blendAccent)" fill-opacity="0.7"/>
  <text x="62" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.55">Teams</text>
  <!-- Subtitle -->
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#f43f5e" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#blendAccent)" fill-opacity="0.12"/>
</svg>
