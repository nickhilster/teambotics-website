<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Designing Human-AI Teams: Where Augmentation Beats Full Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08060f"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </linearGradient>
    <linearGradient id="spectrumGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="25%" stop-color="#9370db"/>
      <stop offset="50%" stop-color="#64c8ff"/>
      <stop offset="75%" stop-color="#71e2ff"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Background gradient glow along spectrum bar -->
  <rect x="80" y="155" width="480" height="50" rx="25" fill="url(#spectrumGrad)" fill-opacity="0.08" filter="url(#bigGlow)"/>

  <!-- Human figure (left) -->
  <!-- Head -->
  <circle cx="70" cy="140" r="26" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Body -->
  <line x1="70" y1="166" x2="70" y2="218" stroke="#ff6b6b" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="42" y1="186" x2="98" y2="186" stroke="#ff6b6b" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="70" y1="218" x2="50" y2="248" stroke="#ff6b6b" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="70" y1="218" x2="90" y2="248" stroke="#ff6b6b" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- "HUMAN" label -->
  <text x="70" y="275" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#ff6b6b" fill-opacity="0.6" letter-spacing="1.5" font-weight="600">HUMAN</text>
  <text x="70" y="288" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#ff6b6b" fill-opacity="0.4" letter-spacing="1">CONTROL</text>

  <!-- Robot figure (right) -->
  <!-- Head (square) -->
  <rect x="546" y="114" width="48" height="46" rx="6" fill="none" stroke="#4a90e2" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Eyes -->
  <circle cx="560" cy="132" r="5" fill="#4a90e2" fill-opacity="0.7"/>
  <circle cx="578" cy="132" r="5" fill="#4a90e2" fill-opacity="0.7"/>
  <!-- Mouth -->
  <rect x="558" y="148" width="22" height="4" rx="2" fill="#4a90e2" fill-opacity="0.5"/>
  <!-- Antenna -->
  <line x1="570" y1="114" x2="570" y2="102" stroke="#4a90e2" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>
  <circle cx="570" cy="99" r="4" fill="#4a90e2" fill-opacity="0.7"/>
  <!-- Body (torso) -->
  <rect x="548" y="165" width="44" height="50" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Panel lines on body -->
  <rect x="556" y="174" width="28" height="5" rx="2.5" fill="#4a90e2" fill-opacity="0.3"/>
  <rect x="556" y="184" width="28" height="5" rx="2.5" fill="#4a90e2" fill-opacity="0.25"/>
  <!-- Arms -->
  <line x1="548" y1="178" x2="524" y2="188" stroke="#4a90e2" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="592" y1="178" x2="616" y2="188" stroke="#4a90e2" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="560" y1="215" x2="552" y2="248" stroke="#4a90e2" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="580" y1="215" x2="588" y2="248" stroke="#4a90e2" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="570" y="275" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#4a90e2" fill-opacity="0.6" letter-spacing="1.5" font-weight="600">AI</text>
  <text x="570" y="288" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#4a90e2" fill-opacity="0.4" letter-spacing="1">AUTONOMY</text>

  <!-- Spectrum bar (the central element) -->
  <rect x="110" y="168" width="420" height="24" rx="12" fill="url(#spectrumGrad)" fill-opacity="0.85"/>
  <!-- Bar glow -->
  <rect x="110" y="168" width="420" height="24" rx="12" fill="url(#spectrumGrad)" fill-opacity="0.2" filter="url(#nodeGlow)"/>

  <!-- 5 level nodes on the bar -->
  <!-- Level 1 -->
  <circle cx="152" cy="180" r="18" fill="#ff6b6b" fill-opacity="0.15" filter="url(#nodeGlow)"/>
  <circle cx="152" cy="180" r="12" fill="#14080c" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="152" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#ff6b6b">1</text>
  <text x="152" y="218" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8.5" fill="#ff6b6b" fill-opacity="0.6" letter-spacing="0">AI Informs</text>

  <!-- Level 2 -->
  <circle cx="257" cy="180" r="12" fill="#14080c" stroke="#9370db" stroke-width="2.5"/>
  <text x="257" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#9370db">2</text>
  <text x="257" y="218" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8.5" fill="#9370db" fill-opacity="0.6">Recommends</text>

  <!-- Level 3 — center/highlighted -->
  <circle cx="320" cy="180" r="22" fill="#0a1a2a" fill-opacity="0.9" filter="url(#nodeGlow)"/>
  <circle cx="320" cy="180" r="14" fill="#09111e" stroke="#64c8ff" stroke-width="3"/>
  <text x="320" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#64c8ff">3</text>
  <text x="320" y="220" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8.5" fill="#64c8ff" fill-opacity="0.7">AI Drafts</text>

  <!-- Level 4 -->
  <circle cx="383" cy="180" r="12" fill="#14080c" stroke="#71e2ff" stroke-width="2.5"/>
  <text x="383" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#71e2ff">4</text>
  <text x="383" y="218" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8.5" fill="#71e2ff" fill-opacity="0.6">AI Acts</text>

  <!-- Level 5 -->
  <circle cx="488" cy="180" r="12" fill="#14080c" stroke="#4a90e2" stroke-width="2.5"/>
  <text x="488" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#4a90e2">5</text>
  <text x="488" y="218" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="8.5" fill="#4a90e2" fill-opacity="0.6">Automated</text>

  <!-- Bottom axis label -->
  <text x="110" y="308" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.2" letter-spacing="1">← Human Control</text>
  <text x="530" y="308" text-anchor="end" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.2" letter-spacing="1">AI Autonomy →</text>

  <!-- Title -->
  <text x="320" y="52" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.35" letter-spacing="1.5">THE COLLABORATION GRADIENT</text>
</svg>
