<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="The Context Recovery Problem in Agentic Work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="recoveryBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <ellipse cx="556" cy="90" rx="134" ry="96" fill="#f59e0b" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="576" cy="222" rx="112" ry="82" fill="#a78bfa" fill-opacity="0.06" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side icon: scattered fragments recovering into a whole -->
  <rect x="462" y="86" width="20" height="20" rx="5" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.45" transform="rotate(-12 472 96)"/>
  <rect x="484" y="140" width="16" height="16" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(10 492 148)"/>
  <rect x="454" y="150" width="14" height="14" rx="4" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-6 461 157)"/>
  <path d="M482 100c14 8 22 20 24 34" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <path d="M494 146c8 4 12 8 14 12" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <path d="M466 156c8 2 14 6 18 10" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <circle cx="536" cy="140" r="34" fill="#071023" stroke="url(#recoveryBlend)" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M524 140 l8 8 l16 -18" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  <text x="536" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#fde68a" fill-opacity="0.5">CONTEXT RECOVERY</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#recoveryBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="144" height="22" rx="11" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="134" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#fde68a" fill-opacity="0.92">AGENTIC WORK</text>

  <!-- Main title -->
  <text x="62" y="140" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">The Context</text>
  <text x="62" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Recovery</text>
  <rect x="62" y="196" width="216" height="4" rx="2" fill="url(#recoveryBlend)" fill-opacity="0.70"/>
  <text x="62" y="244" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.68">Problem</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#f59e0b" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#recoveryBlend)" fill-opacity="0.12"/>
</svg>
