<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Trust Architecture: The Missing Layer in Enterprise AI Adoption">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="trustBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <ellipse cx="556" cy="90" rx="134" ry="96" fill="#6366f1" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="576" cy="222" rx="112" ry="82" fill="#22d3ee" fill-opacity="0.06" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side icon: stacked architecture layers with a trust shield -->
  <rect x="486" y="176" width="112" height="30" rx="8" fill="#071023" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="498" y="146" width="88" height="30" rx="8" fill="#071023" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.34"/>
  <rect x="510" y="116" width="64" height="30" rx="8" fill="#071023" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.38"/>
  <path d="M542 62 l30 12 v30 c0 24-14 38-30 44-16-6-30-20-30-44v-30 Z" fill="#0b1120" stroke="url(#trustBlend)" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M530 92 l8 8 l16 -16" fill="none" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  <text x="542" y="228" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#a5f3fc" fill-opacity="0.5">TRUST LAYER</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#trustBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="135" height="22" rx="11" fill="#6366f1" fill-opacity="0.10" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="129" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#c7d2fe" fill-opacity="0.92">TRUST LAYER</text>

  <!-- Main title -->
  <text x="62" y="140" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Trust</text>
  <text x="62" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Architecture</text>
  <rect x="62" y="196" width="270" height="4" rx="2" fill="url(#trustBlend)" fill-opacity="0.70"/>
  <text x="62" y="244" font-family="ui-sans-serif,system-ui,sans-serif" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.68">Enterprise AI</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#3b82f6" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#trustBlend)" fill-opacity="0.12"/>
</svg>
