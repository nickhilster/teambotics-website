<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Applied AI in Regulated Environments: What You Cannot Compromise">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0804"/>
      <stop offset="100%" stop-color="#1a0e06"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Subtle grid (regulated/formal feel) -->
  <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#f97316" stroke-width="0.3" stroke-opacity="0.07"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid)"/>

  <rect width="640" height="360" fill="url(#shieldGlow)"/>

  <!-- The central shield -->
  <!-- Shield shadow/glow layer -->
  <path d="M320 60 L420 96 L420 210 Q420 290 320 316 Q220 290 220 210 L220 96 Z" fill="#f97316" fill-opacity="0.05" filter="url(#glow)"/>
  <!-- Shield outline -->
  <path d="M320 60 L420 96 L420 210 Q420 290 320 316 Q220 290 220 210 L220 96 Z" fill="url(#shieldFill)" stroke="#f97316" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Inner shield (inset) -->
  <path d="M320 82 L400 112 L400 208 Q400 272 320 295 Q240 272 240 208 L240 112 Z" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Checkmark (the compliance symbol) -->
  <path d="M272 185 l30 32 l60 -68" stroke="#f97316" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glow on checkmark -->
  <path d="M272 185 l30 32 l60 -68" stroke="#f97316" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.15" filter="url(#glow)"/>

  <!-- Five requirement dots orbiting the shield -->
  <!-- Auditability -->
  <circle cx="140" cy="100" r="20" fill="#1a0e06" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="158" y1="108" x2="222" y2="128" stroke="#f97316" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <text x="140" y="105" text-anchor="middle" font-size="14">📋</text>

  <!-- Human review -->
  <circle cx="100" cy="210" r="20" fill="#1a0e06" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="120" y1="210" x2="222" y2="210" stroke="#f97316" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <text x="100" y="215" text-anchor="middle" font-size="14">👤</text>

  <!-- Version control -->
  <circle cx="140" cy="310" r="20" fill="#1a0e06" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="158" y1="302" x2="224" y2="274" stroke="#f97316" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <text x="140" y="315" text-anchor="middle" font-size="14">🏷️</text>

  <!-- Data governance -->
  <circle cx="500" cy="310" r="20" fill="#1a0e06" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="482" y1="302" x2="416" y2="274" stroke="#f97316" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <text x="500" y="315" text-anchor="middle" font-size="14">🔒</text>

  <!-- Explainability -->
  <circle cx="540" cy="100" r="20" fill="#1a0e06" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="522" y1="108" x2="418" y2="128" stroke="#f97316" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <text x="540" y="105" text-anchor="middle" font-size="14">💡</text>

  <!-- Top label -->
  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#f97316" fill-opacity="0.6" letter-spacing="2">REGULATED ENVIRONMENTS</text>
</svg>
