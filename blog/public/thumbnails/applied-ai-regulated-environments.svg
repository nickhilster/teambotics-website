<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Applied AI in Regulated Environments: Moving Carefully but Moving Forward">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04090f"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <ellipse cx="560" cy="95" rx="150" ry="120" fill="#0ea5e9" fill-opacity="0.08" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Shield shape top-right -->
  <path d="M546 44 l52 20 v44 c0 28 -52 56 -52 56 c0 0 -52 -28 -52 -56 v-44 Z" fill="#060c18" stroke="#0ea5e9" stroke-width="1.8" stroke-opacity="0.45"/>
  <path d="M546 60 l36 14 v30 c0 20 -36 40 -36 40 c0 0 -36 -20 -36 -40 v-30 Z" fill="none" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Checkmark inside shield -->
  <path d="M532 108 l10 10 18 -22" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>
  <!-- Left bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#accent)" fill-opacity="0.35"/>
  <!-- Tag -->
  <rect x="62" y="68" width="134" height="22" rx="11" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="129" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#7dd3fc" fill-opacity="0.9">REGULATED AI</text>
  <!-- Title -->
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Moving</text>
  <text x="62" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Carefully,</text>
  <rect x="62" y="212" width="235" height="4" rx="2" fill="url(#accent)" fill-opacity="0.7"/>
  <text x="62" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.6">Moving Forward</text>
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#0ea5e9" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#accent)" fill-opacity="0.12"/>
</svg>
