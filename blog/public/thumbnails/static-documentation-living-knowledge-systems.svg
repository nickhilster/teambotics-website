<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Static Documentation Is Breaking. Living Knowledge Systems Are Next.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="knowledgeBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="78%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <ellipse cx="556" cy="88" rx="132" ry="96" fill="#34d399" fill-opacity="0.07" filter="url(#blur)" clip-path="url(#clip)"/>
  <ellipse cx="578" cy="220" rx="112" ry="82" fill="#38bdf8" fill-opacity="0.06" filter="url(#blur)" clip-path="url(#clip)"/>

  <!-- Right-side icon: a static document dissolving into a living knowledge graph -->
  <rect x="470" y="70" width="70" height="94" rx="10" fill="#071023" stroke="#34d399" stroke-width="1" stroke-opacity="0.28"/>
  <rect x="482" y="86" width="46" height="8" rx="4" fill="#5eead4" fill-opacity="0.4"/>
  <rect x="482" y="102" width="36" height="6" rx="3" fill="#5eead4" fill-opacity="0.24"/>
  <rect x="482" y="116" width="42" height="6" rx="3" fill="#5eead4" fill-opacity="0.18"/>
  <rect x="482" y="130" width="30" height="6" rx="3" fill="#5eead4" fill-opacity="0.14"/>
  <line x1="540" y1="120" x2="572" y2="108" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <line x1="540" y1="140" x2="576" y2="150" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <line x1="572" y1="108" x2="576" y2="150" stroke="#5eead4" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="572" cy="108" r="6" fill="#38bdf8" fill-opacity="0.75"/>
  <circle cx="576" cy="150" r="6" fill="#14b8a6" fill-opacity="0.75"/>
  <circle cx="596" cy="128" r="5" fill="#5eead4" fill-opacity="0.7"/>
  <line x1="572" y1="108" x2="596" y2="128" stroke="#5eead4" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="576" y1="150" x2="596" y2="128" stroke="#5eead4" stroke-width="1" stroke-opacity="0.3"/>
  <text x="534" y="196" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#99f6e4" fill-opacity="0.5">KNOWLEDGE GRAPH</text>

  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#knowledgeBlend)" fill-opacity="0.35"/>

  <!-- Tag -->
  <rect x="62" y="68" width="116" height="22" rx="11" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-width="0.75" stroke-opacity="0.40"/>
  <text x="120" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#99f6e4" fill-opacity="0.92">KNOWLEDGE</text>

  <!-- Main title -->
  <text x="62" y="140" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Static Docs,</text>
  <text x="62" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Living</text>
  <rect x="62" y="196" width="150" height="4" rx="2" fill="url(#knowledgeBlend)" fill-opacity="0.70"/>
  <text x="62" y="244" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1" fill-opacity="0.68">Knowledge</text>

  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#34d399" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#knowledgeBlend)" fill-opacity="0.12"/>
</svg>
