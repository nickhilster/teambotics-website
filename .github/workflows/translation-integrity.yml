name: Translation Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify translation artifacts
        run: pnpm translations:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Product localization tests
        run: pnpm test lib/products.test.ts

      - name: Build application
        run: pnpm exec next build
