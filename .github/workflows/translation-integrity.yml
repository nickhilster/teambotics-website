name: Translation Integrity

# PR checks remain unconditional so required status checks never stay pending
# because a pull request only changed documentation or tracker files.
on:
  pull_request:
  push:
    branches:
      - main
    # GitHub skips the push workflow only when *every* changed file matches
    # one of these non-runtime paths. Mixed commits still run the full gate.
    paths-ignore:
      - '.tracker/**'
      - 'docs/**'

# Cancel superseded PR runs; never cancel main-branch verification.
concurrency:
  group: translation-integrity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify translation artifacts
        run: pnpm translations:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Product localization tests
        run: pnpm test lib/products.test.ts

      - name: Build application
        run: pnpm exec next build
