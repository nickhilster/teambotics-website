<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="rb-title rb-desc">
  <title id="rb-title">RedactorBuddy offline redaction banner</title>
  <desc id="rb-desc">Dark interface showing an offline-first redaction workflow with document input, PII detection, risk scoring, and safe export.</desc>

  <defs>
    <linearGradient id="rb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#151a22"/>
    </linearGradient>
    <linearGradient id="rb-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6aa6ff"/>
      <stop offset="100%" stop-color="#4f8ef7"/>
    </linearGradient>
    <filter id="rb-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#rb-bg)"/>
  <circle cx="980" cy="112" r="110" fill="#4f8ef7" opacity="0.08" filter="url(#rb-glow)"/>
  <circle cx="142" cy="520" r="120" fill="#4f8ef7" opacity="0.06" filter="url(#rb-glow)"/>

  <text x="60" y="74" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="20" letter-spacing="3">REDACTORBUDDY · OFFLINE REDACTION</text>
  <text x="60" y="152" fill="#f4f7fb" font-family="Bricolage Grotesque, sans-serif" font-size="60" font-weight="800">Financial document cleanup</text>
  <text x="60" y="198" fill="#8ea0b8" font-family="Hanken Grotesk, sans-serif" font-size="24">PII stripped locally before files reach AI tools, processors, or downstream review.</text>

  <rect x="172" y="238" width="856" height="322" rx="28" fill="#161b22" stroke="#6aa6ff" stroke-opacity="0.16"/>
  <rect x="198" y="262" width="804" height="50" rx="14" fill="#10151c"/>
  <circle cx="224" cy="287" r="6" fill="#4f8ef7"/>
  <text x="244" y="294" fill="#f4f7fb" font-family="Bricolage Grotesque, sans-serif" font-size="26" font-weight="800">RedactorBuddy</text>
  <text x="496" y="294" fill="#7f92ab" font-family="Geist Mono, monospace" font-size="16">No cloud   Risk scoring   Audit trail   Safe export</text>

  <rect x="220" y="338" width="224" height="186" rx="20" fill="#0d1117" stroke="#4f8ef7" stroke-opacity="0.2"/>
  <text x="246" y="370" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="18">INPUT</text>
  <rect x="246" y="392" width="172" height="102" rx="14" fill="#161b22" stroke="#2d333b"/>
  <rect x="264" y="410" width="136" height="12" rx="6" fill="#f4f7fb" opacity="0.92"/>
  <rect x="264" y="432" width="118" height="10" rx="5" fill="#7a8899" opacity="0.85"/>
  <rect x="264" y="450" width="126" height="10" rx="5" fill="#7a8899" opacity="0.68"/>
  <rect x="264" y="468" width="94" height="10" rx="5" fill="#7a8899" opacity="0.52"/>
  <text x="246" y="516" fill="#f4f7fb" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700">Bank statement</text>
  <text x="246" y="544" fill="#8ea0b8" font-family="Hanken Grotesk, sans-serif" font-size="20">Drop file or watch folder</text>

  <rect x="488" y="338" width="224" height="186" rx="20" fill="#0d1117" stroke="#4f8ef7" stroke-opacity="0.2"/>
  <text x="514" y="370" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="18">DETECTION</text>
  <rect x="514" y="396" width="172" height="28" rx="14" fill="#4f8ef7" opacity="0.12" stroke="#4f8ef7" stroke-opacity="0.24"/>
  <text x="600" y="414" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="14" text-anchor="middle">NAME → REMOVED</text>
  <rect x="514" y="434" width="172" height="28" rx="14" fill="#4f8ef7" opacity="0.12" stroke="#4f8ef7" stroke-opacity="0.24"/>
  <text x="600" y="452" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="14" text-anchor="middle">ACCOUNT # → MASKED</text>
  <rect x="514" y="472" width="172" height="28" rx="14" fill="#4f8ef7" opacity="0.12" stroke="#4f8ef7" stroke-opacity="0.24"/>
  <text x="600" y="490" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="14" text-anchor="middle">ADDRESS → REDACTED</text>
  <text x="514" y="522" fill="#f4f7fb" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700">Rules + local AI</text>
  <text x="514" y="548" fill="#8ea0b8" font-family="Hanken Grotesk, sans-serif" font-size="20">Dual-layer PII cleanup</text>

  <rect x="756" y="338" width="246" height="186" rx="20" fill="#0d1117" stroke="#4f8ef7" stroke-opacity="0.2"/>
  <text x="782" y="370" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="18">EXPORT</text>
  <rect x="784" y="396" width="190" height="72" rx="16" fill="#161b22" stroke="#2d333b"/>
  <text x="808" y="424" fill="#8ea0b8" font-family="Geist Mono, monospace" font-size="14">RISK LEVEL</text>
  <text x="808" y="454" fill="#f4f7fb" font-family="Bricolage Grotesque, sans-serif" font-size="34" font-weight="800">LOW</text>
  <rect x="914" y="430" width="38" height="14" rx="7" fill="#4f8ef7"/>
  <text x="782" y="502" fill="#f4f7fb" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700">Safe output</text>
  <text x="782" y="528" fill="#8ea0b8" font-family="Hanken Grotesk, sans-serif" font-size="20">JSON · CSV · Markdown</text>
  <text x="782" y="552" fill="#8ea0b8" font-family="Hanken Grotesk, sans-serif" font-size="20">Ready for handoff</text>

  <g font-family="Geist Mono, monospace" font-size="16">
    <path d="M444 430H488" stroke="#4f8ef7" stroke-width="4"/>
    <path d="M712 430H756" stroke="#4f8ef7" stroke-width="4"/>
    <path d="M172 286H118V214" stroke="#4f8ef7" stroke-width="4" fill="none"/>
    <text x="64" y="210" fill="#6aa6ff">Windows only</text>
    <path d="M1028 286H1082V214" stroke="#4f8ef7" stroke-width="4" fill="none"/>
    <text x="1000" y="210" fill="#6aa6ff">0 cloud calls</text>
  </g>

  <text x="60" y="584" fill="#6aa6ff" font-family="Geist Mono, monospace" font-size="20" letter-spacing="2">Request access · teambotics.app/RedactorBuddy</text>
</svg>