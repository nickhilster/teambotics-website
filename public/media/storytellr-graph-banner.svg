<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="stlr-title stlr-desc">
  <title id="stlr-title">Storytellr narrative graph</title>
  <desc id="stlr-desc">Storytellr dark graph canvas with colored category nodes: green Projects, red Pivots, blue Identify, purple Influence — connected by edges with tag pills and a category legend.</desc>

  <!-- Dark graph canvas -->
  <rect width="1200" height="630" fill="#0e0f14"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="stlr-glow" cx="55%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0e0f14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#stlr-glow)"/>

  <!-- App bar -->
  <rect width="1200" height="48" fill="#13141a" fill-opacity="0.95"/>
  <text x="24" y="30" fill="#e8e8f0" font-family="Geist Mono, monospace" font-size="16" font-weight="700" letter-spacing="1">storytellr</text>
  <text x="160" y="30" fill="#4a4a5a" font-family="Hanken Grotesk, sans-serif" font-size="14">Graph</text>
  <text x="220" y="30" fill="#4a4a5a" font-family="Hanken Grotesk, sans-serif" font-size="14">Timeline</text>
  <text x="300" y="30" fill="#4a4a5a" font-family="Hanken Grotesk, sans-serif" font-size="14">Resume</text>
  <text x="375" y="30" fill="#4a4a5a" font-family="Hanken Grotesk, sans-serif" font-size="14">Portfolio</text>
  <!-- Search pill -->
  <rect x="900" y="12" width="220" height="24" rx="12" fill="#1e1f28" stroke="#2e2f3e" stroke-width="1"/>
  <text x="916" y="28" fill="#4a4a5a" font-family="Hanken Grotesk, sans-serif" font-size="13">Search your graph…</text>
  <!-- Avatar -->
  <circle cx="1160" cy="24" r="14" fill="#3d2d8a"/>
  <text x="1160" y="29" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="700" text-anchor="middle">J</text>

  <!-- Tag pills (floating) -->
  <!-- Row 1 -->
  <rect x="60" y="72" width="50" height="22" rx="11" fill="#1e3a2a" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="85" y="87" fill="#22c55e" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle">AI</text>

  <rect x="120" y="72" width="86" height="22" rx="11" fill="#1e2a3a" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1"/>
  <text x="163" y="87" fill="#60a5fa" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle">SD &amp; UX</text>

  <rect x="216" y="72" width="124" height="22" rx="11" fill="#1e1a3a" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
  <text x="278" y="87" fill="#a78bfa" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle">AI &amp; automation</text>

  <rect x="350" y="72" width="126" height="22" rx="11" fill="#1e3a2a" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="413" y="87" fill="#22c55e" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle">Creative Journey</text>

  <rect x="486" y="72" width="84" height="22" rx="11" fill="#3a1e1e" stroke="#f87171" stroke-opacity="0.4" stroke-width="1"/>
  <text x="528" y="87" fill="#f87171" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle">Hollywood</text>

  <rect x="580" y="72" width="52" height="22" rx="11" fill="#1e2a3a" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1"/>
  <text x="606" y="87" fill="#60a5fa" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle">PPM</text>

  <!-- Graph edges -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <line x1="224" y1="310" x2="380" y2="248"/>
    <line x1="224" y1="324" x2="356" y2="458"/>
    <line x1="224" y1="316" x2="490" y2="380"/>
    <line x1="422" y1="236" x2="580" y2="290"/>
    <line x1="404" y1="260" x2="440" y2="420"/>
    <line x1="436" y1="234" x2="680" y2="210"/>
    <line x1="620" y1="308" x2="780" y2="350"/>
    <line x1="608" y1="278" x2="688" y2="218"/>
    <line x1="388" y1="462" x2="444" y2="432"/>
    <line x1="506" y1="428" x2="796" y2="366"/>
    <line x1="718" y1="218" x2="808" y2="342"/>
    <line x1="840" y1="366" x2="978" y2="310"/>
    <line x1="510" y1="384" x2="796" y2="370"/>
  </g>

  <!-- NODE: Identity (left anchor) — blue -->
  <circle cx="200" cy="316" r="56" fill="#0e1828" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2"/>
  <text x="200" y="308" fill="#60a5fa" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle" letter-spacing="1">IDENTIFY</text>
  <text x="200" y="326" fill="#93c5fd" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">Senior PM</text>
  <text x="200" y="342" fill="#4a6a8a" font-family="Hanken Grotesk, sans-serif" font-size="11" text-anchor="middle">2019–now</text>

  <!-- NODE: Project (center-left high) — green -->
  <circle cx="402" cy="238" r="56" fill="#0e1e14" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2"/>
  <text x="402" y="230" fill="#22c55e" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle" letter-spacing="1">PROJECT</text>
  <text x="402" y="248" fill="#86efac" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">RyFine v1</text>
  <text x="402" y="264" fill="#2e6a42" font-family="Hanken Grotesk, sans-serif" font-size="11" text-anchor="middle">2021</text>

  <!-- NODE: Pivot (center-left low) — red/pink -->
  <circle cx="358" cy="462" r="46" fill="#1e0e0e" stroke="#f87171" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="358" y="455" fill="#f87171" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle" letter-spacing="1">PIVOT</text>
  <text x="358" y="472" fill="#fca5a5" font-family="Hanken Grotesk, sans-serif" font-size="12" text-anchor="middle">B2C → B2B</text>

  <!-- NODE: Project 2 — green -->
  <circle cx="498" cy="384" r="46" fill="#0e1e14" stroke="#22c55e" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="498" y="377" fill="#22c55e" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle" letter-spacing="1">PROJECT</text>
  <text x="498" y="394" fill="#86efac" font-family="Hanken Grotesk, sans-serif" font-size="12" text-anchor="middle">Code2Motion</text>

  <!-- NODE: Influence (center) — purple -->
  <circle cx="604" cy="298" r="54" fill="#140e28" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2"/>
  <text x="604" y="290" fill="#a78bfa" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="1">INFLUENCE</text>
  <text x="604" y="308" fill="#c4b5fd" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">Design Lead</text>
  <text x="604" y="324" fill="#5a4a8a" font-family="Hanken Grotesk, sans-serif" font-size="11" text-anchor="middle">Collaborator</text>

  <!-- NODE: Identify 2 — blue -->
  <circle cx="700" cy="210" r="46" fill="#0e1828" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="700" y="203" fill="#60a5fa" font-family="Geist Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="1">IDENTIFY</text>
  <text x="700" y="220" fill="#93c5fd" font-family="Hanken Grotesk, sans-serif" font-size="12" text-anchor="middle">Applied AI</text>

  <!-- NODE: Project 3 — green -->
  <circle cx="480" cy="440" r="36" fill="#0e1e14" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
  <text x="480" y="433" fill="#22c55e" font-family="Geist Mono, monospace" font-size="10" text-anchor="middle">PROJECT</text>
  <text x="480" y="448" fill="#86efac" font-family="Hanken Grotesk, sans-serif" font-size="11" text-anchor="middle">LTB Buddy</text>

  <!-- NODE: Outcome — brighter purple, center-right -->
  <circle cx="820" cy="358" r="58" fill="#14101e" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2.5"/>
  <text x="820" y="348" fill="#a78bfa" font-family="Geist Mono, monospace" font-size="13" text-anchor="middle" letter-spacing="1">OUTCOME</text>
  <text x="820" y="366" fill="#e9d5ff" font-family="Hanken Grotesk, sans-serif" font-size="14" text-anchor="middle">Teambotics</text>
  <text x="820" y="382" fill="#7c5abf" font-family="Hanken Grotesk, sans-serif" font-size="12" text-anchor="middle">Founded 2022</text>

  <!-- NODE: Present (far right) — glowing -->
  <circle cx="1006" cy="304" r="52" fill="#1a1030" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="2.5"/>
  <circle cx="1006" cy="304" r="64" fill="none" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="1"/>
  <text x="1006" y="296" fill="#c4b5fd" font-family="Geist Mono, monospace" font-size="13" text-anchor="middle">PRESENT</text>
  <text x="1006" y="314" fill="#f5f0ff" font-family="Hanken Grotesk, sans-serif" font-size="14" text-anchor="middle">You, now</text>

  <!-- Category legend -->
  <rect x="840" y="460" width="304" height="144" rx="14" fill="#13141a" stroke="#2e2f3e" stroke-width="1"/>
  <text x="862" y="484" fill="#6b7280" font-family="Geist Mono, monospace" font-size="11" letter-spacing="2">CATEGORIES</text>

  <circle cx="876" cy="506" r="7" fill="#0e1e14" stroke="#22c55e" stroke-width="1.5"/>
  <text x="892" y="511" fill="#86efac" font-family="Hanken Grotesk, sans-serif" font-size="13">Project</text>

  <circle cx="964" cy="506" r="7" fill="#1e0e0e" stroke="#f87171" stroke-width="1.5"/>
  <text x="980" y="511" fill="#fca5a5" font-family="Hanken Grotesk, sans-serif" font-size="13">Pivot</text>

  <circle cx="876" cy="534" r="7" fill="#0e1828" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="892" y="539" fill="#93c5fd" font-family="Hanken Grotesk, sans-serif" font-size="13">Identify</text>

  <circle cx="964" cy="534" r="7" fill="#140e28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="980" y="539" fill="#c4b5fd" font-family="Hanken Grotesk, sans-serif" font-size="13">Influence</text>

  <line x1="862" y1="554" x2="1126" y2="554" stroke="#2e2f3e" stroke-width="1"/>
  <text x="862" y="574" fill="#4a4a5a" font-family="Hanken Grotesk, sans-serif" font-size="12">Work as a graph, not a flat timeline.</text>
  <text x="862" y="592" fill="#3a3a4a" font-family="Geist Mono, monospace" font-size="11">storytellr · teambotics</text>

  <!-- Bottom-left tagline -->
  <text x="60" y="550" fill="#e8e8f0" font-family="Bricolage Grotesque, sans-serif" font-size="38" font-weight="800">The Full Picture.</text>
  <text x="60" y="590" fill="#4a4a6a" font-family="Hanken Grotesk, sans-serif" font-size="16">Every project, decision, and pivot —</text>
  <text x="60" y="612" fill="#4a4a6a" font-family="Hanken Grotesk, sans-serif" font-size="16">connected as your story.</text>
</svg>
