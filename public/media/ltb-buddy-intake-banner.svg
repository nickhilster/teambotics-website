<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="ltb-title ltb-desc">
  <title id="ltb-title">LTB Buddy — Ontario tenant rights app</title>
  <desc id="ltb-desc">LTB Buddy light-theme interface: language selector, four guided steps from conversation to LTB application filing.</desc>

  <!-- Light background -->
  <rect width="1200" height="630" fill="#eef1f7"/>

  <!-- Nav bar -->
  <rect width="1200" height="54" fill="#ffffff"/>
  <text x="32" y="34" fill="#0d1b4d" font-family="Geist Mono, monospace" font-size="18" font-weight="700">⚖ LTBBuddy</text>
  <text x="460" y="34" fill="#4a5a7d" font-family="Hanken Grotesk, sans-serif" font-size="14">My Applications</text>
  <text x="610" y="34" fill="#4a5a7d" font-family="Hanken Grotesk, sans-serif" font-size="14">Evidence Vault</text>
  <text x="740" y="34" fill="#4a5a7d" font-family="Hanken Grotesk, sans-serif" font-size="14">Resources</text>
  <!-- Light/Dark toggles -->
  <rect x="870" y="14" width="60" height="26" rx="13" fill="#0d1b4d"/>
  <text x="900" y="31" fill="#ffffff" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">Light</text>
  <rect x="938" y="14" width="56" height="26" rx="13" fill="none" stroke="#c8cee0"/>
  <text x="966" y="31" fill="#4a5a7d" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">Dark</text>
  <!-- Sign In -->
  <rect x="1112" y="14" width="72" height="26" rx="6" fill="#0d1b4d"/>
  <text x="1148" y="31" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">Sign In</text>

  <!-- Heading -->
  <text x="600" y="118" fill="#0d1b4d" font-family="Bricolage Grotesque, sans-serif" font-size="50" font-weight="800" text-anchor="middle">Ontario Tenant Rights Help</text>
  <text x="600" y="170" fill="#0d1b4d" font-family="Bricolage Grotesque, sans-serif" font-size="50" font-weight="800" text-anchor="middle">In Your Language</text>
  <text x="600" y="204" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="17" text-anchor="middle">Navigate your LTB application with confidence</text>

  <!-- Language pills -->
  <rect x="382" y="222" width="44" height="28" rx="14" fill="#0d1b4d"/>
  <text x="404" y="240" fill="#ffffff" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">EN</text>
  <rect x="432" y="222" width="40" height="28" rx="14" fill="#ffffff" stroke="#c8cee0" stroke-width="1"/>
  <text x="452" y="240" fill="#4a5a7d" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">FR</text>
  <rect x="478" y="222" width="40" height="28" rx="14" fill="#ffffff" stroke="#c8cee0" stroke-width="1"/>
  <text x="498" y="240" fill="#4a5a7d" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">HI</text>
  <rect x="524" y="222" width="40" height="28" rx="14" fill="#ffffff" stroke="#c8cee0" stroke-width="1"/>
  <text x="544" y="240" fill="#4a5a7d" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">ZH</text>
  <rect x="570" y="222" width="40" height="28" rx="14" fill="#ffffff" stroke="#c8cee0" stroke-width="1"/>
  <text x="590" y="240" fill="#4a5a7d" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">ES</text>
  <rect x="616" y="222" width="40" height="28" rx="14" fill="#ffffff" stroke="#c8cee0" stroke-width="1"/>
  <text x="636" y="240" fill="#4a5a7d" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">PA</text>
  <rect x="662" y="222" width="40" height="28" rx="14" fill="#ffffff" stroke="#c8cee0" stroke-width="1"/>
  <text x="682" y="240" fill="#4a5a7d" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">AR</text>

  <!-- CTA buttons -->
  <rect x="368" y="264" width="248" height="40" rx="20" fill="#0d1b4d"/>
  <text x="492" y="289" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Start Your Application →</text>
  <rect x="632" y="264" width="200" height="40" rx="20" fill="none" stroke="#0d1b4d" stroke-width="1.5"/>
  <text x="732" y="289" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="16" text-anchor="middle">Learn Your Rights</text>

  <!-- "How It Works" label -->
  <text x="600" y="348" fill="#0d1b4d" font-family="Bricolage Grotesque, sans-serif" font-size="22" font-weight="700" text-anchor="middle">How It Works</text>
  <text x="600" y="372" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="14" text-anchor="middle">Four steps to document your case and prepare your application</text>

  <!-- Step cards (4 across) -->
  <!-- Card 1 -->
  <rect x="84" y="394" width="234" height="182" rx="16" fill="#ffffff" stroke="#dde4f0" stroke-width="1"/>
  <circle cx="119" cy="414" r="18" fill="#0d1b4d"/>
  <text x="119" y="420" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text>
  <text x="167" y="444" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="26" text-anchor="middle">💬</text>
  <text x="201" y="488" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Have a</text>
  <text x="201" y="508" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Conversation</text>
  <text x="201" y="534" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">AI listens with</text>
  <text x="201" y="552" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">empathy first</text>

  <!-- Card 2 -->
  <rect x="334" y="394" width="234" height="182" rx="16" fill="#ffffff" stroke="#dde4f0" stroke-width="1"/>
  <circle cx="369" cy="414" r="18" fill="#0d1b4d"/>
  <text x="369" y="420" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text>
  <text x="451" y="444" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="26" text-anchor="middle">📋</text>
  <text x="451" y="488" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Document</text>
  <text x="451" y="508" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">the Details</text>
  <text x="451" y="534" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">Guided questions,</text>
  <text x="451" y="552" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">plain language</text>

  <!-- Card 3 -->
  <rect x="584" y="394" width="234" height="182" rx="16" fill="#ffffff" stroke="#dde4f0" stroke-width="1"/>
  <circle cx="619" cy="414" r="18" fill="#0d1b4d"/>
  <text x="619" y="420" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text>
  <text x="701" y="444" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="26" text-anchor="middle">📁</text>
  <text x="701" y="488" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Build Your</text>
  <text x="701" y="508" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Evidence</text>
  <text x="701" y="534" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">Organize photos</text>
  <text x="701" y="552" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">and documents</text>

  <!-- Card 4 -->
  <rect x="834" y="394" width="282" height="182" rx="16" fill="#ffffff" stroke="#dde4f0" stroke-width="1"/>
  <circle cx="869" cy="414" r="18" fill="#0d1b4d"/>
  <text x="869" y="420" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text>
  <text x="975" y="444" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="26" text-anchor="middle">📖</text>
  <text x="975" y="488" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">File Your</text>
  <text x="975" y="508" fill="#0d1b4d" font-family="Hanken Grotesk, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Application</text>
  <text x="975" y="534" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">Step-by-step LTB</text>
  <text x="975" y="552" fill="#6b7a99" font-family="Hanken Grotesk, sans-serif" font-size="13" text-anchor="middle">submission guide</text>
</svg>
