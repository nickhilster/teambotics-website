<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="c2m-title c2m-desc">
  <title id="c2m-title">Code2Motion dual platform map</title>
  <desc id="c2m-desc">Code2Motion platform split: PlayRoom for discovering generative experiences, ToyMaker for building PWA-ready browser apps.</desc>
  <rect width="1200" height="630" fill="#0b0c10"/>

  <text x="60" y="74" fill="#f472b6" font-family="Geist Mono, monospace" font-size="20" letter-spacing="3">CODE2MOTION · PLATFORM MAP</text>
  <text x="60" y="152" fill="#f4f4f6" font-family="Bricolage Grotesque, sans-serif" font-size="62" font-weight="800">Dual Platform</text>
  <text x="60" y="196" fill="#b8b8c5" font-family="Hanken Grotesk, sans-serif" font-size="24">Discover generative experiences. Build your own.</text>

  <!-- Divider line between panels -->
  <line x1="600" y1="228" x2="600" y2="512" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Left panel: PlayRoom -->
  <rect x="60" y="228" width="516" height="284" rx="20" fill="#14141a" stroke="#f472b6" stroke-opacity="0.28"/>
  <text x="88" y="272" fill="#f472b6" font-family="Geist Mono, monospace" font-size="16" letter-spacing="2">PLAYROOM</text>
  <text x="88" y="312" fill="#f4f4f6" font-family="Bricolage Grotesque, sans-serif" font-size="32" font-weight="800">Discover</text>

  <!-- Generative motion circles (decorative) -->
  <circle cx="340" cy="390" r="52" fill="none" stroke="#f472b6" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="340" cy="390" r="34" fill="none" stroke="#f472b6" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="340" cy="390" r="18" fill="#f472b6" fill-opacity="0.12"/>
  <circle cx="420" cy="360" r="30" fill="none" stroke="#c8f750" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="420" cy="360" r="14" fill="#c8f750" fill-opacity="0.1"/>
  <circle cx="270" cy="420" r="22" fill="none" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="450" cy="430" r="18" fill="none" stroke="#c8f750" stroke-opacity="0.18" stroke-width="1"/>

  <text x="88" y="350" fill="#8b8b99" font-family="Hanken Grotesk, sans-serif" font-size="19">Interactive c2merses and motion</text>
  <text x="88" y="376" fill="#8b8b99" font-family="Hanken Grotesk, sans-serif" font-size="19">studies built for the browser.</text>
  <text x="88" y="468" fill="#f472b6" font-family="Geist Mono, monospace" font-size="14">Generative motion · Canvas · PWA</text>

  <!-- Right panel: ToyMaker -->
  <rect x="624" y="228" width="516" height="284" rx="20" fill="#14141a" stroke="#c8f750" stroke-opacity="0.28"/>
  <text x="652" y="272" fill="#c8f750" font-family="Geist Mono, monospace" font-size="16" letter-spacing="2">TOYMAKER</text>
  <text x="652" y="312" fill="#f4f4f6" font-family="Bricolage Grotesque, sans-serif" font-size="32" font-weight="800">Build</text>

  <!-- Code editor mockup (decorative) -->
  <rect x="652" y="332" width="460" height="120" rx="12" fill="#0d1117"/>
  <text x="672" y="358" fill="#c8f750" font-family="Geist Mono, monospace" font-size="13">const scene = new C2M.Scene()</text>
  <text x="672" y="378" fill="#5cc8ff" font-family="Geist Mono, monospace" font-size="13">scene.add( particles(800, palette.neon) )</text>
  <text x="672" y="398" fill="#8b8b99" font-family="Geist Mono, monospace" font-size="13">scene.loop( t =&gt; rotate(t * 0.4) )</text>
  <text x="672" y="418" fill="#f4f4f6" font-family="Geist Mono, monospace" font-size="13">scene.publish( "my-experience" )</text>
  <text x="672" y="438" fill="#8b8b99" font-family="Geist Mono, monospace" font-size="13">// PWA-ready · no WebGL expertise needed</text>

  <text x="652" y="468" fill="#c8f750" font-family="Geist Mono, monospace" font-size="14">No-boilerplate creation · Publish direct</text>

  <text x="60" y="580" fill="#f472b6" font-family="Geist Mono, monospace" font-size="20" letter-spacing="2">Browser-native creative platform · code2motion.app</text>
</svg>
