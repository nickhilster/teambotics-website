<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="c2m-title c2m-desc">
  <title id="c2m-title">Code2Motion ToyMaker studio interface</title>
  <desc id="c2m-desc">ToyMaker studio showing a prompt-to-motion pipeline with Sidecar templates: General, Particles, Shader, and Audio.</desc>
  <defs>
    <radialGradient id="c2m-glow" cx="88%" cy="14%" r="52%">
      <stop offset="0%" stop-color="#3d1660" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0c0b14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c0b14"/>
  <rect width="1200" height="630" fill="url(#c2m-glow)"/>

  <!-- Nav eyebrow -->
  <text x="60" y="46" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="15" letter-spacing="1">code2motion /toymaker</text>

  <!-- Left heading -->
  <text x="60" y="118" fill="#6b6b78" font-family="Geist Mono, monospace" font-size="13" letter-spacing="3">TOYMAKER V1</text>
  <text x="60" y="188" fill="#ffffff" font-family="Bricolage Grotesque, sans-serif" font-size="62" font-weight="800">Make Something</text>
  <text x="60" y="252" fill="#ffffff" font-family="Bricolage Grotesque, sans-serif" font-size="62" font-weight="800">That Moves.</text>
  <text x="60" y="300" fill="#8b8b99" font-family="Hanken Grotesk, sans-serif" font-size="18">Prompt-to-motion. Live preview.</text>
  <text x="60" y="324" fill="#8b8b99" font-family="Hanken Grotesk, sans-serif" font-size="18">Direct publish to Playroom.</text>

  <!-- Studio Snapshot card -->
  <rect x="512" y="24" width="648" height="402" rx="18" fill="#18161f" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="540" y="60" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="12" letter-spacing="2">STUDIO SNAPSHOT</text>
  <text x="1132" y="60" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="12" letter-spacing="2" text-anchor="end">TEMPLATE DRIVEN</text>

  <!-- Traffic lights -->
  <circle cx="540" cy="86" r="7" fill="#ff5f57"/>
  <circle cx="562" cy="86" r="7" fill="#ffbd2e"/>
  <circle cx="584" cy="86" r="7" fill="#28c840"/>

  <!-- PROMPT field -->
  <text x="540" y="120" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="12" letter-spacing="2">PROMPT</text>
  <rect x="540" y="128" width="592" height="72" rx="10" fill="#0d0c17"/>
  <text x="560" y="156" fill="#f4f4f6" font-family="Hanken Grotesk, sans-serif" font-size="17">electric tide pools with drifting particles</text>
  <text x="560" y="180" fill="#f4f4f6" font-family="Hanken Grotesk, sans-serif" font-size="17">that flare when you tap</text>

  <!-- SIDECAR + INTERACTSTYLE -->
  <rect x="540" y="216" width="280" height="62" rx="10" fill="#0d0c17"/>
  <text x="560" y="238" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="11" letter-spacing="2">SIDECAR</text>
  <text x="560" y="264" fill="#f4f4f6" font-family="Hanken Grotesk, sans-serif" font-size="22" font-weight="700">Particles</text>

  <rect x="836" y="216" width="296" height="62" rx="10" fill="#0d0c17"/>
  <text x="856" y="238" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="11" letter-spacing="2">INTERACTSTYLE</text>
  <text x="856" y="264" fill="#f4f4f6" font-family="Hanken Grotesk, sans-serif" font-size="22" font-weight="700">tap</text>

  <!-- Pipeline -->
  <rect x="540" y="294" width="592" height="52" rx="10" fill="#0d0c17"/>
  <text x="558" y="325" fill="#6b6b78" font-family="Geist Mono, monospace" font-size="13">generate(prompt)</text>
  <text x="700" y="325" fill="#9966ff" font-family="Geist Mono, monospace" font-size="13"> →  </text>
  <text x="730" y="325" fill="#6b6b78" font-family="Geist Mono, monospace" font-size="13">preview(data:url)</text>
  <text x="876" y="325" fill="#9966ff" font-family="Geist Mono, monospace" font-size="13"> →  </text>
  <text x="906" y="325" fill="#6b6b78" font-family="Geist Mono, monospace" font-size="13">publish(render/[id])</text>

  <!-- Sub row -->
  <rect x="540" y="362" width="592" height="42" rx="10" fill="#0d0c17"/>
  <text x="558" y="388" fill="#404050" font-family="Geist Mono, monospace" font-size="13">No WebGL boilerplate · instant preview · PWA-ready</text>

  <!-- Feature cards -->
  <rect x="60" y="450" width="252" height="120" rx="14" fill="#15141c" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="80" y="476" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="11" letter-spacing="2">ADAPTIVE TEMPLATE</text>
  <text x="80" y="506" fill="#ffffff" font-family="Bricolage Grotesque, sans-serif" font-size="28" font-weight="800">General</text>
  <text x="80" y="532" fill="#5a5a68" font-family="Hanken Grotesk, sans-serif" font-size="14">Flexible motion systems</text>

  <rect x="328" y="450" width="252" height="120" rx="14" fill="#15141c" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="348" y="476" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="11" letter-spacing="2">FORCE FIELDS</text>
  <text x="348" y="506" fill="#ffffff" font-family="Bricolage Grotesque, sans-serif" font-size="28" font-weight="800">Particles</text>
  <text x="348" y="532" fill="#5a5a68" font-family="Hanken Grotesk, sans-serif" font-size="14">Boids, swarms, mag fields</text>

  <rect x="596" y="450" width="252" height="120" rx="14" fill="#15141c" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="616" y="476" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="11" letter-spacing="2">GLSL SURFACES</text>
  <text x="616" y="506" fill="#ffffff" font-family="Bricolage Grotesque, sans-serif" font-size="28" font-weight="800">Shader</text>
  <text x="616" y="532" fill="#5a5a68" font-family="Hanken Grotesk, sans-serif" font-size="14">Fragment shaders, plasma</text>

  <rect x="864" y="450" width="276" height="120" rx="14" fill="#15141c" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="884" y="476" fill="#5a5a68" font-family="Geist Mono, monospace" font-size="11" letter-spacing="2">FFT REACTIONS</text>
  <text x="884" y="506" fill="#ffffff" font-family="Bricolage Grotesque, sans-serif" font-size="28" font-weight="800">Audio</text>
  <text x="884" y="532" fill="#5a5a68" font-family="Hanken Grotesk, sans-serif" font-size="14">Mic-aware visualizers</text>
</svg>
