<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="easy-title easy-desc">
  <title id="easy-title">EasyBuddy mobile dashboard</title>
  <desc id="easy-desc">EasyBuddy warm-theme mobile app: morning greeting, Today's Tasks checklist with job assignments, and Messages from Manager section.</desc>

  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#fdf8f3"/>

  <!-- Left: heading area -->
  <text x="60" y="100" fill="#1a0a00" font-family="Geist Mono, monospace" font-size="13" letter-spacing="3">EASYBUDDY · FIELD READY</text>
  <text x="60" y="178" fill="#1a0a00" font-family="Bricolage Grotesque, sans-serif" font-size="58" font-weight="800">Ready before</text>
  <text x="60" y="240" fill="#1a0a00" font-family="Bricolage Grotesque, sans-serif" font-size="58" font-weight="800">the shift starts.</text>
  <text x="60" y="286" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="18">Daily tasks, job check-ins,</text>
  <text x="60" y="310" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="18">training — all in one place.</text>

  <!-- Phone frame -->
  <rect x="420" y="20" width="360" height="596" rx="36" fill="#1a0a00" stroke="#1a0a00" stroke-width="2"/>
  <rect x="430" y="30" width="340" height="576" rx="28" fill="#fdf8f3"/>

  <!-- Status bar -->
  <text x="455" y="58" fill="#1a0a00" font-family="Geist Mono, monospace" font-size="12">9:41</text>
  <rect x="700" y="46" width="44" height="14" rx="7" fill="#1a0a00" fill-opacity="0.12"/>
  <text x="748" y="58" fill="#1a0a00" font-family="Geist Mono, monospace" font-size="12">●●●</text>

  <!-- App header -->
  <rect x="430" y="66" width="340" height="52" fill="#f96c1b"/>
  <text x="600" y="98" fill="#ffffff" font-family="Bricolage Grotesque, sans-serif" font-size="20" font-weight="700" text-anchor="middle">EasyBuddy</text>

  <!-- Morning greeting -->
  <text x="455" y="146" fill="#1a0a00" font-family="Bricolage Grotesque, sans-serif" font-size="18" font-weight="700">Good morning, Jake! ☀️</text>
  <text x="455" y="168" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="13">Wednesday · 3 tasks today</text>

  <!-- Today's Tasks card -->
  <rect x="442" y="184" width="316" height="238" rx="16" fill="#ffffff" stroke="#f0e6db" stroke-width="1"/>
  <text x="462" y="210" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="14" font-weight="700">Today's Tasks</text>
  <rect x="726" y="196" width="18" height="18" rx="4" fill="#f96c1b" fill-opacity="0.15"/>
  <text x="735" y="209" fill="#f96c1b" font-family="Geist Mono, monospace" font-size="10" text-anchor="middle">3</text>

  <!-- Task 1: checked -->
  <rect x="462" y="222" width="296" height="44" rx="10" fill="#f96c1b" fill-opacity="0.08"/>
  <rect x="472" y="234" width="20" height="20" rx="5" fill="#f96c1b"/>
  <text x="482" y="248" fill="#ffffff" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle">✓</text>
  <text x="504" y="245" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600">Clock in</text>
  <text x="504" y="260" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="11">Completed 8:02 AM</text>

  <!-- Task 2: pending -->
  <rect x="462" y="272" width="296" height="44" rx="10" fill="#f9f4ef"/>
  <rect x="472" y="284" width="20" height="20" rx="5" fill="none" stroke="#f96c1b" stroke-width="2"/>
  <text x="504" y="295" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600">Check-in vehicle Job #4215</text>
  <text x="504" y="310" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="11">Due by 9:00 AM</text>

  <!-- Task 3: pending -->
  <rect x="462" y="322" width="296" height="44" rx="10" fill="#f9f4ef"/>
  <rect x="472" y="334" width="20" height="20" rx="5" fill="none" stroke="#c8c0b8" stroke-width="2"/>
  <text x="504" y="345" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="13" font-weight="600">Safety checklist</text>
  <text x="504" y="360" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="11">Before first job</text>

  <!-- Task 4: training -->
  <rect x="462" y="372" width="296" height="36" rx="10" fill="#f9f4ef"/>
  <rect x="472" y="381" width="20" height="20" rx="5" fill="none" stroke="#c8c0b8" stroke-width="2"/>
  <text x="504" y="395" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="13">Training module · 5 min</text>

  <!-- Messages card -->
  <rect x="442" y="432" width="316" height="120" rx="16" fill="#ffffff" stroke="#f0e6db" stroke-width="1"/>
  <text x="462" y="456" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="14" font-weight="700">Messages</text>
  <rect x="462" y="466" width="296" height="50" rx="10" fill="#f9f4ef"/>
  <circle cx="482" cy="491" r="12" fill="#f96c1b"/>
  <text x="482" y="496" fill="#ffffff" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="700" text-anchor="middle">M</text>
  <text x="502" y="484" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="600">Manager · Mike</text>
  <text x="502" y="500" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="11">Job #4215 — client prefers afternoon</text>
  <text x="730" y="484" fill="#f96c1b" font-family="Geist Mono, monospace" font-size="10" text-anchor="end">8:47 AM</text>

  <!-- Bottom nav -->
  <rect x="430" y="556" width="340" height="50" rx="0" fill="#ffffff" stroke="#f0e6db" stroke-width="1"/>
  <rect x="430" y="590" width="340" height="16" rx="0" fill="#ffffff"/>
  <!-- Nav items -->
  <text x="494" y="580" fill="#f96c1b" font-family="Geist Mono, monospace" font-size="9" text-anchor="middle">Home</text>
  <text x="556" y="580" fill="#8c6a50" font-family="Geist Mono, monospace" font-size="9" text-anchor="middle">Jobs</text>
  <text x="600" y="580" fill="#8c6a50" font-family="Geist Mono, monospace" font-size="9" text-anchor="middle">Training</text>
  <text x="648" y="580" fill="#8c6a50" font-family="Geist Mono, monospace" font-size="9" text-anchor="middle">Chat</text>
  <text x="706" y="580" fill="#8c6a50" font-family="Geist Mono, monospace" font-size="9" text-anchor="middle">Profile</text>

  <!-- Right: feature chips -->
  <text x="840" y="100" fill="#1a0a00" font-family="Geist Mono, monospace" font-size="13" letter-spacing="2">FOR FIELD TEAMS</text>

  <rect x="840" y="118" width="300" height="72" rx="14" fill="#ffffff" stroke="#f0e6db" stroke-width="1"/>
  <text x="862" y="144" fill="#f96c1b" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1">DAILY READINESS</text>
  <text x="862" y="170" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="14">Task checklists, clock-in,</text>
  <text x="862" y="188" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="13">vehicle &amp; safety checks</text>

  <rect x="840" y="204" width="300" height="72" rx="14" fill="#ffffff" stroke="#f0e6db" stroke-width="1"/>
  <text x="862" y="230" fill="#f96c1b" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1">JOB MANAGEMENT</text>
  <text x="862" y="256" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="14">Job details, client notes,</text>
  <text x="862" y="274" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="13">real-time status updates</text>

  <rect x="840" y="290" width="300" height="72" rx="14" fill="#ffffff" stroke="#f0e6db" stroke-width="1"/>
  <text x="862" y="316" fill="#f96c1b" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1">INLINE TRAINING</text>
  <text x="862" y="342" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="14">Short modules between jobs,</text>
  <text x="862" y="360" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="13">progress tracked per worker</text>

  <rect x="840" y="376" width="300" height="72" rx="14" fill="#ffffff" stroke="#f0e6db" stroke-width="1"/>
  <text x="862" y="402" fill="#f96c1b" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1">MANAGER COMMS</text>
  <text x="862" y="428" fill="#1a0a00" font-family="Hanken Grotesk, sans-serif" font-size="14">Direct messaging, shift notes,</text>
  <text x="862" y="446" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="13">broadcast announcements</text>

  <text x="840" y="504" fill="#8c6a50" font-family="Hanken Grotesk, sans-serif" font-size="14">teambotics.app/easybuddy</text>
</svg>
